}

/* ===== Game 1: Wake Up Violet! (matches storyboard "Page 7") =====
   Each method plays a real clip from art/wake/<clip>.mp4 if you've
   generated it; otherwise falls back to a comic sound-effect pop +
   shake so the game is fully playable while you wait on the animation.
   Drop files named exactly: trumpet.mp4, feather.mp4, bell.mp4, balloon.mp4
   into app/art/wake/ and they'll be used automatically. */
const WAKE_METHODS = [
  {id:'horn',    emoji:'🎺', clip:'tuba',    sfx:'OOMPAH!'},
  {id:'drum',    emoji:'🥁', clip:'drum',    sfx:'BOOM BOOM!'},
  {id:'feather', emoji:'🪶', clip:'feather', sfx:'Tickle tickle!'},
  {id:'balloon', emoji:'🎈', clip:'balloon', sfx:'BANG!'},
  {id:'guitar',  emoji:'🎸', clip:'guitar',  sfx:'Twang!'},
  {id:'gong',    emoji:'<svg viewBox="0 0 40 40" style="width:1.2em;height:1.2em;vertical-align:-0.15em" xmlns="http://www.w3.org/2000/svg"><path d="M7 6 L7 12 M33 6 L33 12" stroke="#7a5c3a" stroke-width="3" stroke-linecap="round"/><line x1="7" y1="6" x2="33" y2="6" stroke="#7a5c3a" stroke-width="3" stroke-linecap="round"/><line x1="20" y1="12" x2="20" y2="16" stroke="#7a5c3a" stroke-width="2" stroke-linecap="round"/><circle cx="20" cy="26" r="13" fill="#e8b64a" stroke="#a8781f" stroke-width="2"/><circle cx="20" cy="26" r="8.5" fill="none" stroke="#a8781f" stroke-width="1.4" opacity=".65"/><circle cx="17" cy="21" r="2.2" fill="#fff" opacity=".55"/></svg>', clip:'gong',    sfx:'GONNNG!'}
];
/* Winning wake-up combinations. Any single sound tapped THREE times in a row
   wakes Violet — auto-generated for every method below — plus a couple of fun
   mixed combos. Edit this list to add/remove patterns. */
const WAKE_WINNING_SEQUENCES = [
  ...WAKE_METHODS.map(m => [m.id, m.id, m.id]),   // any sound x3 in a row wins
  ['drum','horn','feather'],
  ['guitar','feather','horn']
];
let wakeSequence=[], wakeGen=0, wakeResetTimer=null;
function renderWakeGame(stage){
  wakeSequence=[]; wakeGen++;
  if(wakeResetTimer){ clearTimeout(wakeResetTimer); wakeResetTimer=null; }
  stage.innerHTML = `
    <p class="ask">Help Lainey wake up Violet!</p>
    <div class="wakeStage" id="wakeStage"><img src="art/wakeupviolet.png" alt="sleepy Violet"></div>
    <div class="wakeDial">
      <div class="wakeDialLabel" id="wakeDialLabel">Try to wake up Violet with a sound!</div>
      <div class="wakeDialTrack"><div class="wakeDialFill" id="wakeDialFill" style="width:0%"></div></div>
    </div>
    <div class="wakeMethods" id="wakeMethods"></div>
    <div class="feedback" id="wakeFeedback"></div>
  `;
  document.getElementById('wakeMethods').innerHTML = WAKE_METHODS.map((m,i)=>
    `<button class="method" id="wakeBtn${i}" onclick="wakeTap(${i})">${m.emoji}</button>`).join('');
  playAudio('wakevioletup', "Help Lainey wake up Violet! Tap a sound to try to wake her up!", null, ()=>{});
}
function updateWakeDial(progress, label){
  const fill = document.getElementById('wakeDialFill');
  const lbl = document.getElementById('wakeDialLabel');
  if(fill) fill.style.width = Math.round(progress*100)+'%';
  if(lbl && label) lbl.textContent = label;
}
/* best progress (0-1) toward any winning sequence, given taps so far are
   a valid start of it; 0 if the current taps can't lead anywhere */
function wakeBestProgress(seq){
  let best = 0;
  for(const w of WAKE_WINNING_SEQUENCES){
    if(seq.length > w.length) continue;
    if(w.slice(0, seq.length).every((v,i)=>v===seq[i])) best = Math.max(best, seq.length/w.length);
  }
  return best;
}
function wakeExactMatch(seq){
  return WAKE_WINNING_SEQUENCES.some(w => w.length===seq.length && w.every((v,i)=>v===seq[i]));
}
function wakeTap(i){
  const stageEl = document.getElementById('wakeStage');
  /* let a new tap interrupt whatever's currently playing instead of
     waiting for it to finish: bump the generation so any pending
     'ended'/timeout callback from the old tap becomes a no-op, cancel
     a pending dead-end reset, and clear out the old clip immediately. */
  wakeGen++;
  const myGen = wakeGen;
  if(wakeResetTimer){ clearTimeout(wakeResetTimer); wakeResetTimer=null; wakeSequence=[]; }
  const oldVid = stageEl.querySelector('video');
  if(oldVid){ try{ oldVid.pause(); }catch(e){} oldVid.remove(); }
  const method = WAKE_METHODS[i];
  wakeSequence.push(method.id);
  /* check BEFORE playing anything whether this exact tap completes a
     winning sequence, so we know which of the two clips to show: the
     "...awake" version if she wakes up on this tap, or the regular
     reaction clip if not. After 4 tries (taps 1-4) with no win, the 5th
     tap always wakes her up with whichever icon was just tapped, so no
     one gets stuck failing forever. */
  const isWinning = wakeExactMatch(wakeSequence) || wakeSequence.length >= 5;
  if(isWinning){
    // lock input once she's won so a fast extra tap can't cut off the celebration
    document.querySelectorAll('.method').forEach(b=>b.disabled=true);
  }
  const clipToPlay = isWinning ? (method.awakeClip || method.clip+'awake') : method.clip;
  playWakeClip(clipToPlay, ()=>wakeFallbackReaction(method, isWinning, myGen), isWinning, myGen);
}
/* tries the real animated clip; if it doesn't exist yet, runs the fallback */
function playWakeClip(clipName, fallbackFn, isWinning, myGen){
  const stageEl = document.getElementById('wakeStage');
  const vid = document.createElement('video');
  // cache-bust so a replaced clip (e.g. a new drumawake.mp4) is fetched
  // fresh instead of the browser serving an old cached copy
  vid.src = `art/wake/${clipName}.mp4?v=${Date.now()}`;
  vid.playsInline = true; vid.autoplay = false;
  vid.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:5;';
  let handled=false;
  const cleanup = ()=>{ if(vid.parentNode) vid.remove(); };
  vid.addEventListener('error', ()=>{ if(!handled){ handled=true; cleanup(); fallbackFn(); } });
  vid.addEventListener('ended', ()=>{ cleanup(); if(myGen===wakeGen) wakeAfterTap(isWinning); });
  stageEl.appendChild(vid);
  const p = vid.play();
  if(p && p.catch){ p.catch(()=>{ if(!handled){ handled=true; cleanup(); fallbackFn(); } }); }
}
function wakeFallbackReaction(method, isWinning, myGen){
  const stageEl = document.getElementById('wakeStage');
  stageEl.classList.remove('shake'); void stageEl.offsetWidth; stageEl.classList.add('shake');
  const pop=document.createElement('div');
  pop.className='sfxPop'; pop.textContent=method.sfx;
  stageEl.appendChild(pop); setTimeout(()=>pop.remove(),850);
  const sparkle=document.createElement('div');
  sparkle.className='sparkle'; sparkle.textContent='✨';
  sparkle.style.left=(30+Math.random()*40)+'%'; sparkle.style.top=(30+Math.random()*30)+'%';
  stageEl.appendChild(sparkle); setTimeout(()=>sparkle.remove(),1000);
  setTimeout(()=>{ if(myGen===wakeGen) wakeAfterTap(isWinning); }, 700);
}
function wakeAfterTap(isWinning){
  const fb = document.getElementById('wakeFeedback');
  if(isWinning){
    updateWakeDial(1, "That's it!!");
    fb.textContent = '';
    wakeCelebrate();
    return;
  }
  const progress = wakeBestProgress(wakeSequence);
  if(progress > 0){
    updateWakeDial(progress, progress > 0.6 ? "Getting warmer!" : "Keep trying...");
    fb.textContent = '';
  } else {
    updateWakeDial(0.12, "Not quite...");
    fb.textContent = 'Hmm, try a different combination!';
    const myGen = wakeGen;
    wakeResetTimer = setTimeout(()=>{
      if(myGen!==wakeGen) return;
      wakeSequence = [];
      updateWakeDial(0, "Try to wake up Violet with a sound!");
      fb.textContent = '';
      wakeResetTimer = null;
    }, 900);
  }
}
/* the instrument wake clip has just finished (she's shown waking up to
   that sound), so now play the shared "Violet is awake!" reward clip,
   then the confetti celebration. */
function wakeCelebrate(){
  document.querySelectorAll('.method').forEach(b=>b.disabled=true);
  playWakeReward(wakeConfetti);
}
/* tries a real reward clip at art/violetisawake.mp4; if it doesn't exist
   yet (or fails to load), falls straight to the confetti celebration. It
   plays after the wake clip's 'ended' (not a tap), so start muted to
   guarantee autoplay, then unmute once running — same as the other games. */
function playWakeReward(fallbackFn){
  const stageEl = document.getElementById('wakeStage');
  const vid = document.createElement('video');
  vid.src = 'art/violetisawake.mp4?v='+Date.now();
  vid.playsInline = true; vid.autoplay = false;
  vid.muted = true;
  vid.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:8;';
  let handled=false;
  const cleanup = ()=>{ if(vid.parentNode) vid.remove(); };
  vid.addEventListener('error', ()=>{ if(!handled){ handled=true; cleanup(); fallbackFn(); } });
  vid.addEventListener('ended', ()=>{ cleanup(); fallbackFn(); });
  vid.addEventListener('playing', ()=>{ vid.muted = false; }, {once:true});
  stageEl.appendChild(vid);
  const p = vid.play();
  if(p && p.catch){ p.catch(()=>{ if(!handled){ handled=true; cleanup(); fallbackFn(); } }); }
}
function wakeConfetti(){
  const stageEl = document.getElementById('wakeStage');
  const fb = document.getElementById('wakeFeedback');
  stageEl.classList.add('awake');
  fb.innerHTML='<span class="star">⭐ Violet is awake! Great job! ⭐</span>';
  for(let c=0;c<14;c++){
    const conf=document.createElement('div');
    conf.className='confetti';
    conf.textContent=['🎉','✨','🎊'][c%3];
    conf.style.left=(5+Math.random()*90)+'%';
    conf.style.top=(10+Math.random()*20)+'%';
    conf.style.animationDelay=(Math.random()*.3)+'s';
    stageEl.appendChild(conf);
    setTimeout(()=>conf.remove(),1500);
  }
}

/* ===== Game: Down the Tree (drag maze) =====
   A freshly-generated maze every time (recursive-backtracker, so it's
   always solvable with exactly one path). Drag Violet from branch to
   branch — she only hops to a neighboring cell if there's no wall
   between it and her current spot. */
const MAZE_COLS = 6, MAZE_ROWS = 10;   // portrait maze (taller = larger on a phone)
const MAZE_WALL_COLOR = '#3f7a2e';
const MAZE_FLOWER_COLORS = ['#ff6fa3','#b06fe0','#ffd93d','#ff8c42','#5eb8ff'];
const MAZE_ASK = 'Drag Violet through the bushes to find Lainey!';
let mazeGrid=null, mazeGoal=null, mazePlayer=null, mazeTrail=[], mazeCanvas=null, mazeCtx=null, mazeCell=0, mazeWon=false, mazeDragging=false, mazePendingReward=false;
let mazeRewardVid=null, mazeRewardUnlocked=false;
const mazeVioletImg = new Image(); mazeVioletImg.src = 'art/violetmaze.png';
mazeVioletImg.onload = ()=>{ if(mazeCanvas) drawMaze(); };
const mazeLaineyImg = new Image(); mazeLaineyImg.src = 'art/laineymaze.png';
mazeLaineyImg.onload = ()=>{ if(mazeCanvas) drawMaze(); };
/* a small bush image, tiled with a canvas pattern to paint the maze
   walls themselves — see art/maze/README.txt for the exact filename */
const mazeBushTileImg = new Image(); mazeBushTileImg.src = 'art/maze/bush-tile.png';
let mazeBushPattern = null, mazeBushPatternCell = 0;
mazeBushTileImg.onload = ()=>{ mazeBushPattern=null; if(mazeCanvas) drawMaze(); };
function renderMazeGame(stage){
  stage.innerHTML = `
    <p class="ask">${MAZE_ASK}</p>
    <div class="mazeStage">
      <canvas id="mazeCanvas"></canvas>
    </div>
    <div class="feedback" id="mazeFeedback"></div>
    <button class="btn btn-daisy" id="mazePlayAgainBtn" onclick="renderMazeGame(document.getElementById('stageArea'))" style="visibility:hidden">🔁 Play Again</button>
  `;
  const startX = 0, startY = MAZE_ROWS-1;
  mazeGrid = generateMaze(MAZE_COLS, MAZE_ROWS, startX, startY);
  mazeGoal = {x: MAZE_COLS-1, y: 0};
  mazePlayer = {x:startX, y:startY};
  mazeTrail = [{x:startX, y:startY}];
  mazeWon = false; mazePendingReward = false;
  mazeCanvas = document.getElementById('mazeCanvas');
  mazeCtx = mazeCanvas.getContext('2d');
  const rect = mazeCanvas.parentElement.getBoundingClientRect();
  mazeCanvas.width = Math.round(rect.width);
  mazeCanvas.height = Math.round(rect.height);
  mazeCell = mazeCanvas.width / MAZE_COLS;
  drawMaze();
  // Build the reward video NOW (hidden). It gets "unlocked" on the child's very
  // first touch (a real gesture), which is what lets it later auto-play WITH
  // sound at the win — no tap needed at the end.
  mazeRewardVid = document.createElement('video');
  mazeRewardVid.src = 'art/maze/mazefound.mp4?v='+Date.now();
  mazeRewardVid.playsInline = true; mazeRewardVid.preload = 'auto';
  mazeRewardVid.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:5;border-radius:22px;display:none;';
  document.querySelector('.mazeStage').appendChild(mazeRewardVid);
  mazeRewardUnlocked = false;
  mazeCanvas.addEventListener('pointerdown', mazePointerDown);
  mazeCanvas.addEventListener('pointermove', mazePointerMove);
  // setPointerCapture retargets pointerup/cancel to the canvas even if the
  // finger/mouse ends up outside it, so no need for a window-level listener
  // (which would otherwise pile up a new one every time this game is entered)
  mazeCanvas.addEventListener('pointerup', mazePointerUp);
  mazeCanvas.addEventListener('pointercancel', mazePointerUp);
  playAudio('dragvioletthroughthebushes', MAZE_ASK);
}
function generateMaze(cols, rows, startX, startY){
  const cells = [];
  for(let y=0;y<rows;y++){
    const row=[];
    for(let x=0;x<cols;x++) row.push({N:true,S:true,E:true,W:true,visited:false});
    cells.push(row);
  }
  const OPP = {N:'S',S:'N',E:'W',W:'E'};
  function carve(cx,cy){
    cells[cy][cx].visited = true;
    const dirs = [['N',0,-1],['S',0,1],['E',1,0],['W',-1,0]].sort(()=>Math.random()-.5);
    for(const [dir,dx,dy] of dirs){
      const nx=cx+dx, ny=cy+dy;
      if(nx<0||ny<0||nx>=cols||ny>=rows) continue;
      if(cells[ny][nx].visited) continue;
      cells[cy][cx][dir]=false;
      cells[ny][nx][OPP[dir]]=false;
      carve(nx,ny);
    }
  }
  carve(startX,startY);
  return cells;
}
/* deterministic 0..1 "random" per wall segment, so the organic wobble
   stays put across redraws instead of jittering every time a cell moves */
function mazeHash(a,b,c,d){
  let h = (a*374761393 + b*668265263 + c*2246822519 + d*3266489917) % 2147483647;
  if(h<0) h += 2147483647;
  return h/2147483647;
}
/* draws one wall as a slightly curved, varied-width stroke — reads more
   like a tree branch than a ruler-straight maze line — with a tiny leaf
   accent on some segments */
/* lazily builds (and caches) a repeating canvas pattern from the bush
   tile image, scaled to a sensible size relative to the current cell
   size; falls back to a solid color until the tile image is ready */
function mazeWallStyle(){
  const ctx = mazeCtx, cs = mazeCell;
  if(mazeBushTileImg.complete && mazeBushTileImg.naturalWidth){
    if(!mazeBushPattern || mazeBushPatternCell !== cs){
      mazeBushPattern = ctx.createPattern(mazeBushTileImg, 'repeat');
      if(mazeBushPattern && mazeBushPattern.setTransform){
        const scale = (cs*0.55) / mazeBushTileImg.naturalWidth;
        mazeBushPattern.setTransform(new DOMMatrix().scale(scale));
      }
      mazeBushPatternCell = cs;
    }
    return mazeBushPattern;
  }
  return MAZE_WALL_COLOR;
}
function mazeBranchLine(x1,y1,x2,y2,cs){
  const ctx = mazeCtx;
  const t = mazeHash(Math.round(x1),Math.round(y1),Math.round(x2),Math.round(y2));
  const midx=(x1+x2)/2, midy=(y1+y2)/2;
  const dx=x2-x1, dy=y2-y1, len=Math.hypot(dx,dy)||1;
  const nx=-dy/len, ny=dx/len;
  const bulge=(t-0.5)*cs*0.14;
  const cx=midx+nx*bulge, cy=midy+ny*bulge;
  ctx.lineWidth = cs*0.38;
  ctx.strokeStyle = mazeWallStyle();
  ctx.beginPath();
  ctx.moveTo(x1,y1);
  ctx.quadraticCurveTo(cx,cy,x2,y2);
  ctx.stroke();
  if(t>0.55){
    // little flower dot, colored from a fixed palette, scattered along
    // some of the hedge walls for a "colorful bushes" feel
    const flower = MAZE_FLOWER_COLORS[Math.floor(t*97)%MAZE_FLOWER_COLORS.length];
    ctx.save();
    ctx.fillStyle = flower;
    ctx.beginPath();
    ctx.arc(cx,cy,cs*0.06,0,Math.PI*2);
    ctx.fill();
    ctx.restore();
  }
}
function drawMaze(){
  const ctx = mazeCtx, cs = mazeCell;
  ctx.clearRect(0,0,mazeCanvas.width,mazeCanvas.height);
  ctx.lineCap = 'round';
  for(let y=0;y<MAZE_ROWS;y++){
    for(let x=0;x<MAZE_COLS;x++){
      const c = mazeGrid[y][x];
      const px=x*cs, py=y*cs;
      if(c.N) mazeBranchLine(px,py,px+cs,py,cs);
      if(c.S) mazeBranchLine(px,py+cs,px+cs,py+cs,cs);
      if(c.W) mazeBranchLine(px,py,px,py+cs,cs);
      if(c.E) mazeBranchLine(px+cs,py,px+cs,py+cs,cs);
    }
  }
  ctx.strokeStyle = 'rgba(123,78,168,.45)';
  ctx.lineWidth = Math.max(4, cs*0.16);
  ctx.beginPath();
  mazeTrail.forEach((p,i)=>{
    const cx=p.x*cs+cs/2, cy=p.y*cs+cs/2;
    if(i===0) ctx.moveTo(cx,cy); else ctx.lineTo(cx,cy);
  });
  ctx.stroke();
  mazeDrawToken(mazeLaineyImg, mazeGoal.x, mazeGoal.y, cs, 1.35);
  mazeDrawToken(mazeVioletImg, mazePlayer.x, mazePlayer.y, cs, 1.5);
}
/* draws a character token in a maze cell: a soft rounded halo behind it
   (so it stays legible over the busy photo background) with the real
   book art clipped to a circle on top; falls back to just the halo if
   the image hasn't finished loading yet (redraws once it has). */
function mazeDrawToken(img, cellX, cellY, cs, sizeFactor){
  const ctx = mazeCtx;
  if(!(img.complete && img.naturalWidth)) return;
  const size = cs*sizeFactor;
  const iw = img.naturalWidth, ih = img.naturalHeight;
  const scale = size/Math.max(iw,ih);
  const dw = iw*scale, dh = ih*scale;
  // Violet's start and Lainey's goal both sit in corner cells, so a token
  // bigger than its cell (sizeFactor > 1, by design so they stand out)
  // would otherwise draw partly off the canvas — nudge the center inward
  // just enough to keep the whole token on-screen.
  let cx = cellX*cs+cs/2, cy = cellY*cs+cs/2;
  cx = Math.max(dw/2, Math.min(mazeCanvas.width-dw/2, cx));
  cy = Math.max(dh/2, Math.min(mazeCanvas.height-dh/2, cy));
  ctx.save();
  ctx.shadowColor='rgba(0,0,0,.35)'; ctx.shadowBlur=cs*0.12; ctx.shadowOffsetY=cs*0.02;
  ctx.drawImage(img, cx-dw/2, cy-dh/2, dw, dh);
  ctx.restore();
}
function mazePointerDown(e){
  if(mazeWon) return;
  mazeUnlockReward();          // this touch IS a gesture — use it to unlock the reward's sound
  mazeDragging = true;
  mazeCanvas.setPointerCapture(e.pointerId);
  mazeTryMoveTo(e);
}
/* Unlock the reward clip during a real touch so it can auto-play WITH sound at
   the win. The element is started UNMUTED (that's what grants sound rights) and
   paused in the SAME instant — the browser marks it user-initiated but never
   actually renders any audio, so the child hears nothing. Runs once per game. */
function mazeUnlockReward(){
  if(mazeRewardUnlocked || !mazeRewardVid) return;
  mazeRewardUnlocked = true;
  const v = mazeRewardVid;
  v.muted = false;
  const p = v.play();
  v.pause();                       // synchronous — stops it before any sound comes out
  try{ v.currentTime = 0; }catch(_){}
  if(p && p.catch){ p.catch(()=>{ /* blocked -> the win falls back to the tap button */ }); }
}
function mazePointerMove(e){
  if(!mazeDragging || mazeWon) return;
  mazeTryMoveTo(e);
}
function mazePointerUp(){
  mazeDragging = false;
}
function mazeStartReward(){
  if(!mazePendingReward) return;
  mazePendingReward = false;
  playMazeWinClip(mazeCelebrate);
}
function mazeTryMoveTo(e){
  const rect = mazeCanvas.getBoundingClientRect();
  const px = (e.clientX-rect.left) * (mazeCanvas.width/rect.width);
  const py = (e.clientY-rect.top) * (mazeCanvas.height/rect.height);
  const gx = Math.floor(px/mazeCell), gy = Math.floor(py/mazeCell);
  if(gx<0||gy<0||gx>=MAZE_COLS||gy>=MAZE_ROWS) return;
  const dx = gx-mazePlayer.x, dy = gy-mazePlayer.y;
  if(Math.abs(dx)+Math.abs(dy) !== 1) return; // only step to an orthogonal neighbor
  const dir = dx===1?'E':dx===-1?'W':dy===1?'S':'N';
  if(mazeGrid[mazePlayer.y][mazePlayer.x][dir]) return; // wall in the way
  mazePlayer = {x:gx,y:gy};
  mazeTrail.push({x:gx,y:gy});
  drawMaze();
  if(gx===mazeGoal.x && gy===mazeGoal.y) mazeWin();
}
function mazeWin(){
  mazeWon = true;
  const stageEl = document.querySelector('.mazeStage');
  if(!stageEl){ playMazeWinClip(mazeCelebrate); return; }
  // The reward video was unlocked on the child's first touch, so it can play
  // right here — automatically, on the same page, WITH sound. If the browser
  // still refuses, fall back to the flashing tap button.
  const v = mazeRewardVid;
  if(v && mazeRewardUnlocked){
    v.style.display = 'block';
    v.muted = false;
    try{ v.currentTime = 0; }catch(_){}
    let handled=false;
    const finish = ()=>{ if(handled) return; handled=true; if(v.parentNode) v.remove(); mazeCelebrate(); };
    v.addEventListener('ended', finish, {once:true});
    v.addEventListener('error', ()=>{ if(!handled){ handled=true; if(v.parentNode) v.remove(); mazeShowTapReward(); } }, {once:true});
    const p = v.play();
    if(p && p.catch){ p.catch(()=>{ v.style.display='none'; mazeShowTapReward(); }); }
    return;
  }
  mazeShowTapReward();
}
/* fallback: flashing button — tapping it plays the reward WITH sound */
function mazeShowTapReward(){
  const stageEl = document.querySelector('.mazeStage'); if(!stageEl) return;
  if(document.getElementById('mazeTapReward')) return;
  const btn=document.createElement('button');
  btn.id='mazeTapReward'; btn.className='mazeTapReward'; btn.type='button';
  btn.innerHTML='<span class="mazeTapTri">▶</span><span class="mazeTapTxt">Tap to see Lainey! 🎉</span>';
  let done=false;
  btn.addEventListener('click', ()=>{ if(done) return; done=true; btn.remove(); playMazeWinClip(mazeCelebrate); });
  stageEl.appendChild(btn);
}
/* tries a real "found Lainey!" clip at art/maze/mazefound.mp4; if it
   doesn't exist yet (or fails to load), falls straight to the confetti
   celebration — same pattern as the wake-up game's clips */
function playMazeWinClip(fallbackFn){
  const stageEl = document.querySelector('.mazeStage');
  const vid = document.createElement('video');
  vid.src = 'art/maze/mazefound.mp4?v='+Date.now();
  vid.playsInline = true; vid.autoplay = false;
  vid.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:5;border-radius:22px;';
  let handled=false;
  const cleanup = ()=>{ if(vid.parentNode) vid.remove(); };
  const fail = ()=>{ if(!handled){ handled=true; cleanup(); fallbackFn(); } };
  vid.addEventListener('error', fail);
  vid.addEventListener('ended', ()=>{ cleanup(); fallbackFn(); });
  stageEl.appendChild(vid);
  // try WITH sound first (the finger-lift is a gesture); if the browser blocks
  // it, fall back to MUTED so the video ALWAYS plays. Never unmute mid-play —
  // that's what froze it on a frame.
  vid.muted = false;
  const p = vid.play();
  if(p && p.catch){
    p.catch(()=>{ vid.muted = true; const p2 = vid.play(); if(p2 && p2.catch){ p2.catch(fail); } });
  }
}
function mazeCelebrate(){
  const fb = document.getElementById('mazeFeedback');
  fb.innerHTML = '';   // no message after the reward video
  const stageEl = document.querySelector('.mazeStage');
  for(let c=0;c<14;c++){
    const conf=document.createElement('div');
    conf.className='confetti';
    conf.textContent=['🎉','✨','🎊'][c%3];
    conf.style.left=(5+Math.random()*90)+'%';
    conf.style.top=(10+Math.random()*20)+'%';
    conf.style.animationDelay=(Math.random()*.3)+'s';
    stageEl.appendChild(conf);
    setTimeout(()=>conf.remove(),1500);
  }
  const btn = document.getElementById('mazePlayAgainBtn');
  if(btn) btn.style.visibility = 'visible';
}

/* ===== Game: Kite Shape Match =====
   Real kites fly at the top, each marked with a shape; real kite-boxes
   sit at the bottom, each marked with a shape too. Drag each kite down
   into the box with the same shape to "pack it away". */
const KITE_SHAPES = [
  {id:'circle',   hex:'#e23b3b'},
  {id:'square',   hex:'#2196f3'},
  {id:'triangle', hex:'#4caf50'},
  {id:'star',     hex:'#ffd34e'}
];
const KITE_IMAGE_COLORS = ['blue','orange','pink','red','purple','rainbow'];
const KITE_SLOTS = [16, 40, 64, 88];
let kiteMatched = [], kiteShapeAssign = [];
function shapeInner(shapeId, hex){
  if(shapeId==='circle') return `<circle cx="30" cy="30" r="24" fill="${hex}" stroke="#2b1f1f" stroke-width="2.5"/>`;
  if(shapeId==='square') return `<rect x="8" y="8" width="44" height="44" rx="6" fill="${hex}" stroke="#2b1f1f" stroke-width="2.5"/>`;
  if(shapeId==='triangle') return `<polygon points="30,6 54,52 6,52" fill="${hex}" stroke="#2b1f1f" stroke-width="2.5" stroke-linejoin="round"/>`;
  return `<polygon points="30,4 37,22 56,22 41,34 47,53 30,42 13,53 19,34 4,22 23,22" fill="${hex}" stroke="#2b1f1f" stroke-width="2.5" stroke-linejoin="round"/>`;
}
function shapeSVG(shapeId, hex){
  return `<svg viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">${shapeInner(shapeId,hex)}</svg>`;
}
function kiteShuffle(a){
  a=[...a];
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
const KB_CHARS = {
  violet: {name:'Violet', plain:'art/violetplainframe.png', kite:'art/violetdecoframe.png', built1:'art/violetbuilt1.png', deco:'art/yellowflower.png', ref:'art/violetref.png', spoolItem:'art/spoolandropeviolet.png', giveBox:'art/violetkitebox1.png', supply:'art/kitesupplybox.png',
    bows:[{f:'toppurplebow',x:63.0,y:58.7,w:17.4},{f:'yellowbow',x:72.5,y:63.8,w:14.5},{f:'bottompurplebow',x:80.4,y:73.9,w:18.1}]},
  lainey: {name:'Lainey', plain:'art/laineyplainframe.png', kite:'art/laineydecoframe.png', built1:'art/laineybuilt1.png', deco:'art/blackdot.png',    ref:'art/laineyref.png', spoolItem:'art/spoolandthreadlainey.png', giveBox:'art/laineykitebox1.png', supply:'art/laineykitesupplybox.png',
    bows:[{f:'topredbow',x:65.9,y:58.2,w:16.4},{f:'topblackbow',x:74.8,y:62.3,w:13.6},{f:'lowredbow',x:79.5,y:68.4,w:13.6},{f:'lowblackbow',x:84.3,y:75.9,w:15.0}]}
};
let kbChar, kbPlaced, kbPhase, kbRAF, kbActive, kbCaught, kbTarget, kbSpawnTimer;
/* ---- pick whose kite to build ---- */
function renderKiteGame(stage){
  if(kbRAF) cancelAnimationFrame(kbRAF); kbRAF=null; kbActive=false;
  if(kbSpawnTimer){ clearInterval(kbSpawnTimer); kbSpawnTimer=null; }
  kbPhase='choose';
  stage.innerHTML = `
    <div class="kiteStage" id="kiteStage">
      <div class="kbHint kbChooseTitle">Whose kite will you build?</div>
      <div class="kbChoose">
        <button class="kbCharPick violet" onclick="kbChoose('violet')"><img src="art/violetkitebox1.png" alt="Violet"><span>Violet</span></button>
        <button class="kbCharPick lainey" onclick="kbChoose('lainey')"><img src="art/laineykitebox1.png" alt="Lainey"><span>Lainey</span></button>
      </div>
    </div>
    <div class="feedback" id="kiteFeedback"></div>`;
  playAudio('buildkite', "Whose kite will you build? Pick Violet or Lainey!", null);
}
/* ---- build the chosen kite: the plain kite is shown on the RIGHT next to a
   finished reference on the LEFT; the child adds the flowers/dot, the bows
   (multiple) and drops the spool in the box ---- */
function kbBuildParts(c){ return ['deco', ...c.bows.map((b,i)=>'bow'+i), 'spool']; }   // spool is now in the crate with the bows (locked until the kite is built)
function kbChoose(char){
  kbChar = char; kbPlaced = new Set(); kbPhase='build';
  const c = KB_CHARS[char];
  const kiteStage = document.getElementById('kiteStage');
  // the base kite (redkitebows/purplekitebows) already shows faint ghost bows on
  // the string; the child drags the real bows onto those exact spots
  const bowSolids = c.bows.map((b,i)=>`<img class="kbBowImg kbPart" id="kbPart-bow${i}" style="left:${b.x}%;top:${b.y}%;width:${b.w}%" src="art/${b.f}.png" alt="">`).join('');
  kiteStage.innerHTML = `
    <div class="kbHint" id="kbHint">Build the kite to match the one on the left!</div>
    <img class="kbRef kbRef-${char}" src="${c.ref}" alt="">
    <div class="kbAssembly kbBuildAsm" id="kbAssembly">
      <img class="kbKiteImg kbPart show" id="kbPart-kite" src="${c.plain}" alt="">
      <img class="kbSpoolLayer kbGhostSpool" id="kbGhostSpool" src="${c.spoolItem}" alt="">
      ${bowSolids}
      <img class="kbSpoolLayer kbPart" id="kbPart-spool" src="${c.spoolItem}" alt="">
    </div>
    <div class="kbTray" id="kbTray" style="background-image:url('${c.supply}')"></div>`;
  const tray = document.getElementById('kbTray');
  kiteShuffle(kbBuildParts(c)).forEach(part=>{
    const src = part==='deco' ? c.deco : part==='spool' ? c.spoolItem : 'art/'+c.bows[+part.slice(3)].f+'.png';
    const p = document.createElement('div');
    // the full-colour spool sits in the crate with the bows (drag it onto the grayed spool on the kite)
    p.className='kbPiece'; p.id='kbPiece-'+part; p.dataset.part=part;
    p.innerHTML = `<img src="${src}" alt="">`;
    p.addEventListener('pointerdown', (e)=>kbPieceDown(e, part, p, src));
    tray.appendChild(p);
  });
  playAudio(char==='violet'?'buildvioletskite':'buildlaineyskite', "Build "+c.name+"'s kite to match the one on the left!", null, ()=>{});
}
function kbPieceDown(e, part, pieceEl, src){
  if(kbPlaced.has(part)) return;
  if(pieceEl.classList.contains('kbLocked')) return;   // spool stays locked until the kite is built
  const stageEl = document.getElementById('kiteStage');
  const rect = stageEl.getBoundingClientRect();
  const w = pieceEl.querySelector('img').getBoundingClientRect().width;
  const drag = document.createElement('div');
  drag.className='kbDragging';
  drag.innerHTML = `<img src="${src}" style="width:${w}px" alt="">`;
  stageEl.appendChild(drag);
  pieceEl.style.visibility='hidden';
  try{ pieceEl.setPointerCapture(e.pointerId); }catch(_){}
  const move=(ev)=>{ drag.style.left=(ev.clientX-rect.left)+'px'; drag.style.top=(ev.clientY-rect.top)+'px'; };
  const up=(ev)=>{
    pieceEl.removeEventListener('pointermove',move);
    pieceEl.removeEventListener('pointerup',up);
    pieceEl.removeEventListener('pointercancel',up);
    try{ pieceEl.releasePointerCapture(ev.pointerId); }catch(_){}   // let the drop count as a clean gesture (helps the completion voice line)
    drag.remove();
    if(part.startsWith('bow')){
      // a bow must be dropped on ITS OWN spot — the nearest ghost spot must be this bow, else "try again"
      const bows = KB_CHARS[kbChar].bows;
      const asm = document.getElementById('kbAssembly').getBoundingClientRect();
      let closest=-1, best=Infinity;
      bows.forEach((b,i)=>{
        const tx = asm.left + b.x/100*asm.width, ty = asm.top + b.y/100*asm.height;
        const d = Math.hypot(ev.clientX-tx, ev.clientY-ty);
        if(d<best){ best=d; closest=i; }
      });
      if(closest === (+part.slice(3)) && best < asm.width*0.34){ kbPlacePart(part, pieceEl); }
      else { pieceEl.style.visibility='visible'; playAudio('tryagain', "Try again!", null, ()=>{}); }
    } else {
      // decoration AND spool -> dropped onto the kite (lenient)
      const t = document.getElementById('kbAssembly').getBoundingClientRect();
      const over = ev.clientX>t.left-55 && ev.clientX<t.right+55 && ev.clientY>t.top-55 && ev.clientY<t.bottom+55;
      if(over){ kbPlacePart(part, pieceEl); }
      else { pieceEl.style.visibility='visible'; }
    }
  };
  pieceEl.addEventListener('pointermove',move);
  pieceEl.addEventListener('pointerup',up);
  pieceEl.addEventListener('pointercancel',up);
  move(e);
}
function kbPlacePart(part, pieceEl){
  kbPlaced.add(part);
  pieceEl.classList.add('placed');
  if(part==='spool'){
    // spool goes on the rope -> hide the grayed ghost spool, reveal the full-colour one
    document.getElementById('kbGhostSpool')?.remove();
    const s = document.getElementById('kbPart-spool');
    if(s){ s.classList.add('show'); s.classList.remove('kbPopKite'); void s.offsetWidth; s.classList.add('kbPopKite'); }
  } else if(part==='deco'){
    // adding the flower / dot decorates the plain kite -> swap to decorated
    const k = document.getElementById('kbPart-kite');
    k.classList.add('show');
    k.src = KB_CHARS[kbChar].kite + '?v='+Date.now();
    k.classList.remove('kbPopKite'); void k.offsetWidth; k.classList.add('kbPopKite');
  } else {
    document.getElementById('kbPart-'+part)?.classList.add('show');
  }
  const total = 2 + KB_CHARS[kbChar].bows.length;   // deco + spool + all bows
  if(kbPlaced.size === total){
    // kite is finished — the box appears; tapping it plays the reward video
    // (which opens with the "Yay you made the kite!" line), so no separate
    // voice line here (it would be muted on iOS at a drag anyway, and would
    // double up with the video)
    document.getElementById('kbHint').textContent = 'Yay! You made the kite! 🪁';
    kbShowGiveBox();
    return;
  }
  // has the whole kite (decoration + every bow) been built? then unlock the spool
  const kiteParts = ['deco', ...KB_CHARS[kbChar].bows.map((b,i)=>'bow'+i)];
  if(!kbPlaced.has('spool') && kiteParts.every(p=>kbPlaced.has(p))){
    document.getElementById('kbPiece-spool')?.classList.remove('kbLocked');
    document.getElementById('kbHint').textContent = 'Now add the spool to the string!';
  }
  // (no per-piece "great job" while building the kite)
}
/* the finished kite is done — show the character's kite box below; clicking it
   (a real tap, so iOS lets the reward play WITH sound) "gives" the kite and
   plays the reward video */
function kbShowGiveBox(){
  const stageEl=document.getElementById('kiteStage'); if(!stageEl) return;
  document.getElementById('kbTray')?.remove();
  const c=KB_CHARS[kbChar];
  const box=document.createElement('button');
  box.id='kbGiveBox'; box.className='kbGiveBox'; box.type='button';
  box.innerHTML=`<img src="${c.giveBox}" alt="${c.name}'s kite box"><span class="kbGiveTip" id="kbGiveTip">Tap ${c.name}'s box! 🎁</span>`;
  // one tap on the box -> straight to the reward (played from the tap, so sound)
  let done=false;
  box.addEventListener('click', ()=>{ if(done) return; done=true; box.remove();
    playKiteReward(()=>{ const h=document.getElementById('kbHint'); if(h) h.textContent='🪁 Yay! Great job! 🎉'; }); });
  stageEl.appendChild(box);
}
/* ---- fly the finished kite: drag it around to catch the falling stars ---- */
const KB_CATCH_GLYPHS = ['☁️'];
function kbStartFly(){
  kbPhase='fly';
  const stageEl = document.getElementById('kiteStage');
  if(!stageEl) return;
  document.getElementById('kbTray')?.remove();
  document.querySelector('.kbRef')?.remove();
  document.querySelector('.kbRefLabel')?.remove();
  document.getElementById('kbPiece-spool')?.remove();
  document.getElementById('kbBox')?.remove();
  stageEl.querySelectorAll('.kbGhost').forEach(g=>g.remove());
  const asm = document.getElementById('kbAssembly');
  // the finished kite becomes the flyer
  asm.classList.remove('kbBuildAsm');
  asm.classList.add('kbFlyKite');
  asm.style.position='absolute';
  asm.style.height='auto'; asm.style.left='50%'; asm.style.top='56%'; asm.style.width='30%'; asm.style.transform='translate(-50%,-50%)';
  document.getElementById('kbHint').textContent = 'Move the kite to catch 8 clouds!';
  stageEl.insertAdjacentHTML('beforeend', '<div class="kbProgress" id="kbProgress"></div>');
  kbCaught=0; kbTarget=8; kbUpdatePips();
  kbActive=true;
  stageEl.addEventListener('pointermove', kbMoveKite);
  stageEl.addEventListener('pointerdown', kbMoveKite);
  // announce the whole cloud game on the FIRST clean touch of the fly stage —
  // iOS accepts that tap as a gesture, so the voice line plays with sound. This
  // clip covers the full task: "Collect all the clouds, then tap the kite to
  // give it to <character>!" (the win itself is a drag, which iOS won't accept
  // for audio, so the "tap the kite" line has to be spoken here, up front)
  const introClip = kbChar==='lainey' ? 'collectcloudslainey' : 'collectcloudsviolet';
  stageEl.addEventListener('pointerdown', function cloudIntro(){
    playAudio(introClip, "Catch all the clouds, then tap the kite!", null, ()=>{});
  }, {once:true});
  kbSpawnTimer = setInterval(kbSpawnStar, 800);
  kbLoop();
}
function kbMoveKite(e){
  if(!kbActive) return;
  const stageEl = document.getElementById('kiteStage');
  const s = stageEl.getBoundingClientRect();
  let x=(e.clientX-s.left)/s.width*100, y=(e.clientY-s.top)/s.height*100;
  x=Math.max(12,Math.min(88,x)); y=Math.max(16,Math.min(80,y));
  const asm=document.getElementById('kbAssembly');
  if(!asm) return;
  asm.style.left=x+'%'; asm.style.top=y+'%';
  // catch clouds HERE, inside the finger drag, so the winning catch — and the
  // reward video kbWin plays right after — runs within the touch gesture and
  // iOS lets the reward play WITH sound (no "tap to watch" needed)
  const kite=asm.getBoundingClientRect();
  stageEl.querySelectorAll('.kbFall').forEach(cl=>{
    if(cl.classList.contains('caught')) return;
    const r=cl.getBoundingClientRect(), cx=r.left+r.width/2, cy=r.top+r.height/2;
    const pad=kite.width*0.12;
    if(cx>kite.left+pad && cx<kite.right-pad && cy>kite.top+pad && cy<kite.bottom-pad){
      cl.classList.add('caught'); setTimeout(()=>cl.remove(),300);
      kbCaught++; kbUpdatePips();
      if(kbCaught>=kbTarget){ kbWin(); }
    }
  });
}
function kbSpawnStar(){
  if(!kbActive) return;
  const stageEl=document.getElementById('kiteStage'); if(!stageEl) return;
  const s=document.createElement('div'); s.className='kbFall';
  s.textContent=KB_CATCH_GLYPHS[Math.floor(Math.random()*KB_CATCH_GLYPHS.length)];
  s.style.left=(8+Math.random()*80)+'%'; s.dataset.y=-8; s.style.top='-8%';
  s.dataset.vy=(0.5+Math.random()*0.45).toFixed(3);
  stageEl.appendChild(s);
}
function kbLoop(){
  if(!kbActive) return;
  const stageEl=document.getElementById('kiteStage');
  // the loop only drifts the clouds downward; catching happens in kbMoveKite
  // (inside the finger drag) so the winning reward can play WITH sound on iOS
  stageEl.querySelectorAll('.kbFall').forEach(s=>{
    if(s.classList.contains('caught')) return;
    const y=parseFloat(s.dataset.y)+parseFloat(s.dataset.vy);
    s.dataset.y=y; s.style.top=y+'%';
    if(y>110){ s.remove(); }
  });
  kbRAF=requestAnimationFrame(kbLoop);
}
function kbUpdatePips(){
  const el=document.getElementById('kbProgress'); if(!el) return;
  let h=''; for(let i=0;i<kbTarget;i++) h+='<span class="kbPip'+(i<kbCaught?' done':'')+'">☁️</span>';
  el.innerHTML=h;
}
function kbWin(){
  kbActive=false; if(kbRAF) cancelAnimationFrame(kbRAF); kbRAF=null;
  if(kbSpawnTimer){ clearInterval(kbSpawnTimer); kbSpawnTimer=null; }
  const stageEl=document.getElementById('kiteStage');
  if(stageEl){ stageEl.removeEventListener('pointermove',kbMoveKite); stageEl.removeEventListener('pointerdown',kbMoveKite); stageEl.querySelectorAll('.kbFall').forEach(s=>s.remove()); }
  const name = (KB_CHARS[kbChar] && KB_CHARS[kbChar].name) || 'Violet';
  const h=document.getElementById('kbHint'); if(h) h.textContent='Tap the kite to give it to '+name+'! 🪁';
  kbConfettiBurst();                    // celebrate right away
  // (the spoken "tap the kite to give it to X" instruction was played up front,
  // on the first touch of the cloud game — playing audio here at the win would be
  // silent on iOS since the win is a drag, not a tap. The pulsing kite + text
  // hint guide the child to tap.)
  // The kite ITSELF is the tap target now — tapping it is a fresh discrete tap,
  // which is the only gesture iOS accepts for playing the reward WITH sound
  // (the same kind of tap the other games' rewards use).
  const asm=document.getElementById('kbAssembly');
  if(asm){
    asm.classList.add('kbGiftKite');
    asm.style.pointerEvents='auto';   // the fly kite is pointer-events:none; re-enable so it's tappable
    let started=false;
    const give=()=>{ if(started) return; started=true;
      asm.removeEventListener('click', give); asm.removeEventListener('pointerdown', give);
      asm.classList.remove('kbGiftKite');
      playKiteReward(kiteConfetti);
    };
    asm.addEventListener('click', give);
    asm.addEventListener('pointerdown', give);
  } else {
    playKiteReward(kiteConfetti);
  }
}
function kbConfettiBurst(){
  const stageEl=document.getElementById('kiteStage'); if(!stageEl) return;
  for(let c=0;c<16;c++){
    const conf=document.createElement('div'); conf.className='confetti';
    conf.textContent=['🎉','✨','🎊','⭐'][c%4];
    conf.style.left=(5+Math.random()*90)+'%'; conf.style.top=(8+Math.random()*22)+'%';
    conf.style.animationDelay=(Math.random()*.4)+'s';
    stageEl.appendChild(conf); setTimeout(()=>conf.remove(),1600);
  }
}
/* Plays the reward clip. kbWin is reached from inside the drag gesture (the
   catch happens in kbMoveKite while the finger is down), so the video can
   play WITH sound on iOS — muted fallback only if the browser still blocks
   it. Falls back to confetti if the clip is missing. */
function playKiteReward(fallbackFn){
  const stageEl = document.getElementById('kiteStage');
  const vid = document.createElement('video');
  vid.src = 'art/'+(kbChar||'violet')+'flykitereward.mp4?v='+Date.now();
  vid.playsInline = true;
  vid.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:8;border-radius:22px;';
  let handled=false;
  const cleanup = ()=>{ if(vid.parentNode) vid.remove(); };
  const fail = ()=>{ if(!handled){ handled=true; cleanup(); fallbackFn(); } };
  vid.addEventListener('error', fail);
  vid.addEventListener('ended', ()=>{ cleanup(); fallbackFn(); });
  stageEl.appendChild(vid);
  vid.muted = false;                   // within the tap gesture -> sound allowed
  const p = vid.play();
  if(p && p.catch){
    p.catch(()=>{ vid.muted = true; const p2 = vid.play(); if(p2 && p2.catch){ p2.catch(fail); } });
  }
}
function kiteConfetti(){
  const fb = document.getElementById('kiteFeedback');
  fb.innerHTML = '<span class="star">☁️ You caught every cloud! Great job! ☁️</span>';
  const stageEl = document.getElementById('kiteStage');
  for(let c=0;c<14;c++){
    const conf=document.createElement('div');
    conf.className='confetti';
    conf.textContent=['🎉','✨','🎊'][c%3];
    conf.style.left=(5+Math.random()*90)+'%';
    conf.style.top=(10+Math.random()*20)+'%';
    conf.style.animationDelay=(Math.random()*.3)+'s';
    stageEl.appendChild(conf);
    setTimeout(()=>conf.remove(),1500);
  }
}

/* ===== Kite Color Match =====
   Three kites drift in the sky; a color is called out and the child taps the
   matching kite. Tap-based, so the winning tap plays the reward WITH sound.
   Get KM_TARGET_WINS right to see the reward. */
const KM_COLORS = [
  {name:'red',    label:'RED',    hex:'#e23b3b', img:'art/redkite.png'},
  {name:'blue',   label:'BLUE',   hex:'#2196f3', img:'art/bluekite.png'},
  {name:'orange', label:'ORANGE', hex:'#ef7d1a', img:'art/orangekite.png'},
  {name:'pink',   label:'PINK',   hex:'#ff4fa3', img:'art/pinkkite.png'},
  {name:'purple', label:'PURPLE', hex:'#8e2fd0', img:'art/purplekite.png'}
];
const KM_TARGET_WINS = 3;
let kmTargetColor=null, kmWins=0, kmLock=false;
function renderKiteMatchGame(stage){
  kmWins=0; kmLock=false;
  stage.innerHTML = `
    <p class="ask" id="kmAsk">Tap the <span id="kmColorWord">?</span> kite! 🪁</p>
    <div class="kmSky" id="kmSky"></div>
    <div class="beatProgress" id="kmProgress"></div>
    <div class="feedback" id="kmFeedback"></div>
  `;
  kmUpdateProgress();
  newKiteMatchRound();
}
function kmUpdateProgress(){
  const el=document.getElementById('kmProgress'); if(!el) return;
  el.innerHTML = Array.from({length:KM_TARGET_WINS}).map((_,i)=>
    `<span class="beatDot ${i<kmWins?'filled':''}">⭐</span>`).join('');
}
function newKiteMatchRound(){
  kmLock=false;
  const round=[...KM_COLORS].sort(()=>Math.random()-.5).slice(0,3);
  kmTargetColor=round[Math.floor(Math.random()*round.length)];
  const word=document.getElementById('kmColorWord');
  if(word){ word.textContent=kmTargetColor.label; word.style.color=kmTargetColor.hex; }
  const fb=document.getElementById('kmFeedback'); if(fb) fb.textContent='';
  const sky=document.getElementById('kmSky'); if(!sky) return;
  sky.innerHTML='';
  const slots=[6,39,72];
  round.sort(()=>Math.random()-.5).forEach((c,i)=>{
    const b=document.createElement('button');
    b.className='kmKite'; b.dataset.color=c.name;
    b.style.left=slots[i]+'%'; b.style.top=(12+Math.random()*16)+'%';
    b.style.animationDelay=(i*0.4)+'s';
    b.innerHTML=`<img src="${c.img}" alt="${c.name} kite">`;
    b.addEventListener('click', ()=>kmTap(c,b));
    sky.appendChild(b);
  });
  // spoken prompt if the user adds it (audio/tapthe<color>kite.mp3); the big
  // colored word is the primary cue, so a missing clip just stays silent
  playAudio('tapthe'+kmTargetColor.name+'kite', 'Tap the '+kmTargetColor.name+' kite!', null, ()=>{});
}
function kmTap(c, btn){
  if(kmLock || btn.classList.contains('kmFlyUp')) return;
  if(c.name===kmTargetColor.name){
    kmLock=true;
    document.querySelectorAll('.kmKite').forEach(k=>{ if(k!==btn) k.classList.add('kmFade'); });
    btn.classList.add('kmFlyUp');
    kmWins++; kmUpdateProgress();
    const fb=document.getElementById('kmFeedback'); if(fb) fb.textContent='🪁 Yes! The '+c.name+' kite!';
    if(kmWins>=KM_TARGET_WINS){
      playKiteMatchReward();          // played straight from this tap -> sound on iOS
    } else {
      setTimeout(newKiteMatchRound, 950);
    }
  } else {
    btn.classList.remove('kmShake'); void btn.offsetWidth; btn.classList.add('kmShake');
    setTimeout(()=>btn.classList.remove('kmShake'), 450);
    playAudio('tryagain', 'Try again!', null, ()=>{});
    const fb=document.getElementById('kmFeedback'); if(fb) fb.textContent='Not that one — try again!';
  }
}
/* reward plays from the winning tap; muted fallback only if the browser still
   blocks it. On end/miss it starts a fresh set of rounds. */
function playKiteMatchReward(){
  const sky=document.getElementById('kmSky');
  const vid=document.createElement('video');
  vid.src='art/violetflykitereward.mp4?v='+Date.now();
  vid.playsInline=true;
  vid.style.cssText='position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:8;border-radius:22px;';
  let handled=false;
  const done=()=>{ if(handled) return; handled=true; if(vid.parentNode) vid.remove(); kmWins=0; kmUpdateProgress(); newKiteMatchRound(); };
  vid.addEventListener('error', done);
  vid.addEventListener('ended', done);
  sky.appendChild(vid);
  vid.muted=false;
  const p=vid.play();
  if(p&&p.catch){ p.catch(()=>{ vid.muted=true; const p2=vid.play(); if(p2&&p2.catch) p2.catch(done); }); }
}

/* ===== Game 2: Butterfly Color Match ===== */
/* only real photo butterflies are used here — add more entries (with
   an img path) as more colors get made */
const BFLY_COLORS = [
  {name:'blue',    hex:'#2196f3', img:'art/bluebutterfly.png'},
  {name:'orange',  hex:'#ff8c42', img:'art/orangebutterfly.png'},
  {name:'pink',    hex:'#ff7eb6', img:'art/pinkbutterfly.png'},
  {name:'purple',  hex:'#7b4ea8', img:'art/purplebutterfly.png'},
  {name:'rainbow', hex:'#8e5fd6', swatch:'linear-gradient(90deg,#e23b3b,#ff8c42,#ffd34e,#4caf50,#2196f3,#7b4ea8)', img:'art/rainbowbutterfly.png'}
];
let bflyTarget=null, bflyRoundColors=[];
/* tracks correct-in-a-row rounds; a wrong net tap anywhere in the round
   breaks the streak. Every 3rd clean win in a row plays a reward video
   instead of just moving straight to the next round. */
let bflyStreak=0, bflyRoundHadWrongTap=false, bflyReady=false, bflyRoundNum=0;
function butterflySVG(hex){
  return `<svg viewBox="0 0 60 46" xmlns="http://www.w3.org/2000/svg">
    <ellipse cx="18" cy="16" rx="15" ry="12" fill="${hex}" opacity="0.92"/>
    <ellipse cx="42" cy="16" rx="15" ry="12" fill="${hex}" opacity="0.92"/>
    <ellipse cx="18" cy="32" rx="11" ry="9" fill="${hex}" opacity="0.75"/>
    <ellipse cx="42" cy="32" rx="11" ry="9" fill="${hex}" opacity="0.75"/>
    <ellipse cx="30" cy="23" rx="3" ry="15" fill="#2b1f1f"/>
    <circle cx="30" cy="10" r="3.4" fill="#2b1f1f"/>
    <line x1="30" y1="8" x2="26" y2="2" stroke="#2b1f1f" stroke-width="1.6" stroke-linecap="round"/>
    <line x1="30" y1="8" x2="34" y2="2" stroke="#2b1f1f" stroke-width="1.6" stroke-linecap="round"/>
  </svg>`;
}
/* fallback net icon, tinted to match each color, used until a real
   art/<color>net.png exists — same graceful-degradation pattern as
   every other placeholder icon in this app */
function netSVG(hex){
  return `<svg viewBox="0 0 100 130" xmlns="http://www.w3.org/2000/svg">
    <rect x="46" y="82" width="9" height="44" rx="4.5" fill="#8d5524" transform="rotate(18 50 104)"/>
    <circle cx="48" cy="46" r="38" fill="rgba(255,255,255,.45)" stroke="${hex}" stroke-width="7"/>
    <path d="M18 32 L78 60 M18 60 L78 32 M18 46 L78 46 M48 10 L48 82 M28 17 L68 75 M68 17 L28 75" stroke="${hex}" stroke-width="1.5" opacity=".5"/>
  </svg>`;
}
function renderButterflyGame(stage){
  bflyRoundNum = 0;   // the "choose the net that matches..." instruction only plays on round 1
  stage.innerHTML = `
    <p class="ask">How many <span id="targetName">?</span> butterflies do you see? <span class="targetSwatch" id="targetSwatch"></span></p>
    <div class="skyBox" id="skyBox"></div>
    <div class="netChoices" id="netChoices"></div>
    <div class="feedback" id="bflyFeedback">🦋 Choose the net that matches the color and the number of butterflies!</div>
  `;
  newButterflyRound();
}
function newButterflyRound(){
  bflyRoundNum++;
  bflyRoundHadWrongTap = false;
  bflyReady = false;   // no net taps count until the instructions finish
  // pick 3 colors for this round and a random count (1-4) of each;
  // the target is whichever one the question asks about
  bflyRoundColors = [...BFLY_COLORS].sort(()=>Math.random()-.5).slice(0,3)
    .map(c=>({...c, count: Math.floor(Math.random()*4)+1}));
  bflyTarget = bflyRoundColors[Math.floor(Math.random()*bflyRoundColors.length)];
  document.getElementById('targetName').textContent = bflyTarget.name;
  document.getElementById('targetSwatch').style.background = bflyTarget.swatch || bflyTarget.hex;
  document.getElementById('bflyFeedback').textContent = '🦋 Choose the net that matches the color and the number of butterflies!';
  const sky = document.getElementById('skyBox');
  sky.querySelectorAll('.butterfly').forEach(el=>el.remove());
  const flutterClasses=['flutterA','flutterB','flutterC'];
  let i=0;
  bflyRoundColors.forEach(c=>{
    for(let n=0;n<c.count;n++){
      const el=document.createElement('div');
      el.className='butterfly '+flutterClasses[i%3];
      el.style.left=(6+Math.random()*76)+'%';
      el.style.top=(6+Math.random()*66)+'%';
      el.dataset.color=c.name;
      if(c.img){
        const img = document.createElement('img');
        img.src = c.img;
        img.alt = '';
        img.style.cssText = 'width:100%;height:100%;object-fit:contain;display:block;';
        img.onerror = ()=>{ el.innerHTML = butterflySVG(c.hex); };
        el.appendChild(img);
      } else {
        el.innerHTML = butterflySVG(c.hex);
      }
      sky.appendChild(el);
      i++;
    }
  });
  // net choices: the target color gets two nets with different numbers on
  // them (only one is the real count), so picking correctly means actually
  // counting, not just recognizing the color; decoy colors get one net
  // each, showing their own real count
  const netOptions = [];
  bflyRoundColors.forEach(c=>{
    netOptions.push({color:c, count:c.count});
    if(c.name===bflyTarget.name){
      let wrongCount;
      do{ wrongCount = Math.floor(Math.random()*4)+1; }while(wrongCount===c.count);
      netOptions.push({color:c, count:wrongCount});
    }
  });
  netOptions.sort(()=>Math.random()-.5);
  const nets = document.getElementById('netChoices');
  nets.innerHTML='';
  netOptions.forEach(opt=>{
    const c = opt.color;
    const btn=document.createElement('button');
    btn.className='netChoice';
    btn.dataset.color=c.name;
    btn.dataset.count=opt.count;
    const iconWrap=document.createElement('span');
    iconWrap.className='netIcon';
    const img=document.createElement('img');
    img.src=`art/${c.name}net.png`;
    img.alt=c.name+' net';
    img.onerror=()=>{ iconWrap.innerHTML = netSVG(c.hex); };
    iconWrap.appendChild(img);
    btn.appendChild(iconWrap);
    const badge=document.createElement('span');
    badge.className='netNumber';
    badge.textContent=opt.count;
    btn.appendChild(badge);
    btn.addEventListener('click', ()=>chooseNet(c, opt.count, btn));
    nets.appendChild(btn);
  });
  // "How many X butterflies do you see?" then, once that finishes,
  // "Choose the net that matches..." — chained via onDuration (for the
  // device-voice fallback, which has no 'ended' event of its own to hook)
  // and 'ended' (for the real clip); audioGeneration guards against a
  // stale chain firing after the player's moved on to a new round/page
  let bflyHintFired = false;
  const bflyHint = ()=>{
    if(bflyHintFired) return; bflyHintFired = true;
    // the game becomes tappable only after this "choose the net" line finishes.
    // Capture the generation AFTER playAudio (it bumps audioGeneration itself),
    // so the guard actually matches when the audio ends.
    const hintAudio = playAudio('choosethenet', 'Choose the net that matches the color and the number of butterflies!',
      (ms)=>{ const g=audioGeneration; setTimeout(()=>{ if(g===audioGeneration) bflyReady = true; }, ms+100); }, ()=>{});
    const myGen = audioGeneration;
    const markReady = ()=>{ if(myGen===audioGeneration) bflyReady = true; };
    if(hintAudio){ hintAudio.addEventListener('ended', markReady); hintAudio.addEventListener('error', markReady); }
  };
  // round 1: after the color question, play the "choose the net that matches..."
  // instruction. Later rounds: skip it (kid knows the game) and just become
  // tappable once the color question finishes.
  const afterIntro = ()=>{ if(bflyRoundNum===1) bflyHint(); else bflyReady = true; };
  const introAudio = playAudio(`${bflyTarget.name}butterflies`, `How many ${bflyTarget.name} butterflies do you see?`, (ms)=>{
    const myGen = audioGeneration;
    setTimeout(()=>{ if(myGen===audioGeneration) afterIntro(); }, ms+150);
  }, ()=>{});
  if(introAudio){
    const myGen = audioGeneration;
    introAudio.addEventListener('ended', ()=>{ if(myGen===audioGeneration) afterIntro(); });
  }
}
function chooseNet(color, count, btn){
  if(!bflyReady || btn.disabled) return;   // wait for the instructions to finish
  const fb = document.getElementById('bflyFeedback');
  if(color.name===bflyTarget.name && count===bflyTarget.count){
    document.querySelectorAll('.netChoice').forEach(b=>b.disabled=true);
    swoopNet(btn, color);
  } else {
    bflyRoundHadWrongTap = true;
    btn.classList.add('wrong');
    btn.disabled = true;
    fb.textContent = 'Not that one — try again!';
    playAudio('tryagain', "Try again!");
  }
}
/* animates the chosen net swooping up into the sky, then removes every
   butterfly of that color (reusing the existing .caught fade-out) */
function swoopNet(btn, color){
  const sky = document.getElementById('skyBox');
  const caughtCount = bflyRoundColors.find(c=>c.name===color.name).count;
  const flyer = document.createElement('div');
  flyer.className = 'captureNet';
  flyer.innerHTML = btn.innerHTML;
  sky.appendChild(flyer);
  requestAnimationFrame(()=>flyer.classList.add('swoop'));
  setTimeout(()=>{
    sky.querySelectorAll(`.butterfly[data-color="${color.name}"]`).forEach((el,i)=>{
      setTimeout(()=>{ el.classList.add('caught'); setTimeout(()=>el.remove(),400); }, i*120);
    });
    const fb = document.getElementById('bflyFeedback');
    fb.textContent = `🦋 Yes! ${caughtCount} ${color.name} butterflies!`;
  }, 500);
  setTimeout(()=>{
    flyer.remove();
    bflyStreak = bflyRoundHadWrongTap ? 0 : bflyStreak+1;
    if(bflyStreak>=3){ bflyStreak=0; butterflyCelebrate(); }
    else { setTimeout(newButterflyRound,600); }
  }, 1500);
}
function butterflyCelebrate(){
  playButterflyReward(()=>setTimeout(newButterflyRound,600));
}
/* tries a real reward clip at art/butterflyreward.mp4; if it doesn't
   exist yet (or fails to load), just moves straight to the next round —
   same fallback pattern as the kite/maze/fish games' clips */
function playButterflyReward(fallbackFn){
  const stageEl = document.getElementById('skyBox');
  const vid = document.createElement('video');
  vid.src = 'art/butterflyreward.mp4?v='+Date.now();
  vid.playsInline = true; vid.autoplay = false;
  // this plays after a swoop delay (not directly in the tap), so start
  // muted to guarantee autoplay, then unmute once running for sound
  vid.muted = true;
  vid.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:8;border-radius:20px;';
  let handled=false;
  const cleanup = ()=>{ if(vid.parentNode) vid.remove(); };
  vid.addEventListener('error', ()=>{ if(!handled){ handled=true; cleanup(); fallbackFn(); } });
  vid.addEventListener('ended', ()=>{ cleanup(); fallbackFn(); });
  vid.addEventListener('playing', ()=>{ vid.muted = false; }, {once:true});
  stageEl.appendChild(vid);
  const p = vid.play();
  if(p && p.catch){ p.catch(()=>{ if(!handled){ handled=true; cleanup(); fallbackFn(); } }); }
}

/* ===== Game 3: Fish Memory Match =====
   Lily pads cover the pond; flip two to reveal the fish underneath.
   Matching pairs stay face-up, mismatches flip back over. */
const FISH_TYPES = ['orange','blue','yellow','pink','purple','rainbow'];
let pondCards=[], pondFlipped=[], pondMatched=[], pondBusy=false;
function lilyPadSVG(){
  return `<svg viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">
    <path d="M30 30 L54 22 A24 24 0 1 1 30 6 Z" fill="#4a8c35" stroke="#356321" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M30 30 L30 10 M30 30 L47 15 M30 30 L51 27" stroke="#356321" stroke-width="1" opacity=".55" fill="none"/>
  </svg>`;
}
function fishShuffle(a){
  a=[...a];
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function renderFishGame(stage){
  stage.innerHTML = `
    <p class="ask">Flip two lily pads to find a matching pair of fish!</p>
    <div class="pondStage" id="pondStage"></div>
    <div class="feedback" id="pondFeedback"></div>
  `;
  newPondRound();
}
function newPondRound(){
  pondFlipped = [];
  pondMatched = [];
  pondBusy = false;
  pondCards = fishShuffle([...FISH_TYPES, ...FISH_TYPES]);
  const stageEl = document.getElementById('pondStage');
  stageEl.innerHTML = '';
  pondCards.forEach((fish,i)=>{
    const card = document.createElement('button');
    card.className = 'card';
    card.id = 'card'+i;
    card.innerHTML = `
      <div class="cardInner">
        <div class="cardFace cardBack"><img src="art/lillypad.png" alt="" onerror="this.parentElement.innerHTML=lilyPadSVG()"></div>
        <div class="cardFace cardFront"><img src="art/${fish}fish.png" alt=""></div>
      </div>`;
    card.onclick = ()=>flipCard(i);
    stageEl.appendChild(card);
  });
  playAudio('fliptwolillypads', "Flip two lily pads to find a matching pair of fish!");
}
function flipCard(i){
  if(pondBusy) return;
  if(pondFlipped.includes(i) || pondMatched.includes(i)) return;
  document.getElementById('card'+i).classList.add('flipped');
  pondFlipped.push(i);
  if(pondFlipped.length<2) return;
  pondBusy = true;
  const [a,b] = pondFlipped;
  const fb = document.getElementById('pondFeedback');
  if(pondCards[a]===pondCards[b]){
    fb.innerHTML = '⭐ Yes! A match!';
    playAudio('yesamatch', "Yes! A match!");
    setTimeout(()=>{
      document.getElementById('card'+a).classList.add('matched');
      document.getElementById('card'+b).classList.add('matched');
      pondMatched.push(a,b);
      pondFlipped = [];
      pondBusy = false;
      if(pondMatched.length===pondCards.length) setTimeout(pondCelebrate, 400);
    }, 500);
  } else {
    fb.textContent = 'Not quite — try again!';
    playAudio('tryagain', "Try again!");
    setTimeout(()=>{
      document.getElementById('card'+a).classList.remove('flipped');
      document.getElementById('card'+b).classList.remove('flipped');
      pondFlipped = [];
      pondBusy = false;
    }, 900);
  }
}
function pondCelebrate(){
  playPondReward(pondConfetti);
}
/* tries a real reward clip at art/fishreward.mp4; if it doesn't exist
   yet (or fails to load), falls straight to the confetti celebration —
   same pattern as the maze's and kite game's clips */
function playPondReward(fallbackFn){
  const stageEl = document.getElementById('pondStage');
  const vid = document.createElement('video');
  vid.src = 'art/fishreward.mp4?v='+Date.now();
  vid.playsInline = true; vid.autoplay = false;
  vid.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:8;border-radius:22px;';
  let handled=false;
  const cleanup = ()=>{ if(vid.parentNode) vid.remove(); };
  vid.addEventListener('error', ()=>{ if(!handled){ handled=true; cleanup(); fallbackFn(); } });
  vid.addEventListener('ended', ()=>{ cleanup(); fallbackFn(); });
  stageEl.appendChild(vid);
  const p = vid.play();
  if(p && p.catch){ p.catch(()=>{ if(!handled){ handled=true; cleanup(); fallbackFn(); } }); }
}
function pondConfetti(){
  const fb = document.getElementById('pondFeedback');
  fb.innerHTML = '<span class="star">⭐ You found every fish! Great job! ⭐</span>';
  const stageEl = document.getElementById('pondStage');

    conf.style.animationDelay=(Math.random()*.3)+'s';
    stageEl.appendChild(conf);
