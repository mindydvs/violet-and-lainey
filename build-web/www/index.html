/* ===== Game: Fill the Treasure Chest (drag & drop) =====
   A moonlit-lake scene (Violet + Lainey on the shore). Six treasures are
   scattered around; the player drags each one into the treasure chest at
   the bottom. When all six are in, the chest bounces and the reward plays.
   Assets (drop into app/art/):
     moonlitscene.png     – background WITH an open, empty chest painted in
                            at bottom-center (the drop zone sits over it)
     treasure1.png … treasure6.png – the six treasures, transparent bg
   Optional: audio/filltreasurechest.mp3 (intro voice),
             art/treasurereward.mp4 (reward clip; else confetti). */
const TREASURE_ITEMS = ['treasure1','treasure2','treasure3','treasure4','treasure5',
                        'treasure6','treasure7','treasure8','treasure9','treasure10'];
let treasureCollected=0, treasureTotal=0;
function renderTreasureGame(stage){
  treasureCollected=0; treasureTotal=TREASURE_ITEMS.length;
  stage.innerHTML = `
    <p class="ask" id="treasureAsk">Find the objects and drag them into the chest — then tap the chest! ✨</p>
    <div class="treasureScene" id="treasureScene" style="background-image:url('art/moonlitscene.png')">
      <div class="treasureChest" id="treasureChest" aria-hidden="true"></div>
    </div>
    <div class="treasureRefGrid" id="treasureRef"></div>
    <button class="btn btn-daisy" id="treasurePlayAgainBtn" onclick="renderTreasureGame(document.getElementById('stageArea'))" style="visibility:hidden">🔁 Play Again</button>
    <div class="feedback" id="treasureFeedback"></div>
  `;
  playAudio('taptreasure', "Help Violet and Lainey fill the Treasure Chest! Find the objects below hidden in the picture and drag them into the chest. Once they are all in there, tap the treasure chest!", null, ()=>{});
  // reference guide below — 2 rows of 5. Each treasure shows full-colour so
  // the player knows what to look for, with an empty circle above it that
  // gets filled with that treasure once it lands in the chest.
  const grid = document.getElementById('treasureRef');
  TREASURE_ITEMS.forEach(key=>{
    const cell = document.createElement('div');
    cell.className = 'treasureCell';
    const slot = document.createElement('div');
    slot.className = 'treasureSlot';
    slot.dataset.key = key;
    const ref = document.createElement('img');
    ref.className = 'treasureRefImg';
    ref.src = 'art/'+key+'.png';
    cell.appendChild(slot);
    cell.appendChild(ref);
    grid.appendChild(cell);
  });
  // scatter the draggable treasures across the scene like hidden objects,
  // at random spots (never on the chest) so they move every play
  const scene = document.getElementById('treasureScene');
  const pts = treasureScatterPositions(TREASURE_ITEMS.length);
  TREASURE_ITEMS.forEach((key,i)=>{
    const img = document.createElement('img');
    img.className = 'treasureItem';
    img.src = 'art/'+key+'.png';
    img.dataset.key = key;
    img.dataset.home = 'left:'+pts[i].x+'%;top:'+pts[i].y+'%';
    img.style.cssText = img.dataset.home;
    img.draggable = false;
    attachTreasureDrag(img);
    scene.appendChild(img);
  });
}
/* random scatter positions across the scene, skipping the chest area
   (lower-left) and avoiding heavy overlap between items */
function treasureScatterPositions(n){
  const inChest = (x,y)=> x>22 && x<54 && y>42 && y<84;   // chest keep-out
  const pts=[]; let guard=0;
  while(pts.length<n && guard<3000){
    guard++;
    const x = 3+Math.random()*84, y = 4+Math.random()*80;
    if(inChest(x+5,y+6)) continue;                          // item ~11% wide
    if(pts.some(p=>Math.abs(p.x-x)<9 && Math.abs(p.y-y)<11)) continue;
    pts.push({x:Math.round(x), y:Math.round(y)});
  }
  while(pts.length<n){ pts.push({x:4+((pts.length*13)%82), y:5+((pts.length*19)%36)}); }
  return pts;
}
/* pointer-based drag from the tray up into the chest. During a drag the item
   is lifted to position:fixed so it can travel anywhere (tray -> scene). On
   release, if its center is over the chest it's collected; otherwise it drops
   back into its tray slot. Works for mouse and touch. */
function attachTreasureDrag(img){
  let dragging=false, grabX=0, grabY=0, captured=null;
  img.addEventListener('pointerdown', e=>{
    if(img.classList.contains('collected')) return;
    e.preventDefault();
    dragging = true;
    captured = e.pointerId;
    try{ img.setPointerCapture(e.pointerId); }catch(_){}
    const r = img.getBoundingClientRect();
    grabX = e.clientX - r.left; grabY = e.clientY - r.top;
    img.classList.add('dragging');
    // lift out of the tray, keeping the same on-screen spot
    img.style.position='fixed';
    img.style.width = r.width+'px';
    img.style.height = r.height+'px';
    img.style.left = r.left+'px';
    img.style.top  = r.top+'px';
    img.style.zIndex = 9999;
  });
  img.addEventListener('pointermove', e=>{
    if(!dragging) return;
    img.style.left = (e.clientX-grabX)+'px';
    img.style.top  = (e.clientY-grabY)+'px';
  });
  const end = e=>{
    if(!dragging) return;
    dragging = false;
    try{ img.releasePointerCapture(captured); }catch(_){}
    img.classList.remove('dragging');
    const chest = document.getElementById('treasureChest');
    if(!chest){ resetTreasureItem(img); return; }
    const cr = chest.getBoundingClientRect();
    const ir = img.getBoundingClientRect();
    const cx = ir.left + ir.width/2, cy = ir.top + ir.height/2;
    const pad = cr.width*0.28;        // forgiving hit area for little hands
    const over = cx>cr.left-pad && cx<cr.right+pad && cy>cr.top-pad && cy<cr.bottom+pad;
    if(over) treasureCollectItem(img, chest);
    else     restoreTreasureHome(img);  // glide back to its hidden spot
  };
  img.addEventListener('pointerup', end);
  img.addEventListener('pointercancel', end);
}
/* drop the fixed-position drag styles and return the item to its scene spot
   (the class puts it back to position:absolute within the scene) */
function restoreTreasureHome(img){
  img.style.position=''; img.style.width=''; img.style.height=''; img.style.zIndex='';
  img.style.cssText = img.dataset.home;   // left:x%;top:y%
}
function treasureCollectItem(img, chest){
  // item is position:fixed here (viewport coords) — glide it into the chest
  const cr = chest.getBoundingClientRect();
  img.style.transition = 'left .28s, top .28s, transform .28s, opacity .28s';
  img.style.left = (cr.left + cr.width/2 - img.offsetWidth/2)+'px';
  img.style.top  = (cr.top  + cr.height*0.45 - img.offsetHeight/2)+'px';
  img.style.transform = 'scale(.2)';
  img.style.opacity = '0';
  setTimeout(()=>{ if(img.parentNode) img.remove(); }, 300);
  // fill this treasure's circle with the item (no counting out loud)
  const slot = document.querySelector('.treasureSlot[data-key="'+img.dataset.key+'"]');
  if(slot && !slot.classList.contains('filled')){
    const badge = document.createElement('img');
    badge.src = 'art/'+img.dataset.key+'.png';
    slot.appendChild(badge);
    slot.classList.add('filled');
  }
  treasureCollected++;
  if(treasureCollected >= treasureTotal){ setTimeout(treasureWin, 500); }
}
function treasureWin(){
  const scene = document.getElementById('treasureScene');
  if(!scene){ playTreasureReward(treasureFinish); return; }
  const fb=document.getElementById('treasureFeedback'); if(fb) fb.textContent='Tap the treasure chest! ✨';
  // all items are in -> a flashing "tap the chest" overlay appears over the
  // chest; tapping it (a real tap) plays the reward video WITH sound
  const tap=document.createElement('button');
  tap.id='treasureTap'; tap.className='treasureTap'; tap.type='button';
  tap.innerHTML='<img src="art/taptreasurechest.png" alt="tap the treasure chest">';
  let done=false;
  const go=()=>{ if(done) return; done=true; tap.remove(); playTreasureReward(treasureFinish); };
  tap.addEventListener('click', go);
  tap.querySelector('img').addEventListener('error', go);   // missing art -> just play the reward
  scene.appendChild(tap);
}
/* nothing celebratory after the reward video — it's the finale. Just quietly
   offer Play Again (also used if the video can't load). */
function treasureFinish(){
  const btn = document.getElementById('treasurePlayAgainBtn');
  if(btn) btn.style.visibility = 'visible';
}
function playTreasureReward(fallbackFn){
  const stageEl = document.getElementById('treasureScene');
  if(!stageEl){ fallbackFn(); return; }
  const vid = document.createElement('video');
  vid.src = 'art/treasurereward.mp4?v='+Date.now();
  vid.playsInline = true; vid.autoplay = false;
  vid.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:8;border-radius:20px;';
  let handled=false;
  const cleanup = ()=>{ if(vid.parentNode) vid.remove(); };
  const fail = ()=>{ if(!handled){ handled=true; cleanup(); fallbackFn(); } };
  vid.addEventListener('error', fail);
  vid.addEventListener('ended', ()=>{ cleanup(); fallbackFn(); });
  stageEl.appendChild(vid);
  // played from the "tap the chest" tap -> sound; muted fallback only if blocked
  vid.muted = false;
  const p = vid.play();
  if(p && p.catch){
    p.catch(()=>{ vid.muted = true; const p2 = vid.play(); if(p2 && p2.catch){ p2.catch(fail); } });
  }
}

let fdPage=1, fdFound=[], fdAuthor=false, fdAuthorTaps=[], fdSetupPage=1;
function renderFindDiffGame(stage){
  const anyEmpty = Object.keys(FD_SPOTS).some(k=>(FD_SPOTS[k]||[]).length < 5);
  fdAuthor = anyEmpty;   // still missing some pages' spots -> setup mode
  fdPage = fdAuthor ? fdSetupPage : (1 + Math.floor(Math.random()*FD_PAGES));
  fdFound = [];
  fdAuthorTaps = fdAuthor ? (FD_SETUP_DATA[fdPage]||[]).slice() : [];
  const donePages = fdAuthor ? Object.keys(FD_SETUP_DATA).filter(k=>(FD_SETUP_DATA[k]||[]).length>=5).length : 0;
  stage.innerHTML = `
    <p class="ask" id="fdAsk">${fdAuthor ? 'Setup ('+donePages+'/'+FD_PAGES+' pages done) — tap the 5 differences on page '+fdPage : 'Find the 5 differences! Tap them on either picture.'}</p>
    ${fdAuthor ? '<div class="fdSetupBtns"><button class="fdNav" onclick="fdSetupPrev()">◀ Prev</button><button class="fdNav" onclick="fdSetupRedo()">↺ Clear this page</button><button class="fdNav" onclick="fdSetupNext()">Next ▶</button></div>' : ''}
    <div class="fdStage" id="fdStage" style="background-image:url('art/findthedifference${fdPage}.png')"></div>
    <div class="feedback" id="fdFeedback">${fdAuthor ? 'Tapped: '+fdAuthorTaps.length+' / 5' : 'Found: 0 / 5'}</div>
    ${fdAuthor ? '<div id="fdAuthorOut" style="font-size:12px;word-break:break-all;margin-top:6px;color:#5e3a85;font-weight:bold;"></div>'
               : '<div class="fdBtns"><button class="btn btn-daisy" id="fdHintBtn" onclick="fdHint()">💡 Hint</button>'
                 +'<button class="btn btn-daisy" id="fdPlayAgainBtn" onclick="renderFindDiffGame(document.getElementById(\'stageArea\'))" style="visibility:hidden">🔁 Play Again</button></div>'}
  `;
  const st = document.getElementById('fdStage');
  st.addEventListener('pointerdown', fdTap);
  if(fdAuthor){
    fdAuthorTaps.forEach(t=>fdMark(t.x, t.y, 'author'));
    const out=document.getElementById('fdAuthorOut'); if(out) out.textContent = 'Page '+fdPage+': '+JSON.stringify(fdAuthorTaps);
  } else {
    playAudio('find5differences', 'Find the five differences! Tap them on either picture.', null, ()=>{});
  }
}
function fdSetupNext(){ fdSetupPage = fdSetupPage % FD_PAGES + 1; renderFindDiffGame(document.getElementById('stageArea')); }
function fdSetupPrev(){ fdSetupPage = (fdSetupPage-2+FD_PAGES)%FD_PAGES + 1; renderFindDiffGame(document.getElementById('stageArea')); }
function fdSetupRedo(){ FD_SETUP_DATA[fdPage]=[]; renderFindDiffGame(document.getElementById('stageArea')); }
function fdTap(e){
  const st = e.currentTarget;
  const r = st.getBoundingClientRect();
  const tx = (e.clientX-r.left)/r.width, ty = (e.clientY-r.top)/r.height;
  const P = FD_PANEL;
  const sy = (ty - P.ty)/P.h;
  let sx;
  if(tx < 0.5) sx = (tx - P.lx)/P.w; else sx = (tx - P.rx)/P.w;
  if(sx<0 || sx>1 || sy<0 || sy>1) return;   // tapped the gap/border, ignore
  if(fdAuthor){ fdAuthorRecord(sx, sy, st); return; }
  const panelWpx = P.w*r.width, panelHpx = P.h*r.height;
  const spots = FD_SPOTS[fdPage];
  for(let i=0;i<spots.length;i++){
    if(fdFound.includes(i)) continue;
    const dx = (sx-spots[i].x)*panelWpx, dy = (sy-spots[i].y)*panelHpx;
    if(Math.hypot(dx,dy) < 0.10*panelWpx){ fdMarkFound(i); return; }
  }
}
function fdMark(sx, sy, cls){
  const st = document.getElementById('fdStage'); if(!st) return;
  const P = FD_PANEL;
  [P.lx, P.rx].forEach(base=>{
    const m = document.createElement('div');
    m.className = 'fdMark'+(cls?' '+cls:'');
    m.style.left = ((base + sx*P.w)*100)+'%';
    m.style.top  = ((P.ty + sy*P.h)*100)+'%';
    st.appendChild(m);
  });
}
/* 💡 Hint: glows a ring around one difference the child hasn't found yet — on
   BOTH pictures — but doesn't count it, so they still get to tap it themselves.
   The ring fades on its own after a few seconds. */
function fdHint(){
  const spots = FD_SPOTS[fdPage] || [];
  const left = spots.map((s,i)=>i).filter(i=>!fdFound.includes(i));
  if(!left.length) return;
  const st = document.getElementById('fdStage'); if(!st) return;
  st.querySelectorAll('.fdHintRing').forEach(h=>h.remove());   // only one hint at a time
  const s = spots[left[Math.floor(Math.random()*left.length)]];
  const P = FD_PANEL;
  [P.lx, P.rx].forEach(base=>{
    const h = document.createElement('div');
    h.className = 'fdHintRing';
    h.style.left = ((base + s.x*P.w)*100)+'%';
    h.style.top  = ((P.ty + s.y*P.h)*100)+'%';
    st.appendChild(h);
    setTimeout(()=>h.remove(), 4500);
  });
  // brief cooldown so it can't be spammed
  const btn = document.getElementById('fdHintBtn');
  if(btn){ btn.disabled = true; setTimeout(()=>{ if(btn) btn.disabled = false; }, 4500); }
}
function fdMarkFound(i){
  fdFound.push(i);
  const s = FD_SPOTS[fdPage][i];
  fdMark(s.x, s.y);
  playAudio('greatjob', 'Great job!', null, ()=>{});
  document.getElementById('fdFeedback').textContent = 'Found: '+fdFound.length+' / 5';
  if(fdFound.length >= 5) fdWin();
}
function fdWin(){
  document.getElementById('fdAsk').textContent = 'You found all 5! 🎉';
  playFdReward(fdShowPlayAgain);
}
/* reward video over the pictures; on end (or if it can't load) show Play Again.
   It's triggered by the 5th correct tap (a gesture), so it plays with sound. */
function playFdReward(fallbackFn){
  const stageEl = document.getElementById('fdStage');
  if(!stageEl){ fallbackFn(); return; }
  const vid = document.createElement('video');
  vid.src = 'art/differencesreward.mp4?v='+Date.now();
  vid.playsInline = true; vid.autoplay = false;
  vid.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:8;border-radius:14px;';
  let handled=false;
  const cleanup = ()=>{ if(vid.parentNode) vid.remove(); };
  const fail = ()=>{ if(!handled){ handled=true; cleanup(); fallbackFn(); } };
  vid.addEventListener('error', fail);
  vid.addEventListener('ended', ()=>{ cleanup(); fallbackFn(); });
  stageEl.appendChild(vid);
  vid.muted = false;
  const p = vid.play();
  if(p && p.catch){ p.catch(()=>{ vid.muted = true; const p2 = vid.play(); if(p2 && p2.catch){ p2.catch(fail); } }); }
}
function fdShowPlayAgain(){
  const st = document.getElementById('fdStage');
  if(st){
    for(let c=0;c<14;c++){
      const conf=document.createElement('div'); conf.className='confetti';
      conf.textContent=['🎉','✨','🎊'][c%3];
      conf.style.left=(5+Math.random()*90)+'%'; conf.style.top=(6+Math.random()*20)+'%';
      conf.style.animationDelay=(Math.random()*.3)+'s';
      st.appendChild(conf); setTimeout(()=>conf.remove(),1500);
    }
  }
  const b=document.getElementById('fdPlayAgainBtn'); if(b) b.style.visibility='visible';
}
function fdAuthorRecord(sx, sy, st){
  if(fdAuthorTaps.length>=5) return;
  fdAuthorTaps.push({x:+sx.toFixed(3), y:+sy.toFixed(3)});
  FD_SETUP_DATA[fdPage] = fdAuthorTaps.slice();   // persist so nav won't lose it
  fdMark(sx, sy, 'author');
  document.getElementById('fdFeedback').textContent = 'Tapped: '+fdAuthorTaps.length+' / 5';
  const out=document.getElementById('fdAuthorOut'); if(out) out.textContent = 'Page '+fdPage+': '+JSON.stringify(fdAuthorTaps);
}

/* ===== Game: Bubble Pop (bubble shooter) =====
   Colored bubbles hang from the top; aim and shoot the bubble at the
   bottom upward. When 5+ of one color touch, they pop and any bubbles
   left floating drop away. New rows creep down over time. Clear every
   color twice to win. Uses a simple square grid for robust matching. */
const BUB_COLORS = ['purple','blue','pink','yellow','green','teal'];
const BUB_IMGS = {};
BUB_COLORS.forEach(c=>{ const im=new Image(); im.src='art/'+c+'bubble.png'; BUB_IMGS[c]=im; });
const BUB_COLS = 12;
const BUB_MATCH = 4;              // pop when 4+ of one colour touch
const BUB_WIN_MATCHES = 3;        // make that happen this many times to win
const BUB_SPEED = 9;
const BUB_DESCEND_SHOTS = 6;
let bubGrid, bubCanvas, bubCtx, bubW, bubH, bubD, bubR, bubRowH, bubTopOff,
    bubCur, bubQueue, bubLaunchY, bubProj, bubAim, bubShots, bubCleared, bubActive, bubRAF, bubMatchCount;
function bubRandColorInGrid(){
  const present = new Set();
  bubGrid.forEach(row=>row.forEach(c=>{ if(c) present.add(c); }));
  const pool = present.size ? [...present] : BUB_COLORS.slice();
  return pool[Math.floor(Math.random()*pool.length)];
}
function renderBubbleGame(stage){
  if(bubRAF) cancelAnimationFrame(bubRAF);
  stage.innerHTML = `
    <p class="ask" id="bubAsk">Aim and pop 4 bubbles of the same color!</p>
    <div class="bubStage" id="bubStage"><canvas id="bubCanvas"></canvas></div>
    <button class="btn btn-daisy" id="bubPlayAgainBtn" onclick="renderBubbleGame(document.getElementById('stageArea'))" style="visibility:hidden">🔁 Play Again</button>
    <div class="feedback" id="bubFeedback" style="margin-top:6px"></div>
  `;
  bubCanvas = document.getElementById('bubCanvas');
  const stageEl = document.getElementById('bubStage');
  const dispW = Math.round(stageEl.clientWidth || Math.min(window.innerWidth*0.94, 440));
  // fit the canvas to the space actually available below the title so the
  // launcher + row of next balls at the bottom stay visible (not clipped)
  const rectTop = stageEl.getBoundingClientRect().top;
  const avail = window.innerHeight - rectTop - 165;
  const dispH = Math.round(Math.max(dispW*0.9, Math.min(dispW*1.35, avail)));
  const dpr = window.devicePixelRatio||1;
  bubCanvas.width = dispW*dpr; bubCanvas.height = dispH*dpr;
  bubCanvas.style.height = dispH+'px';
  bubCtx = bubCanvas.getContext('2d');
  bubCtx.setTransform(dpr,0,0,dpr,0,0);
  bubW = dispW; bubH = dispH;
  bubD = bubW/BUB_COLS; bubR = bubD/2; bubRowH = bubD*0.92; bubTopOff = 0;
  bubGrid = [];
  for(let r=0;r<3;r++){ const row=[]; for(let c=0;c<BUB_COLS;c++) row.push(BUB_COLORS[Math.floor(Math.random()*BUB_COLORS.length)]); bubGrid.push(row); }
  bubCleared = {}; BUB_COLORS.forEach(c=>bubCleared[c]=0);
  bubMatchCount = 0;
  bubShots = 0; bubProj = null; bubAim = {x:bubW/2, y:bubH*0.35};
  bubLaunchY = bubH - bubD*2.4;    // launcher sits above the row of next balls
  bubCur = bubRandColorInGrid();
  bubQueue = [bubRandColorInGrid(), bubRandColorInGrid(), bubRandColorInGrid(), bubRandColorInGrid(), bubRandColorInGrid()];
  bubActive = true;
  bubCanvas.addEventListener('pointermove', bubOnMove);
  bubCanvas.addEventListener('pointerdown', bubOnMove);
  bubCanvas.addEventListener('pointerup', bubOnShoot);
  bubUpdateFeedback();
  playAudio('aimandpop', "Aim and pop four bubbles of the same color! Do this three times before the balls hit the ground!", null, ()=>{});
  bubLoop();
}
function bubCellX(r,c){ return bubR + c*bubD; }
function bubCellY(r){ return bubR + r*bubRowH + bubTopOff; }
function bubOnMove(e){
  if(!bubActive || bubProj) return;
  const rect = bubCanvas.getBoundingClientRect();
  bubAim = { x:(e.clientX-rect.left)*(bubW/rect.width), y:(e.clientY-rect.top)*(bubH/rect.height) };
}
function bubOnShoot(e){
  if(!bubActive || bubProj) return;
  bubOnMove(e);
  const sx=bubW/2, sy=bubLaunchY;
  let dx=bubAim.x-sx, dy=bubAim.y-sy;
  if(dy > -8) dy = -8; // always fire upward
  const len=Math.hypot(dx,dy)||1;
  bubProj = { x:sx, y:sy, vx:dx/len*BUB_SPEED, vy:dy/len*BUB_SPEED, color:bubCur };
}
function bubLoop(){
  if(!bubActive){ bubDraw(); return; }
  bubStep();
  bubDraw();
  bubRAF = requestAnimationFrame(bubLoop);
}
function bubStep(){
  if(!bubProj) return;
  // sub-step the motion so a fast ball can't skip past a bubble, and so it
  // stops the instant it actually touches one (no stopping short of the pack)
  const steps = Math.max(1, Math.ceil(BUB_SPEED/(bubR*0.5)));
  const sx = bubProj.vx/steps, sy = bubProj.vy/steps;
  for(let s=0;s<steps;s++){
    bubProj.x += sx; bubProj.y += sy;
    if(bubProj.x < bubR){ bubProj.x=bubR; bubProj.vx=-bubProj.vx; }
    if(bubProj.x > bubW-bubR){ bubProj.x=bubW-bubR; bubProj.vx=-bubProj.vx; }
    if(bubProj.y - bubR <= bubTopOff){ bubPlaceTop(); return; }
    // find the closest filled bubble we're now touching
    let best=null, bestD=Infinity;
    for(let r=0;r<bubGrid.length;r++) for(let c=0;c<BUB_COLS;c++){
      if(!bubGrid[r][c]) continue;
      const dx=bubProj.x-bubCellX(r,c), dy=bubProj.y-bubCellY(r), d2=dx*dx+dy*dy;
      if(d2 < bubD*bubD && d2 < bestD){ best=[r,c]; bestD=d2; }   // touching (centres < one diameter)
    }
    if(best){ bubSnapNear(best[0],best[1]); return; }
  }
}
function bubEnsureRows(r){ while(bubGrid.length<=r) bubGrid.push(new Array(BUB_COLS).fill(null)); }
// place the ball in the empty grid cell DIRECTLY adjacent (4-neighbour) to the
// bubble it hit and nearest the ball's approach — guarantees it sits flush
// against the pack with no gap, instead of snapping a whole cell away.
function bubSnapNear(hr,hc){
  const color=bubProj.color, px=bubProj.x, py=bubProj.y; bubProj=null;
  const opts=[[hr+1,hc],[hr,hc-1],[hr,hc+1],[hr-1,hc]];
  let best=null, bd=Infinity;
  for(const [r,c] of opts){
    if(c<0||c>=BUB_COLS||r<0) continue;
    bubEnsureRows(r);
    if(bubGrid[r][c]) continue;
    const dx=px-bubCellX(r,c), dy=py-bubCellY(r), d=dx*dx+dy*dy;
    if(d<bd){ bd=d; best=[r,c]; }
  }
  if(!best){
    let c=Math.max(0,Math.min(BUB_COLS-1, Math.round((px-bubR)/bubD)));
    let r=Math.max(0, Math.round((py-bubR-bubTopOff)/bubRowH));
    bubEnsureRows(r);
    while(bubGrid[r][c]){ r++; bubEnsureRows(r); }
    best=[r,c];
  }
  bubGrid[best[0]][best[1]]=color;
  bubAfterAttach(best[0],best[1],color);
}
function bubPlaceTop(){
  const color=bubProj.color, px=bubProj.x; bubProj=null;
  const c=Math.max(0,Math.min(BUB_COLS-1, Math.round((px-bubR)/bubD)));
  let r=0; bubEnsureRows(0);
  while(bubGrid[r] && bubGrid[r][c]){ r++; bubEnsureRows(r); }
  bubGrid[r][c]=color;
  bubAfterAttach(r,c,color);
}
function bubNeighbors(r,c){
  return [[r-1,c],[r+1,c],[r,c-1],[r,c+1]].filter(([rr,cc])=>rr>=0&&rr<bubGrid.length&&cc>=0&&cc<BUB_COLS);
}
function bubAfterAttach(r,c,color){
  const seen=new Set([r+','+c]); const stack=[[r,c]]; const group=[[r,c]];
  while(stack.length){ const [rr,cc]=stack.pop(); for(const [nr,nc] of bubNeighbors(rr,cc)){ const k=nr+','+nc; if(!seen.has(k)&&bubGrid[nr][nc]===color){ seen.add(k); stack.push([nr,nc]); group.push([nr,nc]); } } }
  if(group.length >= BUB_MATCH){
    group.forEach(([rr,cc])=>bubGrid[rr][cc]=null);
    bubMatchCount++;
    bubDropFloating();
    bubUpdateFeedback();
    playAudio('greatjob', "Great job!", null, ()=>{});
    if(bubMatchCount >= BUB_WIN_MATCHES){ bubWin(); return; }
  }
  bubShots++;
  bubCur = bubQueue.shift(); bubQueue.push(bubRandColorInGrid());
  if(bubShots % BUB_DESCEND_SHOTS === 0) bubDescend();
  if(bubActive && bubReachedBottom()) bubResetBoard();
}
function bubDropFloating(){
  const anchored=new Set(); const stack=[];
  if(bubGrid[0]) for(let c=0;c<BUB_COLS;c++){ if(bubGrid[0][c]){ anchored.add('0,'+c); stack.push([0,c]); } }
  while(stack.length){ const [r,c]=stack.pop(); for(const [nr,nc] of bubNeighbors(r,c)){ const k=nr+','+nc; if(!anchored.has(k)&&bubGrid[nr][nc]){ anchored.add(k); stack.push([nr,nc]); } } }
  for(let r=0;r<bubGrid.length;r++) for(let c=0;c<BUB_COLS;c++){ if(bubGrid[r][c] && !anchored.has(r+','+c)) bubGrid[r][c]=null; }
}
function bubDescend(){
  const row=[]; for(let c=0;c<BUB_COLS;c++) row.push(BUB_COLORS[Math.floor(Math.random()*BUB_COLORS.length)]);
  bubGrid.unshift(row);
}
/* true once the lowest bubbles have crept down near the launcher */
function bubReachedBottom(){
  let lowest=-1;
  for(let r=bubGrid.length-1;r>=0;r--){ if(bubGrid[r].some(c=>c)){ lowest=r; break; } }
  if(lowest<0) return false;
  return bubCellY(lowest) + bubR >= bubLaunchY - bubD*0.55;
}
/* bubbles reached the bottom without winning: drop them all and start the
   board fresh (colors-cleared progress is kept so nothing is lost) */
function bubResetBoard(){
  bubActive=false;
  bubProj=null;
  bubGrid=[];
  bubDraw();
  document.getElementById('bubAsk').textContent = 'Oops — the bubbles reached the bottom! Starting over…';
  playAudio('oopsletsstartover', "Oops! Let's start over.", null, ()=>{});
  setTimeout(()=>{
    for(let r=0;r<3;r++){ const row=[]; for(let c=0;c<BUB_COLS;c++) row.push(BUB_COLORS[Math.floor(Math.random()*BUB_COLORS.length)]); bubGrid.push(row); }
    bubShots=0; bubProj=null;
    bubCur=bubRandColorInGrid(); bubQueue=[bubRandColorInGrid(),bubRandColorInGrid(),bubRandColorInGrid(),bubRandColorInGrid(),bubRandColorInGrid()];
    document.getElementById('bubAsk').textContent='Aim and pop 4 bubbles of the same color!';
    bubActive=true;
    bubLoop();
  }, 1300);
}
function bubUpdateFeedback(){
  const fb = document.getElementById('bubFeedback');
  if(fb) fb.textContent = '🎈 Matches: '+Math.min(bubMatchCount,BUB_WIN_MATCHES)+' / '+BUB_WIN_MATCHES;
}
function bubDrawBubble(x,y,color,scale){
  const img=BUB_IMGS[color];
  const vis = bubD*(scale||1)*1.04; // desired visible bubble diameter (slight touch/overlap)
  if(img && img.complete && img.naturalWidth){
    // the extracted ball fills ~82% of its PNG, so draw a touch bigger than
    // the cell to make the actual ball fill it
    const D = vis/0.82;
    bubCtx.drawImage(img, x-D/2, y-D/2, D, D);
  } else {
    bubCtx.beginPath(); bubCtx.arc(x,y,vis/2*0.92,0,Math.PI*2);
    bubCtx.fillStyle=({purple:'#c39cf3',blue:'#73c8f4',pink:'#f9aac1',yellow:'#f9d664',green:'#a4d57d',teal:'#77d8db'})[color]||'#ccc'; bubCtx.fill();
  }
}
function bubDraw(){
  const ctx=bubCtx; if(!ctx) return;
  ctx.clearRect(0,0,bubW,bubH);
  for(let r=0;r<bubGrid.length;r++) for(let c=0;c<BUB_COLS;c++){ if(bubGrid[r][c]) bubDrawBubble(bubCellX(r,c), bubCellY(r), bubGrid[r][c]); }
  const sx=bubW/2, sy=bubLaunchY;
  // dotted aim line with an arrowhead at the tip (like the mockup)
  if(!bubProj && bubActive){
    let dx=bubAim.x-sx, dy=bubAim.y-sy; if(dy>-8) dy=-8; const len=Math.hypot(dx,dy)||1;
    const ux=dx/len, uy=dy/len, reach=bubD*2.6;   // short guide, stays clear of the balls
    const startY = sy-bubR*1.1;
    const tipX = sx+ux*reach, tipY = startY+uy*reach;
    ctx.save();
    ctx.strokeStyle='rgba(150,110,200,.75)'; ctx.fillStyle='rgba(150,110,200,.85)';
    ctx.lineWidth=Math.max(3,bubR*0.30); ctx.lineCap='round';
    ctx.setLineDash([bubR*0.28, bubR*0.9]);
    ctx.beginPath(); ctx.moveTo(sx,startY); ctx.lineTo(tipX,tipY); ctx.stroke();
    ctx.setLineDash([]);
    const ah=bubR*1.0, px=-uy, py=ux;   // arrowhead
    ctx.beginPath();
    ctx.moveTo(tipX+ux*ah, tipY+uy*ah);
    ctx.lineTo(tipX+px*ah*0.62, tipY+py*ah*0.62);
    ctx.lineTo(tipX-px*ah*0.62, tipY-py*ah*0.62);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  if(bubProj) bubDrawBubble(bubProj.x, bubProj.y, bubProj.color);
  // the ball you're about to shoot, at the launcher
  bubDrawBubble(sx, sy, bubCur, 1.0);
  // the upcoming balls, in a row across the very bottom (like the mockup)
  const qy = bubH - bubD*0.7, qgap = bubD*0.95, qn = bubQueue.length;
  const qx0 = bubW/2 - (qn-1)*qgap/2;
  for(let i=0;i<qn;i++){ bubDrawBubble(qx0 + i*qgap, qy, bubQueue[i], 0.7); }
}
function bubWin(){
  bubActive=false;
  if(bubRAF) cancelAnimationFrame(bubRAF);
  bubDraw();
  document.getElementById('bubAsk').textContent = 'You popped every color! 🎉';
  // no spoken line — go straight to the reward video
  playBubbleReward(bubConfetti);
}
function playBubbleReward(fallbackFn){
  const stageEl = document.getElementById('bubStage');
  const vid = document.createElement('video');
  vid.src = 'art/bubblereward.mp4?v='+Date.now();
  vid.playsInline = true; vid.autoplay = false;
  vid.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:8;border-radius:22px;';
  let handled=false;
  const cleanup = ()=>{ if(vid.parentNode) vid.remove(); };
  const fail = ()=>{ if(!handled){ handled=true; cleanup(); fallbackFn(); } };
  vid.addEventListener('error', fail);
  vid.addEventListener('ended', ()=>{ cleanup(); fallbackFn(); });
  stageEl.appendChild(vid);
  // try WITH sound first; if blocked, play muted and leave it muted (no freeze)
  vid.muted = false;
  const p = vid.play();
  if(p && p.catch){
    p.catch(()=>{
      vid.muted = true;
      const p2 = vid.play();
      if(p2 && p2.catch){ p2.catch(fail); }
    });
  }
}
function bubConfetti(){
  const fb = document.getElementById('bubFeedback');
  fb.innerHTML = '<span class="star">⭐ Bubble Pop champion! ⭐</span>';
  const stageEl = document.getElementById('bubStage');
  for(let c=0;c<14;c++){
    const conf=document.createElement('div');
    conf.className='confetti';
    conf.textContent=['🎉','✨','🫧'][c%3];
    conf.style.left=(5+Math.random()*90)+'%';
    conf.style.top=(6+Math.random()*20)+'%';
    conf.style.animationDelay=(Math.random()*.3)+'s';
    stageEl.appendChild(conf);
    setTimeout(()=>conf.remove(),1500);
  }
  document.getElementById('bubPlayAgainBtn').style.visibility='visible';
}

/* ---------- reward video (shown after "I'm Done Coloring!") ---------- */
function showRewardVideo(onDone){
  const overlay = document.createElement('div');
  overlay.className='rewardOverlay';
  overlay.innerHTML = `
    <div class="introVideoWrap" style="width:min(90vw,520px);">
      <video id="rewardVideo" playsinline preload="auto" src="art/paintreward.mp4?v=${Date.now()}"></video>
      <button class="introSkip" onclick="closeRewardVideo()">Skip ⏭️</button>
      <div class="introOverlay" id="rewardTapOverlay" style="display:none" onclick="startRewardVideo()">
        <p class="subtitle">🎉 Tap to see your reward! 🎉</p>
        <div class="play-circle"><div class="tri"></div></div>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  const vid = overlay.querySelector('#rewardVideo');
  const finish = ()=>{ overlay.remove(); window._closeReward=null; onDone(); };
  vid.addEventListener('ended', finish);
  vid.addEventListener('error', finish);
  window._closeReward = finish;
  const p = vid.play();
  if(p && p.catch){ p.catch(()=>{ const t=document.getElementById('rewardTapOverlay'); if(t) t.style.display='flex'; }); }
}
function startRewardVideo(){
  document.getElementById('rewardTapOverlay').style.display='none';
  const vid = document.getElementById('rewardVideo');
  const p = vid.play();
  if(p && p.catch){ p.catch(()=>{ if(window._closeReward) window._closeReward(); }); }
}
function closeRewardVideo(){ if(window._closeReward) window._closeReward(); }

/* ---------- init ---------- */
if('speechSynthesis' in window){
  speechSynthesis.addEventListener('voiceschanged', pickVioletVoice);
  pickVioletVoice();
  /* Chrome's speech engine can silently go idle/frozen after periods of
     inactivity, after which speak() does nothing at all — no sound, no
     error. A periodic pause/resume "ping" keeps it awake. Only pings when
     nothing is currently speaking, so it can't interrupt real playback. */
  setInterval(()=>{
    try{
      if(!speechSynthesis.speaking){ speechSynthesis.pause(); speechSynthesis.resume(); }
    }catch(e){}
  }, 4000);
}
window.addEventListener('click',function once(){
  try{
    speechSynthesis.getVoices();
    pickVioletVoice();
    /* iOS needs an actual speak() call during the very first tap to unlock
       the speech engine for later programmatic calls — say a silent blip. */
    const warm = new SpeechSynthesisUtterance(' ');
    warm.volume = 0;
    speechSynthesis.speak(warm);
  }catch(e){}
  window.removeEventListener('click',once);
},{once:true});
</script>
