<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Adventures of Violet &amp; Lainey</title>
<style>
  :root{
    --violet:#7b4ea8; --violet-deep:#5e3a85;
    --lainey:#e23b3b; --lainey-deep:#b71f1f;
    --daisy:#ffd34e; --sky:#bfe7ff; --grass:#a7e08a;
    --cream:#fff8ec; --ink:#3a2c4a;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{
    font-family:"Baloo 2","Comic Sans MS",system-ui,sans-serif;
    background:linear-gradient(180deg,var(--sky),#e9f7ff);
    color:var(--ink); overflow:hidden; touch-action:manipulation;
  }
  #app{height:100dvh;width:100vw;position:relative;display:flex;align-items:center;justify-content:center;}
  .screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;padding:16px;}
  .screen.active{display:flex;animation:fade .4s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  h1{font-size:clamp(26px,7vw,48px);margin:.2em 0;color:var(--violet-deep);text-shadow:2px 2px 0 #fff;text-align:center;}
  .subtitle{font-size:clamp(15px,3.5vw,20px);color:var(--lainey-deep);margin-bottom:14px;text-align:center;}

  .btn{
    border:none;border-radius:999px;padding:14px 26px;font-size:clamp(16px,4vw,20px);
    font-family:inherit;font-weight:bold;color:#fff;cursor:pointer;margin:7px;
    box-shadow:0 5px 0 rgba(0,0,0,.18);transition:transform .08s, box-shadow .08s;
  }
  .btn:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.18);}
  .btn-violet{background:var(--violet);} .btn-lainey{background:var(--lainey);}
  .btn-daisy{background:var(--daisy);color:var(--ink);} .btn-grass{background:#4caf50;}
  .btn:disabled{opacity:.4;cursor:default;}

  .topbar{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:10px 14px;z-index:20;}
  .home-btn{background:#fff;color:var(--violet-deep);border:none;border-radius:50%;width:46px;height:46px;font-size:22px;box-shadow:0 3px 0 rgba(0,0,0,.15);cursor:pointer;flex:none;}
  .pill{background:#fff;border-radius:999px;padding:6px 16px;font-weight:bold;color:var(--violet-deep);box-shadow:0 3px 0 rgba(0,0,0,.12);font-size:clamp(13px,3vw,16px);text-align:center;}


  /* ===== adventure stage area (scene / color / game share this) ===== */
  #adventure{padding-top:64px;padding-bottom:74px;}
  .stageArea{width:min(94vw,560px);flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;min-height:0;width:100%;}
  .bookPage{width:min(92vw,520px);background:var(--cream);border-radius:24px;box-shadow:0 10px 28px rgba(0,0,0,.18);overflow-y:auto;display:flex;flex-direction:column;max-height:76vh;}
  .bookPageArt{width:100%;max-height:32vh;overflow:hidden;flex:none;border-radius:24px 24px 0 0;background:#000;display:flex;align-items:center;justify-content:center;}
  .bookPageArt img,.bookPageArt video{width:100%;max-height:32vh;object-fit:contain;display:block;}
  /* page videos vary in shape (portrait or landscape depending which clip
     gets uploaded) unlike the square scene images this box is normally
     sized for — aspect-ratio here is just a placeholder until renderScene
     reads the real video dimensions and overwrites it inline, so the box
     always matches the actual clip and shows it with no black bars */
  .bookPageArt.videoArt{width:auto;max-width:100%;max-height:54vh;aspect-ratio:9/16;border-radius:20px;margin:14px auto 0;}
  .bookPageArt.videoArt video{width:100%;height:100%;max-height:none;object-fit:cover;border-radius:20px;}
  .bookPageText{margin:0;padding:4px 18px 18px;font-size:clamp(15px,3.8vw,19px);line-height:1.7;text-align:center;}
  .wordHint{margin:6px 18px 0;font-size:clamp(12px,3vw,14px);font-weight:bold;color:var(--violet-deep);text-align:center;}
  .placeholderGame{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;width:min(88vw,420px);aspect-ratio:4/3;border-radius:22px;background:linear-gradient(180deg,var(--sky),#eaf6ff);box-shadow:0 8px 24px rgba(0,0,0,.15);}
  .placeholderIcon{font-size:56px;margin-bottom:6px;}
  .playPageBtn{margin:14px auto 0;display:block;}
  .word{cursor:pointer;transition:background .15s,color .15s,transform .15s;border-radius:5px;padding:1px 3px;border-bottom:2px dashed var(--violet);display:inline-block;}
  .word.hi,.word.tapped{background:var(--daisy);color:var(--ink);border-bottom-color:transparent;}
  .word.invite{animation:wordInvite .5s ease-in-out 2;}
  @keyframes wordInvite{0%,100%{transform:scale(1)}50%{transform:scale(1.2);color:var(--lainey-deep);}}

  /* coloring canvas */
  .palette{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin:8px 0;}
  .swatch{width:46px;height:54px;border:none;background:transparent;padding:0;cursor:pointer;flex:none;position:relative;filter:drop-shadow(0 3px 4px rgba(0,0,0,.3));transition:transform .15s,filter .15s;}
  .swatch svg{width:100%;height:100%;display:block;}
  .swatch.sel{transform:translateY(-5px) scale(1.12);filter:drop-shadow(0 6px 8px rgba(0,0,0,.4));}
  .swatchNum{position:absolute;left:0;right:0;bottom:9px;font-size:12px;font-weight:900;color:#5a4632;text-shadow:0 1px 1px rgba(255,255,255,.7);pointer-events:none;}
  /* reward video shown in place of the coloring page when Done is tapped */
  .paintRewardWrap{width:min(94vw,560px);aspect-ratio:16/9;margin:0 auto;border-radius:20px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.2);background:#000;}
  .paintRewardWrap video{width:100%;height:100%;object-fit:cover;display:block;}
  /* paint studio: attic background, buckets on the shelf as the colour picker */
  .paintStudio{position:relative;aspect-ratio:1292/2296;height:min(74vh,760px);width:auto;max-width:96vw;margin:0 auto;background-size:cover;background-position:center;border-radius:18px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.25);}
  .bucketZone{position:absolute;border:none;background:transparent;cursor:pointer;padding:0;border-radius:12px;-webkit-tap-highlight-color:transparent;z-index:3;}
  .bucketZone.sel{}   /* no highlight box around the chosen bucket */
  .paintCanvasFrame{position:absolute;left:8%;top:23%;width:84%;aspect-ratio:1;background:#fff;border-radius:8px;overflow:hidden;box-shadow:0 6px 18px rgba(0,0,0,.55);z-index:2;}
  .paintCanvasFrame canvas{width:100%;height:100%;display:block;}
  .studioTools{position:absolute;left:0;right:0;bottom:3.5%;display:flex;gap:10px;justify-content:center;z-index:4;}
  /* reward video plays right where the picture was, keeping the studio around it */
  .paintStudioReward{position:absolute;left:8%;top:23%;width:84%;aspect-ratio:16/9;background:#000;border-radius:8px;overflow:hidden;box-shadow:0 6px 18px rgba(0,0,0,.55);z-index:5;}
  .paintStudioReward video{width:100%;height:100%;object-fit:cover;display:block;}
  #colorCanvas{width:min(88vw,480px);height:min(88vw,480px);border-radius:18px;box-shadow:0 8px 24px rgba(0,0,0,.15);touch-action:none;background:#fff;cursor:pointer;}
  #paintCanvas{width:min(88vw,480px);height:min(88vw,480px);border-radius:18px;box-shadow:0 8px 24px rgba(0,0,0,.15);touch-action:none;cursor:crosshair;display:block;}
  .colorTools{display:flex;gap:8px;margin-top:8px;}

  /* bottom nav / next arrow */
  .navbar{position:absolute;bottom:0;left:0;right:0;display:flex;justify-content:center;gap:10px;padding:12px 14px;z-index:20;background:linear-gradient(0deg,rgba(233,247,255,.95),rgba(233,247,255,0));}
  .arrowBtn{border:none;border-radius:999px;padding:14px 24px;font-size:clamp(15px,4vw,19px);font-family:inherit;font-weight:bold;color:#fff;background:var(--violet);cursor:pointer;box-shadow:0 5px 0 var(--violet-deep);}
  .arrowBtn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--violet-deep);}
  .backBtn{background:#fff;color:var(--violet-deep);box-shadow:0 5px 0 rgba(0,0,0,.15);}

  /* ===== games ===== */
  .gamewrap{width:100%;display:flex;flex-direction:column;align-items:center;}
  .ask{font-size:clamp(18px,4.6vw,26px);font-weight:bold;color:var(--violet-deep);margin:4px 0 10px;text-align:center;}
  .scorePill{position:absolute;}
  .feedback{font-size:clamp(18px,4.6vw,24px);font-weight:bold;min-height:32px;margin-top:8px;text-align:center;}
  .star{color:var(--daisy);}

  /* fish counting */
  /* fish memory match */
  .pondStage{position:relative;width:min(92vw,480px);aspect-ratio:4/3;border-radius:22px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.15);background:url('art/fishbackground.png') center/cover;display:grid;grid-template-columns:repeat(4,1fr);gap:3%;padding:4%;box-sizing:border-box;align-content:center;}
  .card{position:relative;aspect-ratio:1/1;background:none;border:none;padding:0;cursor:pointer;perspective:600px;}
  .cardInner{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d;}
  .card.flipped .cardInner{transform:rotateY(180deg);}
  .cardFace{position:absolute;inset:0;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;border-radius:50%;box-shadow:0 3px 0 rgba(0,0,0,.15);}
  .cardBack{background:radial-gradient(circle,#eaffd8,#cdeec0);}
  .cardBack svg,.cardBack img{width:82%;object-fit:contain;filter:drop-shadow(0 2px 2px rgba(0,0,0,.15));}
  .cardFront{background:#fff;transform:rotateY(180deg);}
  .cardFront img{width:78%;object-fit:contain;}
  .card.matched .cardFront{box-shadow:0 0 0 4px #ffd34e,0 3px 0 rgba(0,0,0,.15);}
  .card.matched{cursor:default;pointer-events:none;}
  .choices{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap;}
  .choice{width:66px;height:66px;border-radius:16px;border:none;background:#fff;font-size:28px;font-weight:bold;color:var(--violet-deep);box-shadow:0 5px 0 rgba(0,0,0,.15);cursor:pointer;}
  .choice:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.15);}

  /* butterfly match */
  .skyBox{position:relative;width:min(88vw,480px);height:min(60vw,320px);background:url('art/butterflybackground.png') center/cover, linear-gradient(180deg,#e9d5ff,#c9f0ff);border-radius:20px;overflow:hidden;box-shadow:inset 0 -6px 14px rgba(0,0,0,.08);}
  .targetSwatch{width:44px;height:44px;border-radius:50%;border:4px solid #fff;box-shadow:0 3px 8px rgba(0,0,0,.25);display:inline-block;vertical-align:middle;margin-left:8px;}
  .butterfly{position:absolute;width:58px;height:44px;cursor:pointer;transition:transform .15s;}
  .butterfly.flutterA{animation:flutterA 5s ease-in-out infinite;}
  .butterfly.flutterB{animation:flutterB 6.5s ease-in-out infinite;}
  .butterfly.flutterC{animation:flutterC 4.2s ease-in-out infinite;}
  @keyframes flutterA{0%,100%{transform:translate(0,0) rotate(0deg)}25%{transform:translate(30px,-18px) rotate(8deg)}50%{transform:translate(4px,10px) rotate(-6deg)}75%{transform:translate(-26px,-8px) rotate(6deg)}}
  @keyframes flutterB{0%,100%{transform:translate(0,0) rotate(0deg)}30%{transform:translate(-22px,14px) rotate(-8deg)}60%{transform:translate(18px,-20px) rotate(8deg)}}
  @keyframes flutterC{0%,100%{transform:translate(0,0) rotate(0deg)}40%{transform:translate(20px,20px) rotate(6deg)}70%{transform:translate(-18px,-10px) rotate(-8deg)}}
  .butterfly.caught{animation:none !important;transform:scale(1.4);opacity:0;transition:.4s;}
  .netChoices{display:flex;gap:18px;justify-content:center;margin-top:12px;flex-wrap:wrap;}
  .netChoice{position:relative;background:none;border:none;padding:0;cursor:pointer;width:72px;height:88px;transition:transform .15s,opacity .3s;}
  .netIcon{display:block;width:100%;height:100%;}
  .netIcon img,.netIcon svg{width:100%;height:100%;object-fit:contain;display:block;filter:drop-shadow(0 4px 6px rgba(0,0,0,.2));}
  .netNumber{position:absolute;bottom:-4px;right:-6px;width:28px;height:28px;border-radius:50%;background:#fff;border:3px solid var(--violet);display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:15px;color:var(--violet-deep);box-shadow:0 2px 4px rgba(0,0,0,.25);}
  .netChoice:active:not(:disabled){transform:scale(0.92);}
  .netChoice.wrong{animation:netShake .4s;opacity:.35;}
  .netChoice:disabled{cursor:default;}
  @keyframes netShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
  .captureNet{position:absolute;left:50%;bottom:-14%;width:76px;height:92px;transform:translate(-50%,0) scale(0.6) rotate(-8deg);opacity:0;transition:transform .5s cubic-bezier(.34,1.56,.64,1),opacity .25s;pointer-events:none;z-index:7;}
  .captureNet.swoop{bottom:36%;transform:translate(-50%,0) scale(1.15) rotate(6deg);opacity:1;}

  /* wake up violet */
  .wakeStage{position:relative;width:min(88vw,480px);aspect-ratio:1/1;border-radius:22px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.15);background:#fff;}
  .wakeStage img{width:100%;height:100%;object-fit:cover;display:block;}
  .wakeStage.shake img{animation:shakeIt .5s;}
  @keyframes shakeIt{0%,100%{transform:translate(0,0) rotate(0)}20%{transform:translate(-6px,2px) rotate(-2deg)}40%{transform:translate(6px,-2px) rotate(2deg)}60%{transform:translate(-4px,2px) rotate(-1deg)}80%{transform:translate(4px,-2px) rotate(1deg)}}
  .wakeStage.awake img{animation:wakePulse 1s ease;}
  @keyframes wakePulse{0%{filter:brightness(1)}50%{filter:brightness(1.5)}100%{filter:brightness(1)}}
  .wakeStage.groggy img{animation:groggyDim .7s ease;}
  @keyframes groggyDim{0%,100%{filter:brightness(1)}50%{filter:brightness(.75) saturate(.7)}}
  .wakeDial{width:min(80vw,320px);margin:12px 0 6px;text-align:center;}
  .wakeDialLabel{font-weight:bold;color:var(--violet-deep);font-size:clamp(13px,3.4vw,16px);margin-bottom:6px;}
  .wakeDialTrack{width:100%;height:18px;background:#fff;border-radius:999px;border:3px solid var(--violet);overflow:hidden;box-shadow:inset 0 2px 4px rgba(0,0,0,.1);}
  .wakeDialFill{height:100%;width:0%;background:linear-gradient(90deg,var(--violet),var(--daisy));border-radius:999px;transition:width .4s ease;}
  .wakeMethods{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:6px;}
  .method{border:none;border-radius:16px;padding:12px 16px;font-size:clamp(22px,6vw,30px);background:#fff;box-shadow:0 4px 0 rgba(0,0,0,.15);cursor:pointer;}
  .method:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.15);}
  .method:disabled{opacity:.45;cursor:default;}
  .sparkle{position:absolute;font-size:26px;pointer-events:none;animation:sparkleUp 1s ease forwards;z-index:6;}
  @keyframes sparkleUp{from{transform:translateY(0) scale(.6);opacity:1}to{transform:translateY(-60px) scale(1.3);opacity:0}}
  .sfxPop{position:absolute;left:50%;top:36%;transform:translate(-50%,-50%);font-weight:900;font-size:clamp(26px,8vw,42px);color:#fff;-webkit-text-stroke:2px var(--violet-deep);text-shadow:3px 3px 0 var(--violet-deep);pointer-events:none;z-index:6;animation:sfxPop .85s ease forwards;white-space:nowrap;}
  @keyframes sfxPop{0%{opacity:0;transform:translate(-50%,-50%) scale(.4) rotate(-8deg)}30%{opacity:1;transform:translate(-50%,-50%) scale(1.15) rotate(4deg)}70%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(-2deg)}100%{opacity:0;transform:translate(-50%,-50%) scale(1) rotate(0)}}
  .confetti{position:absolute;font-size:22px;pointer-events:none;z-index:6;animation:confettiFall 1.3s ease forwards;}
  @keyframes confettiFall{0%{transform:translateY(-10px) rotate(0deg);opacity:1}100%{transform:translateY(140px) rotate(300deg);opacity:0}}

  /* kite: pick a box, build the kite, then fly it to catch stars */
  .kiteStage{position:relative;width:min(92vw,480px);aspect-ratio:3/4;border-radius:22px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.15);background:url('art/kitebackground.png') center/cover;touch-action:none;}
  .kbHint{position:absolute;top:2.5%;left:0;width:100%;text-align:center;color:#fff;font-weight:bold;text-shadow:0 2px 4px rgba(0,0,0,.55);font-size:clamp(14px,3.6vw,18px);z-index:8;padding:0 6%;}
  .kbChoose{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:5%;}
  .kbChooseTitle{color:#15efd6!important;text-shadow:0 2px 5px rgba(0,0,0,.6);font-size:clamp(17px,4.6vw,24px)!important;}
  .kbChoose{gap:4%;padding:0 2%;align-items:flex-end;}
  .kbCharPick{background:transparent;border:none;border-radius:18px;padding:2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:none;flex:none;}
  .kbCharPick:active{transform:translateY(3px);}
  .kbCharPick img{width:auto;height:auto;display:block;object-fit:contain;filter:drop-shadow(0 5px 8px rgba(0,0,0,.42));}
  /* cap BOTH dimensions (never a fixed height) so the picture keeps its aspect ratio and can't stretch/squish */
  .kbCharPick.violet img{max-height:min(23vh,190px);max-width:44vw;}
  .kbCharPick.lainey img{max-height:min(19vh,158px);max-width:38vw;}
  .kbCharPick span{font-weight:bold;font-size:clamp(16px,4.4vw,22px);text-shadow:0 2px 4px rgba(255,255,255,.6);}
  .kbCharPick.violet span{color:#8e2fd0;} .kbCharPick.lainey span{color:#e02525;}
  .kbAssembly{position:absolute;left:33%;top:5%;width:36%;transform:translateX(-50%);z-index:4;}
  .kbKiteImg{width:100%;display:block;}
  .kbKiteImg.abs{position:absolute;left:0;top:0;}
  .kbTailImg{position:absolute;left:50%;top:80%;width:46%;transform:translateX(-50%);}
  .kbPopKite{animation:kbKitePop .45s ease;}
  @keyframes kbKitePop{0%{transform:scale(.88)}55%{transform:scale(1.06)}100%{transform:scale(1)}}
  /* after the win: the finished kite pulses and is tappable ("give it to X") */
  .kbGiftKite{cursor:pointer;pointer-events:auto;filter:drop-shadow(0 0 12px rgba(255,220,90,.9));animation:kbGiftPulse 1s ease-in-out infinite;}
  @keyframes kbGiftPulse{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.1)}}
  .kbGhost{opacity:.42;filter:grayscale(.35) brightness(1.35);}
  .kbPart{opacity:0;transition:opacity .3s;}
  .kbPart.show{opacity:1;}
  /* build layout: reference kite (left) and kite being built (right) at the SAME
     level; box centred toward the bottom; items sit in the supply crate */
  .kbRef{position:absolute;left:7.5%;top:18%;height:42%;width:auto;z-index:4;filter:drop-shadow(0 3px 5px rgba(0,0,0,.3));}
  .kbRef-lainey{height:38%;top:19.5%;}
  .kbRefLabel{position:absolute;left:0;width:46%;text-align:center;top:5%;z-index:5;font-size:clamp(12px,3.2vw,16px);font-weight:bold;color:#000;text-shadow:0 1px 3px rgba(255,255,255,.85);}
  .kbBuildAsm{position:absolute!important;right:7.7%!important;left:auto!important;top:11%!important;height:56%!important;width:auto!important;transform:none!important;}
  .kbBuildAsm .kbKiteImg{height:100%;width:auto;}
  .kbBowImg{position:absolute;transform:translate(-50%,-50%);filter:drop-shadow(0 2px 3px rgba(0,0,0,.3));}
  /* spool layers sit on the SAME canvas as the kite face, so they line up exactly */
  .kbSpoolLayer{position:absolute;left:0;top:0;height:100%;width:auto;pointer-events:none;}
  .kbGhostSpool{filter:grayscale(1) brightness(1.55) opacity(.4);}
  .kbSpool{position:absolute;left:50%;top:33%;transform:translateX(-50%);width:16%;z-index:6;cursor:grab;touch-action:none;filter:drop-shadow(0 4px 5px rgba(0,0,0,.35));}
  .kbSpool img{width:100%;display:block;pointer-events:none;}
  .kbBox{position:absolute;left:50%;transform:translateX(-50%);bottom:26%;width:44%;z-index:3;filter:drop-shadow(0 6px 10px rgba(0,0,0,.42));}
  .kbTray{position:absolute;left:1.5%;bottom:1%;width:97%;height:23%;display:flex;justify-content:space-around;align-items:center;z-index:6;background-size:100% 100%;background-repeat:no-repeat;padding:0 3% 2%;overflow:visible;}
  /* finished-kite "give it to <char>" box — tap it to play the reward */
  .kbGiveBox{position:absolute;left:50%;bottom:1.5%;transform:translateX(-50%);width:46%;max-width:250px;border:none;background:transparent;cursor:pointer;padding:0;z-index:8;-webkit-tap-highlight-color:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;animation:kbGiveBounce 1s ease-in-out infinite;}
  .kbGiveBox img{width:100%;height:auto;display:block;filter:drop-shadow(0 0 11px rgba(255,220,90,.95)) drop-shadow(0 5px 8px rgba(0,0,0,.4));pointer-events:none;}
  .kbGiveTip{font-weight:800;color:#16a34a;font-size:clamp(14px,3.8vw,20px);text-shadow:0 2px 4px rgba(255,255,255,.8);pointer-events:none;white-space:nowrap;}
  @keyframes kbGiveBounce{0%,100%{transform:translateX(-50%) translateY(0) scale(1)}50%{transform:translateX(-50%) translateY(-8px) scale(1.05)}}
  .kbPiece{cursor:grab;touch-action:none;display:flex;align-items:flex-end;}
  .kbPiece img{max-height:9vh;max-width:11vw;width:auto;display:block;pointer-events:none;filter:drop-shadow(0 3px 4px rgba(0,0,0,.3));}
  /* the spool item is a tall spool+string — size it by WIDTH so the reel is bow-sized; let the string run up out of the crate */
  #kbPiece-spool{align-self:flex-end;overflow:visible;}
  #kbPiece-spool img{max-height:40vh;max-width:24vw;}
  .kbPiece.placed{visibility:hidden;}
  .kbPiece.kbLocked, .kbSpool.kbLocked{opacity:.4;filter:grayscale(.85) brightness(1.05);cursor:default;pointer-events:none;}
  .kbDragging{position:absolute;z-index:10;pointer-events:none;transform:translate(-50%,-50%);}
  .kbDragging img{display:block;filter:drop-shadow(0 8px 10px rgba(0,0,0,.35));}
  .kbFlyKite{z-index:5;pointer-events:none;filter:drop-shadow(0 6px 8px rgba(0,0,0,.28));}
  .kbFall{position:absolute;z-index:3;pointer-events:none;font-size:clamp(26px,7vw,38px);line-height:1;filter:drop-shadow(0 2px 3px rgba(0,0,0,.3));will-change:top;}
  .kbFall.caught{animation:kbCaughtA .3s ease forwards;}
  @keyframes kbCaughtA{to{transform:scale(1.8);opacity:0;}}
  /* Kite Color Match */
  #kmAsk span{font-weight:900;}
  .kmSky{position:relative;width:min(94vw,520px);height:min(56vh,410px);margin:0 auto;border-radius:22px;overflow:hidden;background:#bfe3ff center/cover no-repeat;background-image:url('art/kitebackground.png');box-shadow:0 8px 24px rgba(0,0,0,.15);}
  .kmKite{position:absolute;width:22%;max-width:120px;border:none;background:transparent;cursor:pointer;padding:0;-webkit-tap-highlight-color:transparent;animation:kmSway 3.4s ease-in-out infinite;}
  .kmKite img{width:100%;height:auto;display:block;filter:drop-shadow(0 5px 8px rgba(0,0,0,.35));pointer-events:none;}
  .kmKite:active{filter:brightness(1.05);}
  @keyframes kmSway{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-12px) rotate(3deg)}}
  .kmKite.kmShake{animation:kmShake .45s ease;}
  @keyframes kmShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-7px)}80%{transform:translateX(7px)}}
  .kmKite.kmFlyUp{animation:kmFlyUp 1s ease forwards;pointer-events:none;z-index:6;}
  @keyframes kmFlyUp{to{transform:translateY(-150%) scale(.55);opacity:0}}
  .kmKite.kmFade{animation:kmFade .5s ease forwards;pointer-events:none;}
  @keyframes kmFade{to{opacity:.15;transform:scale(.9)}}
  .kbProgress{position:absolute;top:9%;left:50%;transform:translateX(-50%);display:flex;gap:4px;z-index:8;background:rgba(0,0,0,.15);border-radius:20px;padding:3px 10px;}
  .kbPip{font-size:20px;filter:grayscale(1) opacity(.55);transition:filter .2s,transform .2s;}
  .kbPip.done{filter:none;transform:scale(1.15);}

  /* down the tree maze */
  .mazeStage{position:relative;height:min(72vh,660px);aspect-ratio:6/10;width:auto;max-width:96vw;margin:0 auto;border-radius:22px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.15);background:url('art/maze/mazebackground.png') center/cover, linear-gradient(180deg,var(--sky),var(--grass));}
  #mazeCanvas{position:relative;width:100%;height:100%;display:block;touch-action:none;cursor:grab;}
  #mazeCanvas:active{cursor:grabbing;}
  /* tap-to-see reward button (a tap lets iOS play the maze video WITH sound) */
  .mazeTapReward{position:absolute;inset:0;z-index:9;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:radial-gradient(circle at 50% 45%,rgba(30,20,60,.42),rgba(20,14,40,.72));color:#fff;-webkit-tap-highlight-color:transparent;border-radius:22px;}
  .mazeTapReward .mazeTapTri{width:80px;height:80px;border-radius:50%;background:linear-gradient(180deg,#ffd23f,#ff9a3d);color:#3a2b00;font-size:34px;display:flex;align-items:center;justify-content:center;padding-left:6px;box-shadow:0 8px 22px rgba(0,0,0,.4);animation:mazeTapPulse 1.1s ease-in-out infinite;}
  .mazeTapReward .mazeTapTxt{font-weight:800;font-size:clamp(16px,4.4vw,23px);text-shadow:0 2px 6px rgba(0,0,0,.6);}
  @keyframes mazeTapPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}

  /* hide and seek: intro video */
  .introVideoWrap{position:relative;width:min(88vw,480px);aspect-ratio:1/1;border-radius:22px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.15);background:#000;}
  .introVideoWrap video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000;}
  .introOverlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(180deg,#5e3a85,#7b4ea8);cursor:pointer;z-index:2;}
  .introSkip{position:absolute;bottom:10px;right:10px;z-index:3;background:rgba(0,0,0,.55);color:#fff;border:none;border-radius:999px;padding:8px 16px;font-family:inherit;font-size:14px;font-weight:bold;cursor:pointer;}
  .rewardOverlay{position:fixed;inset:0;z-index:100;background:rgba(20,10,35,.85);display:flex;align-items:center;justify-content:center;padding:20px;}

  /* hide and seek: flower garden */
  .garden{background:linear-gradient(180deg,#eafbe2,#bfe89f);border-radius:20px;width:min(92vw,520px);height:170px;box-shadow:inset 0 -6px 14px rgba(0,0,0,.06);position:relative;overflow:hidden;}
  .flowerSpot{position:absolute;bottom:6px;border:none;background:transparent;width:18%;max-width:98px;aspect-ratio:3/4;cursor:pointer;padding:0;transform:translateX(-50%);transition:left .75s ease;}
  .flowerSpot:disabled{cursor:default;}
  .colorPicker{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;width:min(92vw,520px);}
  .colorPickBtn{border:none;background:#fff;border-radius:16px;padding:8px;width:80px;height:96px;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.15);}
  .colorPickBtn img{width:100%;height:100%;object-fit:contain;}
  .colorPickBtn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.15);}

  /* firefly pattern game */
  .fireflyStage{position:relative;width:min(96vw,720px);aspect-ratio:12/7;border-radius:22px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.15);background:url('art/fireflybackground.png') center/cover, radial-gradient(circle at 50% 20%,#2b2158,#14102c 75%);margin-bottom:10px;}
  .firefly{position:absolute;bottom:22%;border:none;background:transparent;width:20%;max-width:120px;aspect-ratio:1/1;transform:translateX(-50%);cursor:pointer;padding:0;}
  .ffProgress{display:flex;gap:12px;justify-content:center;margin:2px 0 8px;}
  .ffDot{width:20px;height:20px;border-radius:50%;border:3px solid #b18ce0;background:transparent;box-sizing:border-box;transition:background .2s,box-shadow .2s;}
  .ffDot.done{background:#ffd34e;border-color:#ffd34e;box-shadow:0 0 10px rgba(255,211,78,.75);}
  .firefly:disabled{cursor:default;}
  .firefly img{width:100%;height:100%;object-fit:contain;display:block;filter:brightness(.55) saturate(.7);transition:filter .15s;}
  .firefly.lit img{filter:brightness(1.15) saturate(1.1) drop-shadow(0 0 10px #ffe98a) drop-shadow(0 0 20px #ffe98a);}

  /* ===== Create Your Own (white / black canvas free-draw) ===== */
  .ccChoose{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;margin:8px auto;}
  .ccPick{border:4px solid transparent;background:#fff;border-radius:20px;padding:8px 8px 6px;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.14);display:flex;flex-direction:column;align-items:center;gap:4px;transition:transform .08s;}
  .ccPick:active{transform:translateY(3px);}
  .ccPick img{width:min(40vw,220px);height:auto;border-radius:12px;display:block;}
  .ccPick span{font-weight:bold;color:var(--violet-deep);font-size:clamp(15px,3.6vw,19px);}
  .ccStudio{display:flex;flex-direction:column;align-items:center;width:100%;gap:4px;padding-top:4px;}
  .ccBoard{position:relative;width:min(96vw,580px);aspect-ratio:1152/648;height:auto;}
  .ccBoard .ccBg{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;display:block;pointer-events:none;}
  .ccCanvas{position:absolute;touch-action:none;cursor:crosshair;border-radius:4px;}
  .ccPalette{position:relative;width:min(74vw,350px);margin-top:0;}
  .ccPalette img{width:100%;display:block;}
  .ccColor{position:absolute;width:15%;aspect-ratio:1/1;border-radius:50%;background:transparent;border:none;transform:translate(-50%,-50%);cursor:pointer;padding:0;-webkit-tap-highlight-color:transparent;}
  .ccColor.sel{box-shadow:0 0 0 4px #fff,0 0 0 8px var(--daisy);}
  .ccTools{display:flex;gap:10px;justify-content:center;margin-top:2px;}

  /* ===== Tic-Tac-Toe (Morning Arrives) ===== */
  .tttChoose{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;margin:6px 0 4px;}
  .tttPick{border:4px solid transparent;background:#fff;border-radius:22px;padding:10px 10px 6px;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.14);display:flex;flex-direction:column;align-items:center;gap:2px;transition:transform .08s,border-color .12s;}
  .tttPick:active{transform:translateY(3px);}
  .tttPick img{width:min(34vw,150px);height:min(34vw,150px);object-fit:contain;display:block;}
  .tttChoose4{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:min(88vw,420px);margin:6px auto 4px;}
  .tttChoose4 .tttPick{padding:8px 8px 5px;}
  .tttChoose4 .tttPick img{width:min(30vw,130px);height:min(30vw,130px);}
  .tttPick span{font-weight:bold;font-size:clamp(16px,4vw,20px);}
  .tttPick.violet span{color:var(--violet-deep);} .tttPick.lainey span{color:var(--lainey-deep);}
  .tttWheelCircle{position:relative;width:min(70vw,300px);height:min(70vw,300px);}
  .tttPointer{position:absolute;top:-10px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:22px solid transparent;border-right:22px solid transparent;border-top:36px solid #14e6c0;filter:drop-shadow(0 2px 2px rgba(0,0,0,.35));z-index:5;}
  .tttWheelWrap{display:flex;flex-direction:column;align-items:center;margin:6px auto 4px;}
  .tttWheel{width:100%;height:100%;border-radius:50%;position:relative;overflow:hidden;box-shadow:0 8px 22px rgba(0,0,0,.25),inset 0 0 0 8px #fff;background:conic-gradient(from 0deg, var(--violet) 0deg 45deg, var(--lainey) 45deg 90deg, var(--violet) 90deg 135deg, var(--lainey) 135deg 180deg, var(--violet) 180deg 225deg, var(--lainey) 225deg 270deg, var(--violet) 270deg 315deg, var(--lainey) 315deg 360deg);}
  .tttWheelImg{position:absolute;transform:translate(-50%,-50%);width:19%;height:19%;object-fit:contain;filter:drop-shadow(0 1px 2px rgba(0,0,0,.35));}
  .tttHub{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:16%;height:16%;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.3);z-index:4;}
  .tttSpinBtn{margin-top:16px;}
  .tttBoard{position:relative;width:min(94vw,540px);aspect-ratio:1672/941;margin:2px auto;border-radius:14px;overflow:hidden;}
  .tttBoard .tttBg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;}
  .tttCell{position:absolute;background:transparent;border:none;padding:0;cursor:pointer;display:flex;align-items:center;justify-content:center;border-radius:10px;-webkit-tap-highlight-color:transparent;}
  .tttCell:disabled{cursor:default;}
  .tttCell img{width:86%;height:86%;object-fit:contain;pointer-events:none;animation:tttPop .28s ease;filter:drop-shadow(0 3px 5px rgba(0,0,0,.3));}
  .tttCell img.win{animation:tttWin .7s ease infinite alternate;}
  @keyframes tttPop{from{transform:scale(.2);opacity:0;}to{transform:scale(1);opacity:1;}}
  @keyframes tttWin{from{filter:drop-shadow(0 0 4px #ffd34e);transform:scale(1);}to{filter:drop-shadow(0 0 16px #ffd34e) drop-shadow(0 0 26px #ffd34e);transform:scale(1.08);}}

  /* ===== Catch the Rising Hearts (The End) ===== */
  .heartStage{position:relative;width:min(94vw,520px);height:min(64vh,600px);border-radius:22px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.18);background:url('art/page19video2.png') center/cover;}
  .heartProgress{display:flex;gap:8px;justify-content:center;margin:4px 0 8px;min-height:30px;}
  .heartPip{font-size:26px;filter:grayscale(1) opacity(.45);transition:filter .2s,transform .2s;}
  .heartPip.done{filter:none;transform:scale(1.15);}
  .risingHeart{position:absolute;bottom:-70px;border:none;background:transparent;padding:0;cursor:pointer;font-size:52px;line-height:1;filter:drop-shadow(0 0 2px #fff) drop-shadow(0 0 2px #fff) drop-shadow(0 3px 4px rgba(0,0,0,.45));will-change:transform;-webkit-tap-highlight-color:transparent;}
  .risingHeart.caught{animation:heartCaught .35s ease forwards;pointer-events:none;}
  @keyframes heartRise{from{transform:translateY(0) rotate(-6deg);}50%{transform:translateY(var(--half)) rotate(6deg);}to{transform:translateY(var(--rise)) rotate(-4deg);}}
  @keyframes heartCaught{to{transform:scale(1.9);opacity:0;}}

  /* Lainey's rock-nap shell game (cricket scene) */
  .rockStage{position:relative;width:min(92vw,520px);height:240px;border-radius:22px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.15);background:linear-gradient(180deg,#2b2158 0%,#41337a 54%,#1e4633 54%,#143324 100%);}
  /* reward clips that are portrait play full-screen so the whole frame is seen */
  .fullScreenReward{position:fixed;inset:0;z-index:9999;background:#000;display:flex;align-items:center;justify-content:center;}
  .rockBand{position:absolute;top:8px;right:12px;font-size:clamp(20px,5vw,28px);opacity:.9;}
  .rockBand.pulse{animation:rockBandPulse .4s ease;}
  @keyframes rockBandPulse{0%{transform:scale(1)}40%{transform:scale(1.2)}100%{transform:scale(1)}}
  .rockSpot{position:absolute;bottom:8px;border:none;background:transparent;width:22%;max-width:112px;cursor:pointer;padding:0;transform:translateX(-50%);transition:left .6s ease;}
  .rockSpot .rockEmoji{font-size:clamp(58px,17vw,88px);display:block;line-height:1;filter:drop-shadow(0 6px 6px rgba(0,0,0,.4));position:relative;z-index:2;}
  .rockSpot .rockImg{width:100%;display:block;filter:drop-shadow(0 8px 6px rgba(0,0,0,.5));position:relative;z-index:2;}
  .rockSpot.bounce .rockEmoji,.rockSpot.bounce .rockImg{animation:flowerBounce .26s ease;}
  .rockBoard{background:url('art/rockbackground.png') center/cover;}
  /* Lainey is a direct child of the rock stage now: she stands on the
     background, walks (left transition) to her rock, then ducks behind it */
  .rockLainey{position:absolute;left:50%;bottom:7%;transform:translateX(-50%);width:25%;max-width:132px;z-index:4;filter:drop-shadow(0 5px 6px rgba(0,0,0,.4));transition:left .9s ease,opacity .5s ease,bottom .5s ease;pointer-events:none;}
  .rockLainey.hidden{opacity:0;bottom:1%;z-index:1;}
  .rockLainey.revealed{opacity:1;z-index:5;bottom:16%;width:28%;}
  .beatProgress{display:flex;gap:6px;justify-content:center;}
  .beatDot{font-size:22px;opacity:.25;transition:opacity .2s,transform .2s;}
  .beatDot img{width:20px;height:auto;display:block;}
  .beatDot.filled{opacity:1;transform:scale(1.2);}

  /* fountain splash reaction game */
  .fountainStage{position:relative;width:min(92vw,480px);height:280px;border-radius:22px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.15);background:url('art/nowaterfountain.png') center/cover;}
  .droplet{position:absolute;transform:translate(-50%,-50%);border:none;background:transparent;font-size:44px;cursor:pointer;padding:0;animation:dropletIn .2s ease;}
  .droplet img{width:38px;height:auto;display:block;filter:drop-shadow(0 2px 3px rgba(0,0,0,.2));}
  .droplet.popped{animation:dropletPop .2s ease forwards;}
  .droplet.faded{animation:dropletFade .3s ease forwards;}
  @keyframes dropletIn{0%{transform:translate(-50%,-50%) scale(0)}100%{transform:translate(-50%,-50%) scale(1)}}
  @keyframes dropletPop{0%{transform:translate(-50%,-50%) scale(1);opacity:1}100%{transform:translate(-50%,-50%) scale(1.7);opacity:0}}
  @keyframes dropletFade{0%{transform:translate(-50%,-50%) scale(1);opacity:1}100%{transform:translate(-50%,-50%) scale(.6);opacity:0}}

  /* catch the apples drag game */
  .appleStage{position:relative;width:min(94vw,640px);height:440px;border-radius:22px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.15);background:url('art/appletree.png') center/cover;touch-action:none;cursor:grab;}
  /* apple bucket: sits in the bottom-LEFT corner (as big as the character), caught apples pile into it, then it flashes (tappable) once all 10 are caught */
  .apBucket{position:absolute;left:0.5%;bottom:2%;width:20%;z-index:7;pointer-events:none;border:none;background:transparent;padding:0;appearance:none;-webkit-appearance:none;-webkit-tap-highlight-color:transparent;animation:apBucketPop .4s ease;}
  .apBucket img{width:100%;height:auto;display:block;filter:drop-shadow(0 5px 10px rgba(0,0,0,.4));}
  @keyframes apBucketPop{0%{transform:translateY(30%) scale(.6);opacity:0}100%{transform:translateY(0) scale(1);opacity:1}}
  .apBucket.apBucketFlash{cursor:pointer;pointer-events:auto;z-index:9;animation:apBucketFlash .6s ease-in-out infinite;}
  @keyframes apBucketFlash{0%,100%{opacity:1;transform:scale(1);filter:drop-shadow(0 5px 10px rgba(0,0,0,.4))}50%{opacity:.55;transform:scale(1.12);filter:drop-shadow(0 0 18px rgba(255,220,90,.95))}}
  .basket{position:absolute;bottom:4%;transform:translateX(-50%);border:none;background:transparent;pointer-events:none;padding:0;width:130px;}
  .basket img{width:100%;display:block;filter:drop-shadow(0 4px 6px rgba(0,0,0,.25));}
  /* character picker overlaid right on the apple-tree background, so
     Lainey and Violet look like they're standing under the tree waiting
     to be picked, rather than on a separate plain white card */
  .charChoice{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;gap:30px;padding-bottom:5%;background:rgba(20,10,30,.12);}
  .charChoiceBtn{background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;width:150px;padding:0;transition:transform .15s;}
  .charChoiceBtn:active{transform:scale(0.94);}
  .charChoiceBtn img{width:100%;height:auto;object-fit:contain;display:block;filter:drop-shadow(0 8px 10px rgba(0,0,0,.4));}
  .charChoiceBtn span{font-weight:bold;color:#fff;font-size:16px;background:rgba(123,78,168,.9);padding:3px 16px;border-radius:999px;text-shadow:none;box-shadow:0 2px 6px rgba(0,0,0,.25);}
  .fallingApple{position:absolute;transform:translateX(-50%);font-size:36px;pointer-events:none;}
  .fallingApple.caught{animation:appleCaught .22s ease-in forwards;}
  .fallingApple.piled{font-size:26px;z-index:1;}
  @keyframes appleCaught{0%{transform:translateX(-50%) scale(1);opacity:1}100%{transform:translateX(-50%) scale(0.15) translateY(10px);opacity:0}}

  /* stay awake! tap-to-fill meter game */
  .awakeStage{position:relative;width:min(92vw,480px);aspect-ratio:3/2;border-radius:22px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.15);background:#8fd0ff;display:flex;align-items:center;justify-content:center;}
  .awakeTapTarget{border:none;background:transparent;cursor:pointer;padding:0;width:100%;height:100%;animation:awakeNod 2.2s ease-in-out infinite;}
  .awakeTapTarget img{width:100%;height:100%;object-fit:cover;display:block;}
  .awakeTapTarget.bounce{animation:awakeBounce .15s ease;}
  @keyframes awakeNod{0%,100%{transform:scale(1)}50%{transform:scale(1.015)}}
  @keyframes awakeBounce{0%{transform:scale(1)}50%{transform:scale(1.18)}100%{transform:scale(1)}}
  /* floating letters: tap the Z's to stay awake */
  .awNight{background:linear-gradient(180deg,#1b1450,#2b2470 55%,#3a2f7a 100%)!important;}
  .awFull{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;z-index:2;pointer-events:none;filter:drop-shadow(0 4px 10px rgba(0,0,0,.35));transition:opacity .15s;}
  .awLetter{position:absolute;top:100%;font-weight:900;font-family:'Baloo 2','Fredoka',system-ui,sans-serif;line-height:1;border:none;background:transparent;cursor:pointer;padding:5px;z-index:5;text-shadow:0 2px 4px rgba(0,0,0,.45);animation:awRise linear forwards;-webkit-tap-highlight-color:transparent;}
  .awLetter.awZ{animation:awRise linear forwards, awZwobble 1.1s ease-in-out infinite;}
  .awLetter.awPop{animation:awPop .35s ease forwards!important;pointer-events:none;}
  @keyframes awRise{from{top:100%}to{top:-24%}}
  @keyframes awZwobble{0%,100%{filter:brightness(1)}50%{filter:brightness(1.25)}}
  @keyframes awPop{0%{transform:scale(1);opacity:1}100%{transform:scale(2.1);opacity:0}}
  .awSpark{position:absolute;font-size:26px;z-index:6;pointer-events:none;animation:awSparkUp .7s ease-out forwards;}
  @keyframes awSparkUp{0%{transform:translateY(0) scale(.6);opacity:1}100%{transform:translateY(-40px) scale(1.4);opacity:0}}

  /* bring on the night — drag-to-transform reveal */
  .duskStage{position:relative;width:min(92vw,480px);height:320px;border-radius:22px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.15);background:linear-gradient(180deg,#ffb066,#ff8c69 40%,#c97a8e 70%,#8a5a7a 100%);}
  .duskNightLayer{position:absolute;inset:0;background:linear-gradient(180deg,#161033,#2b2158 60%,#3a2f6b 100%);opacity:0;}
  .duskStars{position:absolute;inset:0;opacity:0;}
  .star2{position:absolute;color:#fff;font-size:14px;animation:starTwinkle 1.8s ease-in-out infinite;}
  @keyframes starTwinkle{0%,100%{opacity:.4}50%{opacity:1}}
  .duskMoon{position:absolute;top:14%;right:14%;font-size:46px;opacity:0;pointer-events:none;}
  .duskSun{position:absolute;left:50%;transform:translate(-50%,-50%);border:none;background:transparent;font-size:60px;cursor:grab;padding:0;touch-action:none;z-index:3;}
  /* find the differences */
  .fdStage{position:relative;width:min(96vw,580px);aspect-ratio:1448/1086;margin:0 auto;background-size:contain;background-repeat:no-repeat;background-position:center;background-color:#fff;border-radius:14px;box-shadow:0 6px 18px rgba(0,0,0,.15);touch-action:manipulation;-webkit-tap-highlight-color:transparent;cursor:pointer;}
  .fdMark{position:absolute;width:9%;aspect-ratio:1;transform:translate(-50%,-50%);border:5px solid #e23b3b;border-radius:50%;box-sizing:border-box;pointer-events:none;box-shadow:0 0 8px rgba(226,59,59,.55);animation:fdPop .3s ease;}
  .fdMark.author{border-color:#2f7fd8;}
  /* 💡 hint ring — glows where a difference is, without marking it found */
  .fdHintRing{position:absolute;width:11%;aspect-ratio:1;transform:translate(-50%,-50%);border:5px dashed #ffc400;border-radius:50%;box-sizing:border-box;pointer-events:none;animation:fdHintGlow .9s ease-in-out infinite;}
  @keyframes fdHintGlow{0%,100%{opacity:.45;box-shadow:0 0 6px rgba(255,196,0,.5);transform:translate(-50%,-50%) scale(1)}50%{opacity:1;box-shadow:0 0 20px rgba(255,196,0,.95);transform:translate(-50%,-50%) scale(1.12)}}
  .fdBtns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:4px;}
  @keyframes fdPop{0%{transform:translate(-50%,-50%) scale(.3)}60%{transform:translate(-50%,-50%) scale(1.18)}100%{transform:translate(-50%,-50%) scale(1)}}
  .fdSetupBtns{display:flex;gap:8px;justify-content:center;margin:6px 0 8px;flex-wrap:wrap;}
  .fdNav{border:2px solid var(--violet);background:#fff;color:var(--violet-deep);border-radius:999px;padding:6px 14px;font-family:inherit;font-weight:bold;font-size:13px;cursor:pointer;}

  /* playground race board */
  .pgBoard{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;width:min(92vw,420px);background:linear-gradient(180deg,#eafbe2,#bfe89f);border-radius:20px;padding:12px;box-shadow:inset 0 -6px 14px rgba(0,0,0,.06);margin-bottom:10px;box-sizing:border-box;}
  .pgCell{position:relative;aspect-ratio:1/1;background:#fff;border-radius:12px;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 0 rgba(0,0,0,.1);}
  .pgNum{position:absolute;top:3px;left:6px;font-size:11px;font-weight:bold;color:var(--violet-deep);opacity:.6;}
  .pgIcon{font-size:22px;}
  .pgToken{position:absolute;font-size:26px;animation:pgTokenPop .3s ease;}
  @keyframes pgTokenPop{0%{transform:scale(0)}100%{transform:scale(1)}}

  /* seesaw balance game */
  .seesawStage{position:relative;width:min(92vw,480px);height:300px;border-radius:22px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.15);background:linear-gradient(180deg,var(--sky) 0%,var(--sky) 62%,var(--grass) 62%,#5a9450 100%);}
  .seesawBase{position:absolute;left:50%;bottom:32%;width:30px;height:44px;background:#6b4423;transform:translateX(-50%);clip-path:polygon(50% 0%,100% 100%,0% 100%);}
  .seesawPlank{position:absolute;left:50%;bottom:38%;width:72%;height:16px;background:#8d5524;border-radius:8px;transform-origin:50% 50%;transform:translateX(-50%) rotate(0deg);transition:transform .25s cubic-bezier(.34,1.4,.64,1);box-shadow:0 4px 6px rgba(0,0,0,.25);}
  .seesawPlank.tiltLeft{transform:translateX(-50%) rotate(-15deg);}
  .seesawPlank.tiltRight{transform:translateX(-50%) rotate(15deg);}
  .seesawChar{position:absolute;bottom:8px;width:66px;pointer-events:none;filter:drop-shadow(0 4px 5px rgba(0,0,0,.2));}
  .seesawChar.seesawLeft{left:-8%;}
  .seesawChar.seesawRight{right:-8%;}
  .seesawZone{position:absolute;top:0;bottom:0;width:50%;background:none;border:none;padding:0;cursor:pointer;}
  .seesawZone.seesawZoneLeft{left:0;}
  .seesawZone.seesawZoneRight{right:0;}
  .seesawZone:active{background:rgba(255,255,255,.12);}

  /* tuck them in (cozy nap game) */
  .tuckStage{position:relative;width:min(92vw,480px);height:320px;border-radius:22px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.15);background:linear-gradient(180deg,#3a2d6b 0%,#4a3b7a 45%,#5a4a86 70%,#6b5a96 100%);transition:filter .8s ease;}
  .tuckStage.dimmed{filter:brightness(.45) saturate(.85);}
  .tuckMoon{position:absolute;top:8%;right:12%;font-size:40px;filter:drop-shadow(0 0 10px rgba(255,240,180,.6));}
  .tuckStar{position:absolute;font-size:14px;opacity:.85;animation:tuckTwinkle 2.4s ease-in-out infinite;}
  @keyframes tuckTwinkle{0%,100%{opacity:.35}50%{opacity:1}}
  .tuckBed{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:82%;height:34%;background:linear-gradient(180deg,#c98fd6,#a86ec0);border-radius:20px 20px 0 0;box-shadow:0 -4px 10px rgba(0,0,0,.2);}
  .tuckChar{position:absolute;bottom:14%;width:26%;max-width:120px;z-index:2;filter:drop-shadow(0 3px 5px rgba(0,0,0,.3));}
  .tuckChar.tuckViolet{left:36%;transform:translateX(-50%);}
  .tuckChar.tuckLainey{left:62%;transform:translateX(-50%);width:20%;max-width:92px;}
  .tuckPillow{position:absolute;left:49%;bottom:24%;transform:translateX(-50%);width:52%;z-index:1;opacity:0;transition:opacity .4s;pointer-events:none;}
  .tuckPillow.placed{opacity:1;}
  .tuckBlanket{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:80%;height:20%;background:linear-gradient(180deg,#7cc6ff,#4a9fe0);border-radius:16px 16px 0 0;z-index:3;box-shadow:0 -3px 8px rgba(0,0,0,.2);opacity:0;transition:opacity .4s,height .5s;pointer-events:none;}
  .tuckBlanket.placed{opacity:1;height:26%;}
  .tuckZzz{position:absolute;left:50%;top:20%;transform:translateX(-50%);font-size:34px;z-index:6;opacity:0;transition:opacity .6s;}
  .tuckZzz.show{opacity:1;animation:tuckFloat 2.2s ease-in-out infinite;}
  @keyframes tuckFloat{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,-10px)}}
  .tuckItem{position:absolute;border:none;background:transparent;padding:0;cursor:grab;z-index:7;touch-action:none;filter:drop-shadow(0 4px 6px rgba(0,0,0,.35));}
  .tuckItem.dragging{cursor:grabbing;z-index:9;}
  .tuckItem.gone{opacity:0;transition:opacity .3s;pointer-events:none;}
  .tuckLamp{position:absolute;top:10%;left:10%;font-size:38px;border:none;background:transparent;cursor:pointer;z-index:7;filter:drop-shadow(0 0 12px rgba(255,220,120,.85));transition:filter .4s;}
  .tuckLamp.off{filter:none;opacity:.55;}

  /* count the sheep (nap game) — reuses the cozy .tuckStage scene */
  .sheep{position:absolute;font-size:40px;border:none;background:transparent;cursor:pointer;padding:0;z-index:4;line-height:1;}
  .sheep .sheepBob{display:inline-block;animation:sheepBob 1.4s ease-in-out infinite;}
  @keyframes sheepBob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-7px) rotate(3deg)}}
  .sheep.counted{transition:transform .3s,opacity .3s;transform:scale(1.5);opacity:0;pointer-events:none;}
  .sheepNum{position:absolute;font-size:32px;font-weight:bold;color:#ffe98a;z-index:6;pointer-events:none;text-shadow:0 2px 6px rgba(0,0,0,.55);animation:sheepNumPop .9s ease forwards;}
  @keyframes sheepNumPop{0%{transform:scale(.5);opacity:0}30%{transform:scale(1.25);opacity:1}100%{transform:scale(1) translateY(-24px);opacity:0}}

  /* bubble pop (bubble shooter) */
  .bubStage{position:relative;width:min(94vw,440px);border-radius:22px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.15);background:linear-gradient(180deg,#d7ccf5,#c3b6ec 60%,#b6a8e6);touch-action:none;}
  .bubStage canvas{display:block;width:100%;cursor:crosshair;}

  /* tuck them in — dress-up + bedtime game */
  .tuckScene{position:relative;width:min(94vw,520px);aspect-ratio:3/2;border-radius:20px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.2);background-size:cover;background-position:center;}
  .tuckCharPj{position:absolute;left:50%;bottom:2%;transform:translateX(-50%);height:64%;filter:drop-shadow(0 6px 8px rgba(0,0,0,.4));transition:left .6s ease,bottom .6s ease,height .6s ease,transform .6s ease,opacity .5s ease;pointer-events:none;z-index:2;}
  .tuckCharPj.tucked{left:31%;bottom:26%;height:34%;z-index:1;}
  .tuckOptions{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:10px;min-height:64px;}
  .tuckOpt{background:rgba(255,255,255,.7);border:3px solid var(--violet);border-radius:16px;padding:4px;cursor:pointer;width:70px;height:70px;display:flex;align-items:center;justify-content:center;transition:transform .15s;box-shadow:0 3px 0 rgba(0,0,0,.12);}
  .tuckOpt:active{transform:scale(0.92);}
  .tuckOpt img{max-width:100%;max-height:100%;object-fit:contain;display:block;}
  /* invisible tap targets — no outline/box, just a brief highlight on tap */
  .tuckZone{position:absolute;border:none;background:transparent;border-radius:14px;cursor:pointer;padding:0;z-index:3;-webkit-tap-highlight-color:transparent;}
  .tuckZone:active{background:rgba(255,255,255,.14);}
  /* Fill the Treasure Chest (drag-and-drop) */
  .treasureScene{position:relative;width:min(94vw,520px);aspect-ratio:3/2;border-radius:20px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.2);background-size:cover;background-position:center;touch-action:none;}
  /* treasures are hidden around the scene; drag one into the chest */
  .treasureItem{position:absolute;width:11%;cursor:grab;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-user-drag:none;filter:drop-shadow(0 2px 4px rgba(0,0,0,.5));z-index:4;}
  .treasureItem.dragging{cursor:grabbing;z-index:9999;filter:drop-shadow(0 5px 9px rgba(0,0,0,.55));}
  /* invisible drop zone sitting over the open chest painted into the
     background art (it's on the lower-left of moonlitscene.png) */
  .treasureChest{position:absolute;left:27%;top:46%;width:23%;height:31%;z-index:2;pointer-events:none;}
  /* all-items-in: the chest (cropped from taptreasure.png) sits exactly over the
     scene's chest and PULSATES like the kite; tapping it plays the reward */
  .treasureTap{position:absolute;left:26.06%;top:46.26%;width:23.85%;border:none;background:transparent;padding:0;cursor:pointer;z-index:9;-webkit-tap-highlight-color:transparent;transform-origin:50% 100%;animation:treasurePulse 1s ease-in-out infinite;}
  .treasureTap img{width:100%;height:auto;display:block;filter:drop-shadow(0 0 12px rgba(255,220,90,.9));}
  @keyframes treasurePulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
  .navytext{color:#16245c;}
  /* "what to find" guide: 2 rows of 5, each item in full colour with an
     empty circle above it that fills with that item once it's in the chest */
  .treasureRefGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px 8px;width:min(94vw,520px);margin-top:12px;}
  .treasureCell{display:flex;flex-direction:column;align-items:center;gap:2px;}
  .treasureSlot{width:38px;height:38px;border-radius:50%;box-sizing:border-box;background:rgba(30,22,60,.14);border:2px dashed rgba(120,95,160,.55);display:flex;align-items:center;justify-content:center;}
  .treasureSlot.filled{border:2px solid #4cc96b;background:rgba(255,255,255,.95);animation:slotPop .32s ease;}
  .treasureSlot img{width:80%;height:80%;object-fit:contain;}
  .treasureRefImg{width:40px;height:40px;object-fit:contain;filter:drop-shadow(0 1px 2px rgba(0,0,0,.35));}
  @keyframes slotPop{0%{transform:scale(.4)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
  /* Make a Song with the Owl — tappable floating notes over the owl scene */
  .owlScene{position:relative;width:min(94vw,560px);aspect-ratio:2821/1751;border-radius:20px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.25);background-size:cover;background-position:center;touch-action:manipulation;}
  .owlNote{position:absolute;transform:translate(-50%,-50%);width:14%;border:none;background:transparent;padding:0;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;z-index:5;}
  .owlNoteImg{width:100%;display:block;-webkit-user-select:none;user-select:none;-webkit-user-drag:none;filter:drop-shadow(0 3px 6px rgba(0,0,0,.5));animation:owlBob 3s ease-in-out infinite;}
  .owlNoteImg.pop{animation:owlPop .45s ease;}
  @keyframes owlBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
  @keyframes owlPop{0%{transform:scale(1)}35%{transform:scale(1.38)}100%{transform:scale(1)}}
  .owlSpark{position:absolute;transform:translate(-50%,-50%);font-size:22px;pointer-events:none;animation:owlSparkUp .7s ease-out forwards;z-index:6;}
  @keyframes owlSparkUp{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}30%{opacity:1}100%{opacity:0;transform:translate(-50%,-170%) scale(1.1)}}
  .owlBtns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:10px;}
  .owlInstruments{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:0 0 10px;}
  .owlInsBtn{border:2px solid var(--violet);background:#fff;color:var(--violet-deep);border-radius:999px;padding:6px 14px;font-family:inherit;font-weight:bold;font-size:clamp(12px,3.2vw,15px);cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.12);}
  .owlInsBtn.active{background:var(--violet);color:#fff;box-shadow:0 3px 0 var(--violet-deep);}
  .tuckCharPj.plain{left:16%;height:44%;}
  .flowerSpot img{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:100%;object-fit:contain;object-position:bottom;}
  .flowerSpot .flowerClosed{transition:transform .15s;}
  .flowerSpot.bounce .flowerClosed{animation:flowerBounce .26s ease;}
  .flowerOpenWrap{position:absolute;inset:0;opacity:0;transform:scale(.7);transition:opacity .25s,transform .25s;pointer-events:none;}
  .flowerOpenWrap.show{opacity:1;transform:scale(1);}
  .laineyInFlower{width:62% !important;bottom:14% !important;filter:drop-shadow(0 3px 4px rgba(0,0,0,.2));}
  @keyframes flowerBounce{0%{transform:translateX(-50%) translateY(0)}40%{transform:translateX(-50%) translateY(-10px) rotate(-4deg)}100%{transform:translateX(-50%) translateY(0)}}

  /* ===== opening video splash ===== */
  #splash{padding:0;background:#000;}
  #splashVideo{position:fixed;inset:0;width:100vw;height:100vh;object-fit:contain;background:#000;}
  #startOverlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
    background:linear-gradient(180deg,rgba(0,0,0,0) 55%,rgba(0,0,0,.5) 100%);z-index:10;cursor:pointer;padding-bottom:44px;}
  #startOverlay .subtitle{color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.6);}
  .play-circle{width:88px;height:88px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;
    box-shadow:0 8px 0 rgba(0,0,0,.18);margin-top:6px;animation:pulse 1.6s ease-in-out infinite;}
  .play-circle .tri{width:0;height:0;border-style:solid;border-width:22px 0 22px 36px;border-color:transparent transparent transparent var(--violet);margin-left:8px;}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
  #skipBtn{position:absolute;bottom:18px;right:18px;z-index:11;background:rgba(0,0,0,.55);color:#fff;border:none;
    border-radius:999px;padding:10px 20px;font-family:inherit;font-size:16px;font-weight:bold;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.3);}
  #skipBtn:active{transform:translateY(3px);}
  #welcomeVideo{position:fixed;inset:0;width:100vw;height:100vh;object-fit:contain;background:#000;z-index:13;display:none;}
  #welcomeSkipBtn{position:absolute;bottom:18px;right:18px;z-index:14;background:rgba(0,0,0,.55);color:#fff;border:none;
    border-radius:999px;padding:10px 20px;font-family:inherit;font-size:16px;font-weight:bold;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.3);display:none;}
  #welcomeSkipBtn:active{transform:translateY(3px);}
  #nameOverlay{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
    background:rgba(30,15,50,.55);z-index:12;padding:20px;text-align:center;}
  #nameOverlay h1{color:#fff;text-shadow:2px 2px 0 rgba(0,0,0,.35);}
  #nameInput{font-family:inherit;font-size:clamp(17px,4.6vw,22px);padding:12px 18px;border-radius:999px;border:3px solid var(--violet);
    text-align:center;width:min(72vw,300px);box-shadow:0 4px 0 rgba(0,0,0,.15);margin:10px 0 14px;}
  #nameInput:focus{outline:none;border-color:var(--daisy);}
  /* "Just the Story" vs "Story + Games" chooser */
  #modeOverlay,#resumeOverlay{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
    background:rgba(30,15,50,.62);z-index:12;padding:20px;text-align:center;}
  #modeOverlay h1,#resumeOverlay h1{color:#fff;text-shadow:2px 2px 0 rgba(0,0,0,.35);font-size:clamp(20px,5.4vw,30px);margin-bottom:6px;}
  .resumeWhere{color:#ffd86b;font-weight:bold;font-size:clamp(13px,3.4vw,17px);margin-bottom:4px;}
  .modePicks{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;margin-top:10px;}
  .modePick{display:flex;flex-direction:column;align-items:center;gap:3px;background:#fff;border:4px solid transparent;border-radius:22px;
    padding:16px 18px;width:min(42vw,190px);cursor:pointer;font-family:inherit;box-shadow:0 5px 0 rgba(0,0,0,.18);-webkit-tap-highlight-color:transparent;}
  .modePick:active{transform:translateY(3px);}
  .modePick.last{border-color:var(--daisy);}
  .modeIcon{font-size:clamp(30px,8vw,42px);line-height:1;}
  .modeName{font-weight:bold;color:var(--violet-deep);font-size:clamp(14px,3.6vw,18px);}
  .modeSub{color:#6b5b8a;font-size:clamp(10px,2.6vw,12px);line-height:1.25;}
  .modeHint{color:#fff;opacity:.85;font-size:clamp(11px,2.9vw,13px);margin-top:14px;}
  .topRight{display:flex;gap:8px;align-items:center;flex:none;}
  .mode-btn{background:#fff;color:var(--violet-deep);border:none;border-radius:50%;width:46px;height:46px;font-size:20px;box-shadow:0 3px 0 rgba(0,0,0,.15);cursor:pointer;flex:none;}
  .mode-btn:active{transform:translateY(3px);}
  /* "starring <name>" under The End */
  .endStarring{margin-top:4px;font-weight:bold;color:var(--violet-deep);font-size:clamp(14px,3.8vw,19px);}
  #skipNameBtn{margin-top:10px;opacity:.85;}
  .replay-btn{background:#fff;color:var(--violet-deep);border:none;border-radius:999px;padding:8px 18px;
    font-family:inherit;font-size:14px;font-weight:bold;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.12);margin-top:4px;}
  .replay-btn:active{transform:translateY(3px);}

  /* ===== iPad / tablet only (>=700px wide) =====
     The phone never reads this block, so nothing here can change the iPhone
     layout. It simply lets the stages grow to use the bigger screen. */
  @media (min-width: 700px){
    .bookPageArt{max-width:78vw;}
    .bookPageText{font-size:clamp(19px,2.5vw,26px);}
    .ask{font-size:clamp(20px,2.6vw,28px);}

    .kiteStage{width:min(74vw,620px);}
    .mazeStage{height:min(76vh,860px);}
    .appleStage{width:min(80vw,820px);height:min(52vh,560px);}
    .fountainStage{width:min(74vw,620px);height:min(34vh,380px);}
    .rockStage{width:min(76vw,680px);height:min(30vh,330px);}
    .duskStage{width:min(74vw,620px);height:min(38vh,420px);}
    .seesawStage{width:min(74vw,620px);height:min(36vh,400px);}
    .tuckStage{width:min(74vw,620px);height:min(38vh,420px);}
    .awakeStage{width:min(74vw,620px);}
    .skyBox{width:min(74vw,620px);height:min(46vw,420px);}
    .pondStage{width:min(72vw,600px);}
    .treasureScene{width:min(76vw,680px);}
    .fdStage{width:min(84vw,760px);}
    .kmSky{width:min(78vw,720px);height:min(52vh,560px);}
    .wakeStage{width:min(62vw,560px);}
    .ccBoard{width:min(74vw,720px);}
    .paintStudio{height:min(72vh,860px);}
    .treasureRefGrid{width:min(76vw,680px);}
    .treasureSlot{width:52px;height:52px;}
    .treasureRefImg{width:54px;height:54px;}
    .basket{width:170px;}
    .method{font-size:clamp(30px,4vw,44px);}
    .modePick{width:min(30vw,230px);}
  }
</style>
</head>
<body>
<div id="app">

  <!-- ================= OPENING VIDEO ================= -->
  <section class="screen active" id="splash">
    <video id="splashVideo" playsinline preload="auto" poster="openingscene-poster.jpg?v=2" src="openingscene.mp4?v=2"></video>
    <button id="skipBtn" style="display:none" onclick="endSplash()">Skip ⏭️</button>
    <div id="startOverlay" onclick="startSplash()">
      <p class="subtitle">Tap to begin! 💜🐞</p>
      <div class="play-circle"><div class="tri"></div></div>
    </div>
    <div id="nameOverlay">
      <h1>What's Your Name?</h1>
      <input id="nameInput" type="text" placeholder="Type your name..." maxlength="20" onkeydown="if(event.key==='Enter') confirmNameAndStart()">
      <button class="arrowBtn" onclick="confirmNameAndStart()">Let's Go! ➡️</button>
      <button class="replay-btn" id="skipNameBtn" onclick="skipName()">Skip for now</button>
    </div>
    <div id="resumeOverlay">
      <h1 id="resumeTitle">Welcome back!</h1>
      <p class="resumeWhere" id="resumeWhere"></p>
      <div class="modePicks">
        <button class="modePick last" onclick="resumeAdventure()">
          <span class="modeIcon">▶️</span>
          <span class="modeName">Keep Going</span>
          <span class="modeSub">pick up where you stopped</span>
        </button>
        <button class="modePick" onclick="restartAdventure()">

<script>
/* ============================================================

const PAGES = {
