  }
}

/* ===== Game 4: Where's Lainey Hiding? (flower shell game) =====
   Player picks one flower color, then all 5 shells use that same
   color (so they can't just remember "she's under the blue one") —
   after the peek, the flowers actually swap positions a few times, so
   finding her means tracking movement, not color. */
const HS_COLORS = [
  {key:'blue',   closed:'art/blueclosedflower.png',   open:'art/blueopenflower.png'},
  {key:'yellow', closed:'art/yellowclosedflower.png', open:'art/yellowopenflower.png'},
  {key:'orange', closed:'art/orangeclosedflower.png', open:'art/orangeopenflower.png'},
  {key:'purple', closed:'art/purpleclosedflower.png', open:'art/purpleopenflower.png'},
  {key:'pink',   closed:'art/pinkclosedflower.png',   open:'art/pinkopenflower.png'},
];
const HS_SLOT_COUNT = 5;
const HS_SLOT_X = [8, 27, 50, 73, 92];
let hsFlowerColor=null, hsPos=[], hsHiddenFlowerId=-1, hsFound=false;
function renderHideSeekGame(stage){
  stage.innerHTML = `
    <p class="ask" id="hsAsk">Pick a flower color to play with!</p>
    <div class="colorPicker" id="hsColorPicker"></div>
  `;
  document.getElementById('hsColorPicker').innerHTML = HS_COLORS.map(c=>
    `<button class="colorPickBtn" onclick="chooseHsColor('${c.key}')"><img src="${c.closed}" alt=""></button>`).join('');
  say("Pick a flower color to play with!");
}
function chooseHsColor(key){
  hsFlowerColor = HS_COLORS.find(c=>c.key===key);
  renderHsBoard();
}
function renderHsBoard(){
  hsFound=false;
  const stage = document.getElementById('stageArea');
  stage.innerHTML = `
    <p class="ask" id="hsAsk">Watch closely — where does Lainey hide?</p>
    <div class="garden" id="garden"></div>
    <button class="btn btn-daisy" id="hsShuffleBtn" onclick="hsButtonClick()" style="visibility:hidden">🔀 Move the Flowers</button>
    <div class="feedback" id="hsFeedback"></div>
  `;
  hsPos = [0,1,2,3,4];
  document.getElementById('garden').innerHTML = hsPos.map((slot,k)=>`
    <button class="flowerSpot" id="flower${k}" style="left:${HS_SLOT_X[slot]}%" onclick="pickFlower(${k})" disabled>
      <img class="flowerClosed" id="flowerClosed${k}" src="${hsFlowerColor.closed}" alt="">
      <div class="flowerOpenWrap" id="flowerOpenWrap${k}"></div>
    </button>`).join('');
  startPeek();
}
function startPeek(){
  hsHiddenFlowerId = Math.floor(Math.random()*HS_SLOT_COUNT);
  document.getElementById('hsAsk').textContent = 'Watch closely — where does Lainey hide?';
  document.getElementById('hsFeedback').textContent = '';
  document.getElementById('hsShuffleBtn').style.visibility='hidden';
  say("Watch closely!");
  setTimeout(()=>{
    openFlowerSlot(hsHiddenFlowerId, 'art/laineyfront.png');
    say("There she is!");
    setTimeout(()=>{
      closeFlowerSlot(hsHiddenFlowerId);
      document.getElementById('hsAsk').textContent = "Let's move them around!";
      const btn = document.getElementById('hsShuffleBtn');
      btn.style.visibility='visible';
      btn.disabled=false;
      btn.textContent='🔀 Move the Flowers';
    }, 1800);
  }, 700);
}
function hsButtonClick(){
  if(hsFound){ renderHideSeekGame(document.getElementById('stageArea')); }
  else { shuffleFlowers(); }
}
function shuffleFlowers(){
  const btn = document.getElementById('hsShuffleBtn');
  btn.disabled = true;
  document.getElementById('hsFeedback').textContent='';
  say("Watch them move!");
  let swapsLeft = 3;
  const doSwap = ()=>{
    const a = Math.floor(Math.random()*HS_SLOT_COUNT);
    let b = Math.floor(Math.random()*HS_SLOT_COUNT);
    while(b===a) b = Math.floor(Math.random()*HS_SLOT_COUNT);
    const tmp = hsPos[a]; hsPos[a]=hsPos[b]; hsPos[b]=tmp;
    document.getElementById('flower'+a).style.left = HS_SLOT_X[hsPos[a]]+'%';
    document.getElementById('flower'+b).style.left = HS_SLOT_X[hsPos[b]]+'%';
    swapsLeft--;
    if(swapsLeft>0){ setTimeout(doSwap, 750); }
    else {
      setTimeout(()=>{
        btn.style.visibility='hidden';
        for(let k=0;k<HS_SLOT_COUNT;k++) document.getElementById('flower'+k).disabled=false;
        document.getElementById('hsAsk').textContent = 'Where is she hiding?';
        document.getElementById('hsFeedback').textContent='Tap a flower!';
        say("Where is she hiding?");
      }, 700);
    }
  };
  doSwap();
}
function pickFlower(k){
  if(hsFound) return;
  const fb = document.getElementById('hsFeedback');
  if(k===hsHiddenFlowerId){
    hsFound=true;
    for(let j=0;j<HS_SLOT_COUNT;j++) document.getElementById('flower'+j).disabled=true;
    openFlowerSlot(k, 'art/laineyflowerreveal.png');
    fb.innerHTML='<span class="star">⭐ You found Lainey! ⭐</span>';
    say("You found me! Great job!");
    hsCelebrate();
    const btn = document.getElementById('hsShuffleBtn');
    btn.style.visibility='visible';
    btn.disabled=false;
    btn.textContent='🔀 Play Again';
  } else {
    document.getElementById('flower'+k).disabled=true;
    openFlowerSlot(k, null);
    fb.textContent='Not there — try another flower!';
    playAudio('tryagain', "Not there, try again!");
    setTimeout(()=>{
      closeFlowerSlot(k);
      document.getElementById('flower'+k).disabled=false;
    }, 900);
  }
}
function openFlowerSlot(k, laineySrc){
  document.getElementById('flowerClosed'+k).style.visibility='hidden';
  const wrap = document.getElementById('flowerOpenWrap'+k);
  wrap.innerHTML = `<img class="flowerOpenImg" src="${hsFlowerColor.open}" alt="">` +
    (laineySrc ? `<img class="laineyInFlower" src="${laineySrc}" alt="">` : '');
  wrap.classList.add('show');
}
function closeFlowerSlot(k){
  document.getElementById('flowerClosed'+k).style.visibility='';
  const wrap = document.getElementById('flowerOpenWrap'+k);
  wrap.classList.remove('show');
  wrap.innerHTML='';
}
function hsCelebrate(){
  const stageEl = document.getElementById('garden');
  for(let c=0;c<14;c++){
    const conf=document.createElement('div');
    conf.className='confetti';
    conf.textContent=['🎉','✨','🎊'][c%3];
    conf.style.left=(5+Math.random()*90)+'%';
    conf.style.top=(-6+Math.random()*20)+'%';
    conf.style.animationDelay=(Math.random()*.3)+'s';
    stageEl.appendChild(conf);
    setTimeout(()=>conf.remove(),1500);
  }
}

/* ===== Game 5: Firefly Pattern (Simon Says) =====
   A few fireflies glow one at a time in a short sequence, then the
   kid taps them back in the same order — plays into the "fireflies
   twinkling" beat of that page of the story. */
const FF_COUNT = 4;
const FF_SLOT_X = [15, 38, 62, 85];
const FF_ROUNDS = 3;      // three chances
const FF_BASE_LEN = 3;    // round 1 = 3 lights, round 2 = 4, round 3 = 5
const FF_IMAGES = ['art/firefly1.png','art/firefly2.png','art/firefly3.png','art/firefly4.png'];
let ffPattern=[], ffPlayerIndex=0, ffBusy=false, ffRound=0;
function renderFireflyGame(stage){
  stage.innerHTML = `
    <p class="ask" id="ffAsk">Watch which fireflies light up!</p>
    <div class="ffProgress" id="ffProgress"></div>
    <div class="fireflyStage" id="fireflyStage"></div>
    <button class="btn btn-violet" id="ffPlayAgainBtn" onclick="renderFireflyGame(document.getElementById('stageArea'))" style="visibility:hidden">✨ Play Again</button>
    <div class="feedback" id="ffFeedback"></div>
  `;
  document.getElementById('fireflyStage').innerHTML = FF_SLOT_X.map((x,i)=>
    `<button class="firefly" id="firefly${i}" style="left:${x}%" onclick="ffTap(${i})" disabled><img src="${FF_IMAGES[i]}" alt=""></button>`).join('');
  ffRound = 0;
  ffUpdateProgress();
  newFireflyRound();
}
function ffUpdateProgress(){
  const el=document.getElementById('ffProgress'); if(!el) return;
  let h=''; for(let r=0;r<FF_ROUNDS;r++) h += '<span class="ffDot'+(r<ffRound?' done':'')+'"></span>';
  el.innerHTML = h;
}
function newFireflyRound(){
  document.getElementById('ffPlayAgainBtn').style.visibility='hidden';
  ffPattern = [];
  const len = [3,4,3][ffRound] || 3;   // 3, then 4, then back to 3 (5 is too many to remember)
  for(let i=0;i<len;i++) ffPattern.push(Math.floor(Math.random()*FF_COUNT));
  ffPlayerIndex = 0;
  document.getElementById('ffAsk').textContent = 'Watch which fireflies light up!';
  document.getElementById('ffFeedback').textContent = '';
  ffUpdateProgress();
  for(let i=0;i<FF_COUNT;i++) document.getElementById('firefly'+i).disabled=true;
  if(ffRound===0){
    // round 1: directions, then "get ready", then the pattern 1s later
    playAudio('watchfireflys', "Watch which fireflies light up!",
      (ms)=>{ const g=audioGeneration; setTimeout(()=>{ if(g===audioGeneration) ffGetReady(); }, ms+150); }, ()=>{});
  } else {
    ffGetReady();   // later rounds: just "get ready" then the pattern
  }
}
function ffGetReady(){
  playAudio('getready', "Get ready!", null, ()=>{});
  setTimeout(playFfPattern, 1000);
}
function playFfPattern(){
  ffBusy = true;
  let i=0;
  // each firefly flashes ON, then clearly OFF with a dark gap before the
  // next — so even when the same firefly repeats in the pattern it reads
  // as two separate blinks instead of one continuous glow (otherwise the
  // player taps it once and gets marked wrong for a repeat they couldn't see)
  const ON_MS=560, GAP_MS=320;
  const lightNext = ()=>{
    if(i>=ffPattern.length){
      ffBusy=false;
      for(let k=0;k<FF_COUNT;k++) document.getElementById('firefly'+k).disabled=false;
      document.getElementById('ffAsk').textContent = 'Now you try! Tap them in the same order.';
      document.getElementById('ffFeedback').textContent = 'Your turn!';
      // (the "get ready" cue already played before the pattern)
      return;
    }
    const idx = ffPattern[i];
    ffLight(idx, true);
    setTimeout(()=>{
      ffLight(idx, false);
      i++;
      setTimeout(lightNext, GAP_MS);
    }, ON_MS);
  };
  lightNext();
}
function ffLight(i, on){
  document.getElementById('firefly'+i).classList.toggle('lit', on);
}
function ffTap(i){
  if(ffBusy) return;
  ffLight(i,true);
  setTimeout(()=>ffLight(i,false), 300);
  if(i===ffPattern[ffPlayerIndex]){
    ffPlayerIndex++;
    if(ffPlayerIndex===ffPattern.length){
      ffBusy=true;
      for(let k=0;k<FF_COUNT;k++) document.getElementById('firefly'+k).disabled=true;
      ffRound++;                 // this chance is complete
      ffUpdateProgress();        // fill its circle
      if(ffRound >= FF_ROUNDS){
        document.getElementById('ffAsk').textContent = 'You did all three! 🎉';
        document.getElementById('ffFeedback').innerHTML = '<span class="star">⭐ You matched every pattern! ⭐</span>';
        ffCelebrate();           // reward after all 3 chances
        document.getElementById('ffPlayAgainBtn').style.visibility='visible';
      } else {
        document.getElementById('ffFeedback').innerHTML = '<span class="star">⭐ Great job! Here comes another one… ⭐</span>';
        // wait for the whole "great job, here comes another one" line to
        // finish before starting the next round (starting it early would
        // stopAudio() and cut the clip off after "great job")
        playAudio('greatjobherecomesanotherone', "Great job! Here comes another one!",
          (ms)=>{ const g=audioGeneration; setTimeout(()=>{ if(g===audioGeneration) newFireflyRound(); }, ms+300); },
          ()=>{});
      }
    }
  } else {
    ffBusy = true;
    for(let k=0;k<FF_COUNT;k++) document.getElementById('firefly'+k).disabled=true;
    document.getElementById('ffFeedback').textContent = 'Not quite — watch again!';
    ffPlayerIndex = 0;
    // don't re-light the fireflies until the whole "not quite" line is done
    playAudio('notquite', "Not quite, watch again!",
      (ms)=>{ const g=audioGeneration; setTimeout(()=>{ if(g===audioGeneration) playFfPattern(); }, ms+300); },
      ()=>{});
  }
}
function ffCelebrate(){
  playFfReward(ffConfetti);
}
/* firefly reward video over the stage, then confetti. Triggered by the tap
   that completes the pattern, so it plays with sound. */
function playFfReward(fallbackFn){
  const stageEl = document.getElementById('fireflyStage');
  if(!stageEl){ fallbackFn(); return; }
  const vid = document.createElement('video');
  vid.src = 'art/fireflyreward.mp4?v='+Date.now();
  vid.playsInline = true; vid.autoplay = false;
  vid.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:8;border-radius:22px;';
  let handled=false;
  const cleanup = ()=>{ if(vid.parentNode) vid.remove(); };
  const fail = ()=>{ if(!handled){ handled=true; cleanup(); fallbackFn(); } };
  vid.addEventListener('error', fail);
  vid.addEventListener('ended', ()=>{ cleanup(); fallbackFn(); });
  stageEl.appendChild(vid);
  vid.muted = false;
  const p = vid.play();
  if(p && p.catch){ p.catch(()=>{ vid.muted = true; const p2 = vid.play(); if(p2 && p2.catch){ p2.catch(fail); } }); }
}
function ffConfetti(){
  const stageEl = document.getElementById('fireflyStage');
  if(!stageEl) return;
  for(let c=0;c<14;c++){
    const conf=document.createElement('div');
    conf.className='confetti';
    conf.textContent=['✨','🌟','⭐'][c%3];
    conf.style.left=(5+Math.random()*90)+'%';
    conf.style.top=(10+Math.random()*30)+'%';
    conf.style.animationDelay=(Math.random()*.3)+'s';
    stageEl.appendChild(conf);
    setTimeout(()=>conf.remove(),1500);
  }
}

/* ===== Game: Tic-Tac-Toe (Morning Arrives) =====
   The child picks who they want to be (Violet or Lainey), spins a wheel
   to see who goes first, then plays against the other character. The
   child always holds the X, the computer holds the O — the four X/O
   character images were split out of art/xoxo.png. */
const TTT_LINES=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
// cell interior rectangles (in % of the board image) measured from the
// wooden grid in art/tictactoebackground.png (1672x941)
const TTT_COLS=[[27.8,40.7],[43.0,56.1],[58.4,71.7]];   // [left%, right%]
const TTT_ROWS=[[16.6,37.5],[41.3,62.5],[66.3,84.3]];   // [top%, bottom%]
const TTT_MARK={   // [character][mark] -> image
  violet:{X:'art/violetX.png', O:'art/violetO.png'},
  lainey:{X:'art/laineyX.png', O:'art/laineyO.png'}
};
const TTT_NAME={violet:'Violet', lainey:'Lainey'};
let tttPlayerChar=null, tttPlayerLetter=null, tttAiChar=null, tttMark={}, tttBoard=[], tttTurn=null, tttBusy=false, tttGen=0;
function renderTttGame(stage){
  tttGen++;
  tttBusy=false;   // a loss/tie leaves tttBusy=true; reset so Play Again lets the wheel spin
  stage.innerHTML = `
    <p class="ask" id="tttAsk">Choose Violet or Lainey — and X or O!</p>
    <div id="tttArea"></div>
    <div class="feedback" id="tttFeedback"></div>
    <button class="btn btn-violet" id="tttAgain" style="visibility:hidden" onclick="renderTttGame(document.getElementById('stageArea'))">🔄 Play Again</button>
  `;
  // one screen: all four choices — both Violets and both Laineys, X and O
  document.getElementById('tttArea').innerHTML = `
    <div class="tttChoose tttChoose4">
      <button class="tttPick violet" onclick="tttChoose('violet','X')"><img src="art/violetX.png" alt="Violet with X"><span>Violet · X</span></button>
      <button class="tttPick violet" onclick="tttChoose('violet','O')"><img src="art/violetO.png" alt="Violet with O"><span>Violet · O</span></button>
      <button class="tttPick lainey" onclick="tttChoose('lainey','X')"><img src="art/laineyX.png" alt="Lainey with X"><span>Lainey · X</span></button>
      <button class="tttPick lainey" onclick="tttChoose('lainey','O')"><img src="art/laineyO.png" alt="Lainey with O"><span>Lainey · O</span></button>
    </div>`;
  playAudio('tictactoe', "Let's play Tic-Tac-Toe! Choose Violet or Lainey, and choose X or O.", null, ()=>{});
}
function tttChoose(ch, letter){
  tttPlayerChar = ch;
  tttPlayerLetter = letter;
  tttAiChar = ch==='violet' ? 'lainey' : 'violet';
  const other = letter==='X' ? 'O' : 'X';
  // child holds the character + letter they picked, the computer holds the rest
  tttMark[tttPlayerChar] = TTT_MARK[tttPlayerChar][letter];
  tttMark[tttAiChar]     = TTT_MARK[tttAiChar][other];
  tttRenderSpin();
}
function tttRenderSpin(){
  document.getElementById('tttAsk').textContent = 'Spin to see who goes first!';
  // 8 pie slices, alternating Violet / Lainey. Each slice is 45° wide; a
  // token sits at the centre of its slice (radius 33% from the middle).
  let tokens='';
  for(let s=0;s<8;s++){
    const ch = (s%2===0) ? 'violet' : 'lainey';   // even slices Violet, odd Lainey
    const centerDeg = s*45 + 22.5;                 // slice centre, clockwise from top
    const rad = centerDeg*Math.PI/180;
    const x = 50 + 33*Math.sin(rad);
    const y = 50 - 33*Math.cos(rad);
    tokens += `<img class="tttWheelImg" src="${tttMark[ch]}" alt="" style="left:${x.toFixed(1)}%;top:${y.toFixed(1)}%">`;
  }
  document.getElementById('tttArea').innerHTML = `
    <div class="tttWheelWrap">
      <div class="tttWheelCircle">
        <div class="tttPointer"></div>
        <div class="tttWheel" id="tttWheel">
          ${tokens}
          <div class="tttHub"></div>
        </div>
      </div>
      <button class="btn btn-daisy tttSpinBtn" id="tttSpinBtn" onclick="tttSpin()">🎡 Spin!</button>
    </div>`;
  playAudio('spinthewheel', "Spin the wheel to see who goes first!", null, ()=>{});
}
function tttSpin(){
  if(tttBusy) return; tttBusy=true;
  const myGen=tttGen;
  document.getElementById('tttSpinBtn').disabled=true;
  const winner = Math.random()<0.5 ? 'violet' : 'lainey';
  // pick one of the winner's four slice centres and land the pointer on it.
  // Violet = even slices (centres 22.5,112.5,202.5,292.5), Lainey = odd.
  const centres = winner==='violet' ? [22.5,112.5,202.5,292.5] : [67.5,157.5,247.5,337.5];
  const centre = centres[Math.floor(Math.random()*centres.length)];
  // slice centre is under the top pointer when rot%360 = 360 - centre
  const rot = 1440 + (360 - centre) + (Math.random()*24-12);   // jitter stays inside the 45° slice
  const wheel=document.getElementById('tttWheel');
  wheel.style.transition='transform 2.6s cubic-bezier(.17,.67,.24,1)';
  requestAnimationFrame(()=>{ wheel.style.transform='rotate('+rot+'deg)'; });
  setTimeout(()=>{ if(myGen===tttGen) tttStartPlay(winner); }, 2750);
}
function tttStartPlay(winner){
  tttBoard = Array(9).fill(null);
  tttTurn = (winner===tttPlayerChar) ? 'P' : 'A';
  tttBusy=false;
  const first = TTT_NAME[winner];
  document.getElementById('tttArea').innerHTML = `
    <div class="tttBoard" id="tttBoard">
      <img class="tttBg" src="art/tictactoebackground.png" alt="">
      ${[0,1,2,3,4,5,6,7,8].map(i=>{
        const r=Math.floor(i/3), c=i%3;
        const left=TTT_COLS[c][0], top=TTT_ROWS[r][0];
        const w=TTT_COLS[c][1]-TTT_COLS[c][0], h=TTT_ROWS[r][1]-TTT_ROWS[r][0];
        return `<button class="tttCell" id="tttCell${i}" style="left:${left}%;top:${top}%;width:${w}%;height:${h}%" onclick="tttPlay(${i})"></button>`;
      }).join('')}
    </div>`;
  document.getElementById('tttFeedback').textContent='';
  const goesFirstId = winner+'goesfirst';   // violetgoesfirst / laineygoesfirst
  const myGen=tttGen;
  if(tttTurn==='P'){
    document.getElementById('tttAsk').textContent = first+' goes first — your turn! Get three in a row.';
    // "___ goes first!" then "it's your turn!"
    playAudio(goesFirstId, first+" goes first!",
      (ms)=>{ const g=audioGeneration; setTimeout(()=>{ if(g===audioGeneration && tttGen===myGen) playAudio('itsyourturn',"It's your turn!",null,()=>{}); }, ms+250); },
      ()=>{});
  } else {
    document.getElementById('tttAsk').textContent = first+' goes first!';
    tttBusy=true;
    // "___ goes first!" then the computer takes its move once the line finishes
    playAudio(goesFirstId, first+" goes first!",
      (ms)=>{ const g=audioGeneration; setTimeout(()=>{ if(g===audioGeneration && tttGen===myGen) tttAiMove(); }, ms+300); },
      ()=>{});
  }
}
function tttPlace(i, who){
  tttBoard[i]=who;
  const mark = who==='P' ? tttMark[tttPlayerChar] : tttMark[tttAiChar];
  const cell=document.getElementById('tttCell'+i);
  cell.disabled=true;
  cell.innerHTML = `<img src="${mark}" alt="">`;
}
function tttPlay(i){
  if(tttBusy || tttTurn!=='P' || tttBoard[i]) return;
  tttPlace(i,'P');
  const line=tttWinLine('P');
  if(line){ tttFinish('P',line); return; }
  if(tttBoard.every(v=>v)){ tttFinish('draw'); return; }
  tttTurn='A'; tttBusy=true;
  document.getElementById('tttAsk').textContent = TTT_NAME[tttAiChar]+' is thinking…';
  const myGen=tttGen;
  setTimeout(()=>{ if(myGen===tttGen) tttAiMove(); }, 800);
}
function tttAiMove(){
  const move = tttPickAiMove();
  if(move==null){ tttFinish('draw'); return; }
  tttPlace(move,'A');
  const line=tttWinLine('A');
  if(line){ tttFinish('A',line); return; }
  if(tttBoard.every(v=>v)){ tttFinish('draw'); return; }
  tttTurn='P'; tttBusy=false;
  document.getElementById('tttAsk').textContent = 'Your turn! Get three in a row.';
  playAudio('itsyourturn', "It's your turn!", null, ()=>{});
}
function tttPickAiMove(){
  const empty=[]; for(let i=0;i<9;i++) if(!tttBoard[i]) empty.push(i);
  if(!empty.length) return null;
  // take its own winning move if there is one
  for(const i of empty){ tttBoard[i]='A'; const w=tttWinLine('A'); tttBoard[i]=null; if(w) return i; }
  // sometimes block the child (kept low so a toddler can still win)
  if(Math.random()<0.45){
    for(const i of empty){ tttBoard[i]='P'; const w=tttWinLine('P'); tttBoard[i]=null; if(w) return i; }
  }
  if(tttBoard[4]===null && Math.random()<0.55) return 4;
  return empty[Math.floor(Math.random()*empty.length)];
}
function tttWinLine(who){
  for(const ln of TTT_LINES){ if(ln.every(i=>tttBoard[i]===who)) return ln; }
  return null;
}
function tttFinish(result, line){
  tttBusy=true;
  for(let i=0;i<9;i++){ const c=document.getElementById('tttCell'+i); if(c) c.disabled=true; }
  const fb=document.getElementById('tttFeedback');
  if(result==='P'){
    if(line) line.forEach(i=>{ const img=document.querySelector('#tttCell'+i+' img'); if(img) img.classList.add('win'); });
    document.getElementById('tttAsk').textContent = 'You got three in a row! 🎉';
    fb.innerHTML = '<span class="star">⭐ You win! ⭐</span>';
    // play the reward video for the character + letter the child played;
    // falls back to confetti if that clip isn't available
    playTttReward(()=>{
      tttConfetti();
      say("Hooray! You got three in a row! You win!");
      document.getElementById('tttAgain').style.visibility='visible';
    });
  } else if(result==='A'){
    if(line) line.forEach(i=>{ const img=document.querySelector('#tttCell'+i+' img'); if(img) img.classList.add('win'); });
    document.getElementById('tttAsk').textContent = TTT_NAME[tttAiChar]+' got three in a row!';
    fb.textContent = 'Good try — play again?';
    playAudio('tryagain', "Good try! Let's play again.", null, ()=>{});
    document.getElementById('tttAgain').style.visibility='visible';
  } else {
    document.getElementById('tttAsk').textContent = "It's a tie!";
    fb.textContent = 'So close — play again?';
    playAudio('tryagain', "So close! Let's play again.", null, ()=>{});
    document.getElementById('tttAgain').style.visibility='visible';
  }
}
/* win reward video over the board — art/<char><letter>reward.mp4, e.g.
   violetXreward.mp4. Triggered by the winning tap so it plays with sound. */
function playTttReward(fallbackFn){
  const board=document.getElementById('tttBoard');
  if(!board){ fallbackFn(); return; }
  const vid=document.createElement('video');
  vid.src='art/'+tttPlayerChar+tttPlayerLetter+'reward.mp4?v='+Date.now();
  vid.playsInline=true; vid.autoplay=false;
  vid.style.cssText='position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:8;border-radius:14px;';
  let handled=false;
  const cleanup=()=>{ if(vid.parentNode) vid.remove(); };
  const fail=()=>{ if(!handled){ handled=true; cleanup(); fallbackFn(); } };
  vid.addEventListener('error', fail);
  vid.addEventListener('ended', ()=>{ if(!handled){ handled=true; cleanup(); document.getElementById('tttAgain').style.visibility='visible'; } });
  board.appendChild(vid);
  vid.muted=false;

function hcTap(h){

/* ===== Game 6: Lainey's Rock Nap (shell game to cricket music) =====
   Lainey is sleepy and hides behind one of three rocks. While the
   crickets play their music the rocks shuffle around; when the music
   stops, the player picks the rock they think she's napping behind. */
const RN_SLOT_X = [20, 50, 80];
const RN_SWAPS = 6;
const RN_SWAP_GAP = 620;
let rnPos=[], rnHiddenRock=-1, rnFound=false, rnGen=0, rnMusicEl=null, rnChirpTimer=null, rnAudioCtx=null;
function rnChirp(){
  // synthesized cricket chirp: two quick high pips — used as the shuffle
  // "music" fallback if audio/shellgamesong.mp3 can't be played
  try{
    if(!rnAudioCtx) rnAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(rnAudioCtx.state==='suspended') rnAudioCtx.resume();
    [0, 0.12].forEach(off=>{
      const osc = rnAudioCtx.createOscillator();
      const gain = rnAudioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.value = 1650;
      const t = rnAudioCtx.currentTime + off;
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.exponentialRampToValueAtTime(0.18, t+0.015);
      gain.gain.exponentialRampToValueAtTime(0.0001, t+0.09);
      osc.connect(gain); gain.connect(rnAudioCtx.destination);
      osc.start(t); osc.stop(t+0.1);
    });
  }catch(e){}
}
/* Create the shuffle-music element NOW — while we're still inside the tap
   that opened the game — and prime it with a silent play/pause. iOS only
   lets an audio element play from a timer later if its first play() happened
   during a user gesture, so this priming is what makes the music audible when
   the shuffle (a setTimeout) starts it. Called from renderRockNapGame. */
function rnPrepareMusic(){
  rnMusicEl = new Audio('audio/shellgamesong.mp3?v='+Date.now());
  rnMusicEl.loop = true;
  rnMusicEl.addEventListener('error', ()=>{ rnMusicEl = null; }, {once:true});
  // silent unlock only: muted AND volume 0, then paused straight back to the
  // start. It stays completely silent through the instructions — nothing is
  // heard until rnStartMusic unmutes it when the rocks begin moving.
  rnMusicEl.muted = true;
  rnMusicEl.volume = 0;
  const p = rnMusicEl.play();
  if(p && p.then){
    p.then(()=>{ if(rnMusicEl){ rnMusicEl.pause(); try{rnMusicEl.currentTime=0;}catch(e){} } })
     .catch(()=>{ /* couldn't prime; rnStartMusic still tries, else chirps */ });
  }
}
function rnStartChirps(){
  if(rnMusicEl){ try{ rnMusicEl.pause(); }catch(e){} rnMusicEl = null; }
  rnChirp();
  rnChirpTimer = setInterval(rnChirp, 420);
}
function rnStartMusic(){
  if(rnMusicEl){
    rnMusicEl.muted = false;
    rnMusicEl.volume = 1;
    try{ rnMusicEl.currentTime = 0; }catch(e){}
    const p = rnMusicEl.play();
    if(p && p.catch) p.catch(rnStartChirps);
  } else {
    rnStartChirps();   // no primed element (e.g. file missing) — use chirps
  }
}
function rnStopMusic(){
  if(rnMusicEl){ try{ rnMusicEl.pause(); }catch(e){} rnMusicEl = null; }
  if(rnChirpTimer){ clearInterval(rnChirpTimer); rnChirpTimer = null; }
}
/* Opens straight on the forest background with Lainey standing on it.
   The narration plays, then she walks over and ducks behind a rock, then
   the rocks (with her hidden behind one) shuffle to the cricket music. */
function renderRockNapGame(stage){
  rnGen++;

    <p class="ask" id="rnAsk">This is Lainey — she's getting sleepy!</p>

      ${[0,1,2].map(k=>`
        <button class="rockSpot" id="rock${k}" style="left:${RN_SLOT_X[k]}%" onclick="pickRock(${k})" disabled>
          <img class="rockImg" src="art/rockshellgame.png" alt="rock" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'rockEmoji',textContent:'🪨'}))">
        </button>`).join('')}
      <img class="rockLainey" id="rockLainey" src="art/shellgame.png?v=${Date.now()}" alt="Lainey" style="left:50%">

  `;
  rnPrepareMusic();  // prime the shuffle music now, inside this tap, so iOS
                     // will let it play later when the shuffle starts
  playAudio('laineyrock',
    "Lainey is so tired, she wants to take a nap. She is hiding behind a rock. Can you find her? After the music stops, pick a rock and see if she is still asleep.",
    (ms)=>{ setTimeout(()=>{ if(myGen===rnGen) rnLaineyHide(); }, ms+300); });
}
/* Lainey walks over to her chosen rock and ducks behind it. */
function rnLaineyHide(){
  const myGen = rnGen;
  const lainey = document.getElementById('rockLainey');
  document.getElementById('rnAsk').textContent = 'Watch — Lainey hides behind a rock!';
  // her rock is still at its starting slot (rnPos is [0,1,2] here)
  if(lainey) lainey.style.left = RN_SLOT_X[rnHiddenRock]+'%';
  setTimeout(()=>{
    if(myGen!==rnGen) return;
    if(lainey) lainey.classList.add('hidden'); // duck down behind the rock
    setTimeout(()=>{ if(myGen===rnGen) rnShuffle(); }, 550);
  }, 950);
}
function rnShuffle(){
  const myGen = rnGen;
  rnStartMusic();
  let swapsLeft = RN_SWAPS;
  const band = document.getElementById('rockBand');
  const lainey = document.getElementById('rockLainey');
  const doSwap = ()=>{
    if(myGen!==rnGen || !document.getElementById('rock0')){ rnStopMusic(); return; }
    if(band){ band.classList.remove('pulse'); void band.offsetWidth; band.classList.add('pulse'); }
    const a = Math.floor(Math.random()*3);
    let b = Math.floor(Math.random()*3);
    while(b===a) b = Math.floor(Math.random()*3);
    const tmp = rnPos[a]; rnPos[a]=rnPos[b]; rnPos[b]=tmp;
    document.getElementById('rock'+a).style.left = RN_SLOT_X[rnPos[a]]+'%';
    document.getElementById('rock'+b).style.left = RN_SLOT_X[rnPos[b]]+'%';
    // keep hidden Lainey tracking behind her rock as it moves
    if(lainey) lainey.style.left = RN_SLOT_X[rnPos[rnHiddenRock]]+'%';
    swapsLeft--;
    if(swapsLeft>0){ setTimeout(doSwap, RN_SWAP_GAP); }
    else {
      setTimeout(()=>{
        if(myGen!==rnGen) return;
        rnStopMusic();
        for(let k=0;k<3;k++){ const r=document.getElementById('rock'+k); if(r) r.disabled=false; }
        document.getElementById('rnAsk').textContent = 'The music stopped — pick a rock!';
        document.getElementById('rnFeedback').textContent = 'Is she still asleep?';
      }, RN_SWAP_GAP);
    }
  };
  doSwap();
}
function pickRock(k){
  if(rnFound) return;
  const fb = document.getElementById('rnFeedback');
  const rock = document.getElementById('rock'+k);
  rock.classList.remove('bounce'); void rock.offsetWidth; rock.classList.add('bounce');
  if(k===rnHiddenRock){

    for(let j=0;j<3;j++) document.getElementById('rock'+j).disabled = true;
    const lainey = document.getElementById('rockLainey');

    fb.innerHTML = '<span class="star">⭐ You found Lainey — shh, she\'s still asleep! ⭐</span>';

    rock.disabled = true;
    fb.textContent = 'Not that rock — try another!';
    playAudio('tryagain', "Not there, try again!");
    setTimeout(()=>{ if(!rnFound && rock) rock.disabled = false; }, 900);
  }
}

/* plays the reward clip at art/rockreward1.mp4; if it can't load, falls

/* ===== Game: Make a Song with the Owl (free-play instrument) =====
   Six colourful notes float over the owl scene. Each note is tuned to one
   pitch of a C-major pentatonic scale (+ the octave) — chosen so ANY order
   the child taps always sounds musical. Tones are synthesized with the Web
   Audio API (no sound files needed), so every note has its own pitch and it
   plays instantly on tap. "Play my song" replays whatever they tapped.
   Notes use art/note1.png … note6.png (red→purple), low→high pitch. */
/* positions are in % of the scene; the notes arch across the FULL width of
   the sky above the owl, centred over it (low→high pitch, left→right) */
const OWL_NOTES = [
  {key:'note1', freq:523.25, x:9,  y:37},  // red    – C5
  {key:'note2', freq:587.33, x:24, y:29},  // orange – D5
  {key:'note3', freq:659.25, x:39, y:24},  // yellow – E5
  {key:'note4', freq:783.99, x:58, y:24},  // green  – G5
  {key:'note5', freq:880.00, x:74, y:29},  // blue   – A5
  {key:'note6', freq:1046.50, x:90, y:37}  // purple – C6
];
/* each "instrument" is just a different synth recipe — waveform + how fast it
   chimes in (attack) and fades out (release). No sound files needed. */
const OWL_INSTRUMENTS = [
  {key:'musicbox', name:'Music Box', emoji:'🔔', type:'sine',     attack:0.01,  release:1.4, peak:0.30},
  {key:'xylophone',name:'Xylophone', emoji:'🎵', type:'triangle', attack:0.005, release:0.5, peak:0.34},
  {key:'piano',    name:'Piano',     emoji:'🎹', type:'triangle', attack:0.004, release:0.9, peak:0.30},
  {key:'flute',    name:'Flute',     emoji:'🪈', type:'sine',     attack:0.09,  release:0.7, peak:0.22},
  {key:'drum',     name:'Drum',      emoji:'🥁', style:'drum'}
];
const OWL_MAX_NOTES = 50;   // song fills up at 50 notes, then they play it
// each entry is {freq, ins} — the note AND the instrument it was tapped with,
// so playback can switch instruments note-by-note just like they built it
let owlAudioCtx=null, owlSong=[], owlInstrument=OWL_INSTRUMENTS[0];
function renderOwlSongGame(stage){
  owlSong = [];
  stage.innerHTML = `
    <p class="ask" id="owlAsk">Pick an instrument and tap notes — switch any time! 🎵</p>
    <div class="owlInstruments" id="owlInstruments">
      ${OWL_INSTRUMENTS.map((ins,i)=>`<button class="owlInsBtn${i===0?' active':''}" data-key="${ins.key}" onclick="owlPickInstrument('${ins.key}')">${ins.emoji} ${ins.name}</button>`).join('')}
    </div>
    <div class="owlScene" id="owlScene" style="background-image:url('art/owlsinging.png')"></div>
    <div class="owlBtns" id="owlBtns">
      <button class="btn btn-daisy" id="owlPlayBackBtn" onclick="owlPlayBack()">🔁 Play my song</button>
      <button class="btn btn-daisy" onclick="renderOwlSongGame(document.getElementById('stageArea'))">✨ Start over</button>
    </div>
    <div class="feedback" id="owlFeedback"></div>
  `;
  owlInstrument = OWL_INSTRUMENTS[0];
  playAudio('tapthenotes', "Pick an instrument, then tap the notes to make your own song. When you are done, play your song for the owl!");
  const scene = document.getElementById('owlScene');
  OWL_NOTES.forEach((n,i)=>{
    const btn = document.createElement('button');
    btn.className = 'owlNote';
    btn.style.left = n.x+'%'; btn.style.top = n.y+'%';
    btn.setAttribute('aria-label', 'musical note');
    const img = document.createElement('img');
    img.className = 'owlNoteImg';
    img.src = 'art/'+n.key+'.png';
    img.draggable = false;
    img.style.animationDelay = (i*0.25)+'s';   // bob out of sync
    btn.appendChild(img);
    btn.addEventListener('pointerdown', e=>{ e.preventDefault(); owlTapNote(n, btn); });
    scene.appendChild(btn);
  });
}
/* the tap itself is the user gesture, so the AudioContext resumes fine here */
function owlEnsureAudio(){
  if(!owlAudioCtx) owlAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if(owlAudioCtx.state === 'suspended') owlAudioCtx.resume();
  return owlAudioCtx;
}
function owlPlayTone(freq, ins){
  ins = ins || owlInstrument;   // playback passes each note's own instrument
  if(ins.style === 'drum'){ owlDrumHit(freq); return; }
  const ctx = owlEnsureAudio(); const now = ctx.currentTime;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = ins.type;
  osc.frequency.value = freq;
  const end = ins.attack + ins.release;
  gain.gain.setValueAtTime(0.0001, now);
  gain.gain.exponentialRampToValueAtTime(ins.peak, now + ins.attack);  // chime in
  gain.gain.exponentialRampToValueAtTime(0.0001, now + end);           // fade out
  osc.connect(gain).connect(ctx.destination);
  osc.start(now); osc.stop(now + end + 0.05);
}
/* a drum isn't a pitched tone — synth a little tom hit: a quick pitch-dropping
   "membrane" plus a noise click. Higher notes give higher toms, so tapping
   different notes still sounds musical. */
function owlDrumHit(freq){
  const ctx = owlEnsureAudio(); const now = ctx.currentTime;
  const base = Math.max(70, freq * 0.4);
  const osc = ctx.createOscillator();
  const g = ctx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(base, now);
  osc.frequency.exponentialRampToValueAtTime(base*0.45, now + 0.16);
  g.gain.setValueAtTime(0.0001, now);
  g.gain.exponentialRampToValueAtTime(0.5, now + 0.005);
  g.gain.exponentialRampToValueAtTime(0.0001, now + 0.3);
  osc.connect(g).connect(ctx.destination);
  osc.start(now); osc.stop(now + 0.32);
  // short noise burst for the "thwack" of the attack
  const n = Math.floor(ctx.sampleRate * 0.05);
  const buf = ctx.createBuffer(1, n, ctx.sampleRate);
  const d = buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i] = (Math.random()*2-1) * (1 - i/n);
  const noise = ctx.createBufferSource(); noise.buffer = buf;
  const ng = ctx.createGain();
  ng.gain.setValueAtTime(0.22, now);
  ng.gain.exponentialRampToValueAtTime(0.0001, now + 0.05);
  noise.connect(ng).connect(ctx.destination);
  noise.start(now); noise.stop(now + 0.06);
}
function owlPickInstrument(key){
  owlInstrument = OWL_INSTRUMENTS.find(x=>x.key===key) || OWL_INSTRUMENTS[0];
  document.querySelectorAll('.owlInsBtn').forEach(b=>b.classList.toggle('active', b.dataset.key===key));
  owlPlayTone(659.25);   // sample note so they hear the new voice
}
function owlTapNote(n, btn){
  if(owlSong.length >= OWL_MAX_NOTES){
    const ask = document.getElementById('owlAsk');
    if(ask) ask.textContent = 'Your song is full! 🎶 Tap "Play my song" for the owl!';
    return;
  }
  owlPlayTone(n.freq);                              // plays in the current instrument
  owlSong.push({freq:n.freq, ins:owlInstrument});   // remember which instrument
  const img = btn.querySelector('.owlNoteImg');
  img.classList.remove('pop'); void img.offsetWidth; img.classList.add('pop');
  owlSparkle(btn);
  if(owlSong.length >= OWL_MAX_NOTES){
    const ask = document.getElementById('owlAsk');
    if(ask) ask.textContent = 'Your song is full! 🎶 Tap "Play my song" for the owl!';
  }
}
function owlSparkle(btn){
  const scene = document.getElementById('owlScene'); if(!scene) return;
  const s = document.createElement('div');
  s.className = 'owlSpark'; s.textContent = '✨';
  const r = btn.getBoundingClientRect(), sr = scene.getBoundingClientRect();
  s.style.left = (r.left - sr.left + r.width/2)+'px';
  s.style.top  = (r.top - sr.top)+'px';
  scene.appendChild(s);
  setTimeout(()=>{ if(s.parentNode) s.remove(); }, 700);
}
/* replays the tapped sequence, lighting each note as it sounds, then plays
   the reward video */
function owlPlayBack(){
  if(!owlSong.length){
    const fb = document.getElementById('owlFeedback');
    if(fb){ fb.textContent = 'Tap some notes first! 🎵'; setTimeout(()=>{ if(fb) fb.textContent=''; }, 1600); }
    return;
  }
  owlEnsureAudio();
  const pb = document.getElementById('owlPlayBackBtn'); if(pb) pb.disabled = true;
  document.getElementById('owlAsk').textContent = 'Here comes your song! 🎶';
  const notesByFreq = {};
  document.querySelectorAll('.owlNote').forEach((btn,i)=>{ notesByFreq[OWL_NOTES[i].freq] = btn; });
  owlSong.forEach((note,i)=>{
    setTimeout(()=>{
      owlPlayTone(note.freq, note.ins);   // each note in its own instrument
      const btn = notesByFreq[note.freq];
      if(btn){ const img = btn.querySelector('.owlNoteImg'); img.classList.remove('pop'); void img.offsetWidth; img.classList.add('pop'); owlSparkle(btn); }
    }, i*440);
  });
  // after the whole song has played, roll the reward video
  setTimeout(playOwlReward, owlSong.length*440 + 400);
}
/* reward video over the owl scene; on end (or if it can't load) we offer to
   play another song, and Next Scene is always there to move on */
function playOwlReward(){
  const stageEl = document.getElementById('owlScene');
  if(!stageEl){ owlAfterReward(); return; }
  const vid = document.createElement('video');
  vid.src = 'art/owlreward1.mp4?v='+Date.now();
  vid.playsInline = true; vid.autoplay = false;
  vid.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:8;border-radius:20px;';
  let handled=false;
  const cleanup = ()=>{ if(vid.parentNode) vid.remove(); };
  const done = ()=>{ if(!handled){ handled=true; cleanup(); owlAfterReward(); } };
  vid.addEventListener('error', done);
  vid.addEventListener('ended', done);
  stageEl.appendChild(vid);
  // the child tapped Play, so the page has user activation — play with sound,
  // retry muted (then unmute) if the browser blocks it
  vid.muted = false;
  const p = vid.play();
  if(p && p.catch){
    p.catch(()=>{
      vid.muted = true;
      vid.addEventListener('playing', ()=>{ vid.muted = false; }, {once:true});
      const p2 = vid.play();
      if(p2 && p2.catch){ p2.catch(done); }
    });
  }
}
function owlAfterReward(){
  const ask = document.getElementById('owlAsk');
  if(ask) ask.textContent = 'What a lovely song! 🎶 Play another, or tap Next Scene to move on.';
  owlSong = [];                                  // clear for a fresh song
  const pb = document.getElementById('owlPlayBackBtn'); if(pb) pb.disabled = false;
}

/* ===== Game 7: Fountain Splash (pop-the-droplet reaction game) =====
   Water droplets pop up one at a time from the fountain; tap them
   before they splash away. Generous on-screen time (2s) keeps this
   toddler-friendly rather than a fast reflex test, and missing one
   has no penalty — it just fades and the next droplet appears. */
const FT_TARGET_HITS = 8;
const FT_DROPLET_LIFETIME = 1300;
const FT_GAP_BETWEEN = 250;
/* fountain art fills in progressively as droplets are tapped */
const FT_STAGE_IMAGES = {0:'nowaterfountain', 2:'fountain2', 4:'fountain3', 6:'fountain4'};
let ftHits=0, ftDropletTimer=null, ftActive=false;
function renderFountainGame(stage){
  ftHits = 0;
  ftActive = false;
  stage.innerHTML = `
    <p class="ask" id="ftAsk">Tap the water droplets to fill the fountain.</p>
    <div class="fountainStage" id="fountainStage"></div>
    <div class="beatProgress" id="ftProgress"></div>
    <button class="btn btn-daisy" id="ftPlayAgainBtn" onclick="renderFountainGame(document.getElementById('stageArea'))" style="visibility:hidden">🔁 Play Again</button>
    <div class="feedback" id="ftFeedback"></div>
  `;
  updateFtProgress();
  updateFountainArt();
  playAudio('fillthefountain', "Tap the water droplets to fill the fountain.");
  setTimeout(spawnDroplet, 900);
}
/* swaps in the fuller-fountain art as droplets are tapped, per
   FT_STAGE_IMAGES (0 = dry, 2/4/6 hits = progressively fuller) */
function updateFountainArt(){
  const stageEl = document.getElementById('fountainStage');
  if(!stageEl) return;
  const thresholds = Object.keys(FT_STAGE_IMAGES).map(Number).sort((a,b)=>a-b);
  const current = thresholds.filter(t=>ftHits>=t).pop();
  stageEl.style.backgroundImage = `url('art/${FT_STAGE_IMAGES[current]}.png')`;
}
function spawnDroplet(){
  const stageEl = document.getElementById('fountainStage');
  if(!stageEl) return;
  ftActive = true;
  const x = 12 + Math.random()*76;
  const y = 15 + Math.random()*60;
  const el = document.createElement('button');
  el.className = 'droplet';
  el.style.left = x+'%';
  el.style.top = y+'%';
  el.innerHTML = '<img src="art/waterdrop.png" alt="">';
  el.onclick = ()=>popDroplet(el, true);
  stageEl.appendChild(el);
  ftDropletTimer = setTimeout(()=>popDroplet(el, false), FT_DROPLET_LIFETIME);
}
function popDroplet(el, hit){
  if(!el || !el.parentNode) return;
  clearTimeout(ftDropletTimer);
  el.onclick = null;
  if(hit){
    el.classList.add('popped');
    ftHits++;
    updateFtProgress();
    updateFountainArt();
    setTimeout(()=>el.remove(), 200);
    if(ftHits>=FT_TARGET_HITS){
      ftActive=false;
      ftCelebrate();
      return;
    }
  } else {
    el.classList.add('faded');
    setTimeout(()=>el.remove(), 300);
  }
  if(ftActive) setTimeout(spawnDroplet, FT_GAP_BETWEEN);
}
function updateFtProgress(){
  document.getElementById('ftProgress').innerHTML = Array.from({length:FT_TARGET_HITS}).map((_,i)=>
    `<span class="beatDot ${i<ftHits?'filled':''}"><img src="art/waterdrop.png" alt=""></span>`).join('');
}
function ftCelebrate(){
  // no spoken "you did it" line — go straight to the reward video
  playFountainReward(ftConfetti);
}
/* tries a real reward clip at art/fountainreward.mp4; if it doesn't
   exist yet (or fails to load), falls straight to the confetti
   celebration — same fallback pattern as the other games' clips */
function playFountainReward(fallbackFn){
  const stageEl = document.getElementById('fountainStage');
  const vid = document.createElement('video');
  vid.src = 'art/fountainreward1.mp4?v='+Date.now();
  vid.playsInline = true; vid.autoplay = false;
  vid.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:8;border-radius:22px;';
  let handled=false;
  const cleanup = ()=>{ if(vid.parentNode) vid.remove(); };
  const fail = ()=>{ if(!handled){ handled=true; cleanup(); fallbackFn(); } };
  vid.addEventListener('error', fail);
  vid.addEventListener('ended', ()=>{ cleanup(); fallbackFn(); });
  stageEl.appendChild(vid);
  // try WITH sound first; if blocked, play muted and leave it muted so it
  // never freezes mid-play (unmuting a non-gesture play pauses it)
  vid.muted = false;
  const p = vid.play();
  if(p && p.catch){
    p.catch(()=>{
      vid.muted = true;
      const p2 = vid.play();
      if(p2 && p2.catch){ p2.catch(fail); }
    });
  }
}
function ftConfetti(){
  const stageEl = document.getElementById('fountainStage');
  for(let c=0;c<14;c++){
    const conf=document.createElement('div');
    conf.className='confetti';
    conf.textContent=['💧','✨','🎉'][c%3];
    conf.style.left=(5+Math.random()*90)+'%';
    conf.style.top=(10+Math.random()*20)+'%';
    conf.style.animationDelay=(Math.random()*.3)+'s';
    stageEl.appendChild(conf);
    setTimeout(()=>conf.remove(),1500);
  }
  document.getElementById('ftPlayAgainBtn').style.visibility='visible';
}

/* ===== Game 8: Catch the Apples (drag-to-follow basket game) =====
   Apples fall slowly from the tree; drag anywhere on the stage to
   slide the basket left/right underneath them. Each falling apple is
   checked every frame against the character's actual on-screen position,
   so it disappears the instant it touches Violet/Lainey, rather than
   only being judged once it reaches the ground. */
const AP_TARGET_HITS = 10;
const AP_FALL_DURATION = 2600;
const AP_SPAWN_GAP = 650;
let apHits=0, apBasketX=50, apActive=false, apSpawnTimer=null, apCharacter=null, apGen=0;
let apInstructionAudio=null, apStartGuard=false;
function renderAppleGame(stage){
  apGen++;
  if(apSpawnTimer) clearTimeout(apSpawnTimer);
  apHits = 0;
  apPileCount = 0;
  apBasketX = 50;
  apActive = false;
  apCharacter = null;
  stage.innerHTML = `
    <p class="ask" id="apAsk">Choose Lainey or Violet to catch the falling apples. Catch 10, then tap your basket! 🪣</p>
    <div class="appleStage" id="appleStage">
      <div class="charChoice" id="apCharChoice">
        <button class="charChoiceBtn" onclick="startAppleGame('violet')"><img src="art/violetbasket.png" alt="Violet"><span>Violet</span></button>
        <button class="charChoiceBtn" onclick="startAppleGame('lainey')"><img src="art/laineybasket.png" alt="Lainey"><span>Lainey</span></button>
      </div>
      <button class="basket" id="basket" style="left:${apBasketX}%;display:none"></button>
    </div>
    <div class="beatProgress" id="apProgress"></div>
    <button class="btn btn-daisy" id="apPlayAgainBtn" onclick="renderAppleGame(document.getElementById('stageArea'))" style="visibility:hidden">🔁 Play Again</button>
    <div class="feedback" id="apFeedback"></div>
  `;
  updateApProgress();
  apInstructionAudio = playAudio('catchapples', "Choose Lainey or Violet to help you catch the falling apples. When you have caught 10 apples, click your basket!");
}
function startAppleGame(character){
  apCharacter = character;
  apActive = true;
  document.getElementById('apCharChoice').remove();
  const basket = document.getElementById('basket');
  basket.style.display = 'block';
  basket.innerHTML = `<img src="art/${character}basket.png" alt="">`;
  setupBasketDrag();
  // the apple bucket pops up and stays visible while they catch; it flashes
  // once all 10 are caught so they remember to tap it for the reward
  const apStage = document.getElementById('appleStage');
  if(apStage && !document.getElementById('apBucket')){
    const b=document.createElement('button'); b.type='button'; b.id='apBucket'; b.className='apBucket';
    b.innerHTML='<img src="art/applebucket.png" alt="apple bucket">';
    b.querySelector('img').addEventListener('error', ()=>b.remove());  // missing art -> just skip it
    apStage.appendChild(b);
  }
  // don't drop any apples until the spoken instructions have finished
  apStartGuard = false;
  const a = apInstructionAudio;
  if(a && !a.ended && !a.error){
    a.addEventListener('ended', apBeginFalling, {once:true});
    a.addEventListener('error', apBeginFalling, {once:true});
    setTimeout(apBeginFalling, 9000);   // safety net if 'ended' never fires
  } else {
    apBeginFalling();                    // instructions already done (or none)
  }
}
function apBeginFalling(){
  if(apStartGuard || !apActive) return;  // fire once, and only if still playing
  apStartGuard = true;
  setTimeout(spawnApple, 500);
}
function setupBasketDrag(){
  const stageEl = document.getElementById('appleStage');
  const basket = document.getElementById('basket');
  const moveBasketTo = (clientX)=>{
    const rect = stageEl.getBoundingClientRect();
    let x = ((clientX-rect.left)/rect.width)*100;
    x = Math.max(8, Math.min(92, x));
    apBasketX = x;
    basket.style.left = x+'%';
  };
  stageEl.addEventListener('pointerdown', (e)=>{
    stageEl.setPointerCapture(e.pointerId);
    moveBasketTo(e.clientX);
    const onMove = (ev)=> moveBasketTo(ev.clientX);
    const onUp = ()=>{
      stageEl.removeEventListener('pointermove', onMove);
      stageEl.removeEventListener('pointerup', onUp);
      stageEl.removeEventListener('pointercancel', onUp);
    };
    stageEl.addEventListener('pointermove', onMove);
    stageEl.addEventListener('pointerup', onUp);
    stageEl.addEventListener('pointercancel', onUp);
  });
}
function spawnApple(){
  if(!apActive) return;
  const stageEl = document.getElementById('appleStage');
  if(!stageEl) return;
  const myGen = apGen;
  const x = 12 + Math.random()*76;
  const el = document.createElement('div');
  el.className = 'fallingApple';
  el.style.left = x+'%';
  el.style.top = '2%';
  el.textContent = '🍎';
  stageEl.appendChild(el);
  const startTime = performance.now();
  const step = (now)=>{
    if(myGen!==apGen || !el.parentNode || !apActive) return;
    const progress = Math.min(1, (now-startTime)/AP_FALL_DURATION);
    el.style.top = (2 + progress*89)+'%';
    const basket = document.getElementById('basket');
    if(basket){
      const ar = el.getBoundingClientRect(), br = basket.getBoundingClientRect();
      const touching = ar.left<br.right && ar.right>br.left && ar.top<br.bottom && ar.bottom>br.top;
      if(touching){ appleCaught(el); return; }
    }
    if(progress>=1){ appleMissed(el); return; }
    requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
  if(apActive) apSpawnTimer = setTimeout(spawnApple, AP_SPAWN_GAP);
}
let apPileCount = 0;
function appleCaught(el){
  apHits++;
  updateApProgress();
  // the caught apple flies into the bucket in the bottom-left corner and piles up
  const n = apPileCount++;
  el.classList.add('piled');
  el.style.transition = 'left .45s ease, top .45s ease, transform .45s ease';
  el.style.left = (10.5 + (Math.random()*8-4)) + '%';
  el.style.top  = (74 - Math.min(n,9)*1.4 + (Math.random()*2-1)) + '%';
  el.style.transform = `translateX(-50%) scale(.5) rotate(${Math.random()*50-25}deg)`;
  if(apHits>=AP_TARGET_HITS){
    apActive = false;
    apCelebrate();
  }
}
/* missed apples just fade away now (no pile) */
function appleMissed(el){
  el.style.transition = 'opacity .3s ease';
  el.style.opacity = '0';
  setTimeout(()=>el.remove(), 300);
}
function updateApProgress(){
  document.getElementById('apProgress').textContent = `🍎 ${apHits} / ${AP_TARGET_HITS} caught`;
}
function apCelebrate(){
  if(apSpawnTimer) clearTimeout(apSpawnTimer);
  const fb=document.getElementById('apFeedback'); if(fb) fb.textContent='Tap the apple bucket! 🪣';
  // the bucket has been on screen the whole time — now make it FLASH and
  // tappable; tapping it (a real tap) plays the reward video WITH sound
  const bucket=document.getElementById('apBucket');
  if(!bucket){ playAppleReward(apConfetti); return; }   // no bucket art -> just play the reward
  bucket.classList.add('apBucketFlash');
  let done=false;
  const goApple=()=>{ if(done) return; done=true; bucket.remove(); playAppleReward(apConfetti); };
  bucket.addEventListener('click', goApple);
  bucket.addEventListener('pointerdown', goApple);
}
/* plays art/applereward.mp4 from the bucket TAP (so it has sound); falls back
   to confetti if the clip is missing */
function playAppleReward(fallbackFn){
  const stageEl = document.getElementById('appleStage');
  const vid = document.createElement('video');
  vid.src = 'art/applereward.mp4?v='+Date.now();
  vid.playsInline = true;
  vid.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:8;border-radius:22px;';
  let handled=false;
  const cleanup = ()=>{ if(vid.parentNode) vid.remove(); };
  const fail = ()=>{ if(!handled){ handled=true; cleanup(); fallbackFn(); } };
  vid.addEventListener('error', fail);
  vid.addEventListener('ended', ()=>{ cleanup(); fallbackFn(); });
  stageEl.appendChild(vid);
  vid.muted = false;                 // played from the bucket tap -> sound
  const p = vid.play();
  if(p && p.catch){ p.catch(()=>{ vid.muted=true; const p2=vid.play(); if(p2&&p2.catch){ p2.catch(fail); } }); }
}
function apConfetti(){
  const fb = document.getElementById('apFeedback');
  fb.innerHTML = '';
  const stageEl = document.getElementById('appleStage');
  for(let c=0;c<14;c++){
    const conf=document.createElement('div');
    conf.className='confetti';
    conf.textContent=['🍎','✨','🎉'][c%3];
    conf.style.left=(5+Math.random()*90)+'%';
    conf.style.top=(10+Math.random()*20)+'%';
    conf.style.animationDelay=(Math.random()*.3)+'s';
    stageEl.appendChild(conf);
    setTimeout(()=>conf.remove(),1500);
  }
  document.getElementById('apPlayAgainBtn').style.visibility='visible';
}

/* ===== Game 9: Stay Awake! — tap the floating Z's =====
   Colorful letters drift up over a full-screen sleepy Violet. Every time
   the child taps a 'Z', Violet flips to a DIFFERENT sleepy pose and a star
   lights up. Only on the LAST Z does she finally wake up (awake image),
   then the reward plays. Other letters just poof away. */
const AW_SLEEP = ['sleepyviolet1','sleepyvioletonbranch','sleepyvioletonbranch2','sleepyvioletonbranch3',
                  'sleepyvioleteyeopenbranch','sleepyvioletholdingflower','upsidedownsleepyviolet','upsidedownvioletmouthopen'];
const AW_AWAKE_IMG = 'awakeviolet9';   // used ONLY on the final Z
const AW_TARGET_ZS = 6;
let awStars=0, awActive=false, awSpawnTimer=null, awPose='';
function renderAwakeGame(stage){
  awStars = 0; awActive = true;
  awPose = AW_SLEEP[0];
  if(awSpawnTimer){ clearInterval(awSpawnTimer); awSpawnTimer=null; }
  stage.innerHTML = `
    <p class="ask" id="awAsk">Tap the Z's to help Violet stay awake!</p>
    <div class="awakeStage awNight" id="awakeStage">
      <img class="awFull" id="awakeImg" src="art/${awPose}.png" alt="Violet">
    </div>
    <div class="beatProgress" id="awProgress"></div>
    <button class="btn btn-daisy" id="awPlayAgainBtn" onclick="renderAwakeGame(document.getElementById('stageArea'))" style="visibility:hidden">🔁 Play Again</button>
    <div class="feedback" id="awFeedback"></div>
  `;
  updateAwProgress();
  awSpawnTimer = setInterval(awSpawnLetter, 620);
  for(let i=0;i<3;i++) setTimeout(awSpawnLetter, i*200); // seed a few so it doesn't start empty
  playAudio('tapthez', "Tap the Z's to help Violet stay awake!", null, ()=>{});
}
const AW_COLORS = ['#ff5d8f','#ffd23f','#5ec8ff','#7be07b','#c08bff','#ff9a3d','#ff6b6b','#4be0c0'];
const AW_OTHER = 'ABCDEFGHIJKLMNOPQRSTUVWXY';
function awSpawnLetter(){
  if(!awActive) return;
  const st = document.getElementById('awakeStage'); if(!st) return;
  const isZ = Math.random() < 0.42;
  const ch = isZ ? 'Z' : AW_OTHER[Math.floor(Math.random()*AW_OTHER.length)];
  const el = document.createElement('button');
  el.className = 'awLetter' + (isZ?' awZ':'');
  el.textContent = ch;
  el.style.left = (6 + Math.random()*82) + '%';
  el.style.color = AW_COLORS[Math.floor(Math.random()*AW_COLORS.length)];
  el.style.fontSize = (4 + Math.random()*2.4) + 'vh';   // smaller letters
  const dur = 4.6 + Math.random()*2.4;
  el.style.animationDuration = isZ ? (dur+'s, 1.1s') : (dur+'s');
  el.addEventListener('animationend', (e)=>{ if(e.animationName==='awRise') el.remove(); });
  el.addEventListener('pointerdown', (e)=>{ e.preventDefault(); awHit(el, ch); });
  st.appendChild(el);
}
function awSetPose(name){
  const img = document.getElementById('awakeImg'); if(!img) return;
  awPose = name;
  img.style.opacity = '0';
  setTimeout(()=>{ img.src = 'art/'+name+'.png'; img.style.opacity = '1'; }, 120);
}
function awHit(el, ch){
  if(!awActive){ el.remove(); return; }
  el.classList.add('awPop'); setTimeout(()=>el.remove(),350);
  if(ch!=='Z') return;               // only Z's count
  awStars++;
  const st = document.getElementById('awakeStage');
  if(st){
    const sp = document.createElement('div'); sp.className='awSpark'; sp.textContent='⭐';
    sp.style.left = el.style.left; sp.style.top = el.offsetTop+'px';
    st.appendChild(sp); setTimeout(()=>sp.remove(),700);
  }
  updateAwProgress();
  if(awStars>=AW_TARGET_ZS){
    // final Z — Violet wakes up, then celebrate
    awActive=false;
    if(awSpawnTimer){ clearInterval(awSpawnTimer); awSpawnTimer=null; }
    document.querySelectorAll('#awakeStage .awLetter').forEach(l=>l.remove());
    // straight into the reward video — don't flash the awake image first, that
    // both looked like a glitch and gave away the video's own wake-up moment.
    // (the awake image is set once the video finishes, as the resting state)
    awCelebrate();
  } else {
    // still sleepy — flip to a DIFFERENT sleepy pose
    let next; do{ next = AW_SLEEP[Math.floor(Math.random()*AW_SLEEP.length)]; }while(next===awPose && AW_SLEEP.length>1);
    awSetPose(next);
  }
}
function updateAwProgress(){
  document.getElementById('awProgress').innerHTML = Array.from({length:AW_TARGET_ZS}).map((_,i)=>
    `<span class="beatDot ${i<awStars?'filled':''}">⭐</span>`).join('');
}
function awCelebrate(){
  playAwakeReward(awConfetti);
}
/* tries a real reward clip at art/stayawakereward.mp4; if it doesn't
   exist yet (or fails to load), falls straight to the confetti
   celebration — same fallback pattern as the other games' clips */
function playAwakeReward(fallbackFn){
  const stageEl = document.getElementById('awakeStage');
  const vid = document.createElement('video');
  vid.src = 'art/stayawakereward.mp4?v='+Date.now();
  vid.playsInline = true; vid.autoplay = false;
  vid.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:8;border-radius:22px;';
  let handled=false;
  const cleanup = ()=>{ if(vid.parentNode) vid.remove(); };
  vid.addEventListener('error', ()=>{ if(!handled){ handled=true; cleanup(); fallbackFn(); } });
  vid.addEventListener('ended', ()=>{ cleanup(); fallbackFn(); });
  stageEl.appendChild(vid);
  const p = vid.play();
  if(p && p.catch){ p.catch(()=>{ if(!handled){ handled=true; cleanup(); fallbackFn(); } }); }
}
function awConfetti(){
  const fb = document.getElementById('awFeedback');
  fb.innerHTML = '<span class="star">⭐ You helped her stay awake! Great job! ⭐</span>';

/* ===== Game 10: Paint the Night Sky (freeform brush) =====
   A calm, low-stimulation activity for the "time for a nap" beat —
   free-draw with a brush on a dark sky background instead of another
   tap-to-fill coloring page, since there are already a few of those. */
const PAINT_COLORS = ['#ffd34e','#ffffff','#8ec9ff','#ff9ecf','#b490e0'];
let paintCtx=null, paintColor=PAINT_COLORS[0], paintDrawing=false, paintLastX=0, paintLastY=0;
function renderPaintGame(stage){
  paintColor = PAINT_COLORS[0];
  stage.innerHTML = `
    <p class="ask">Paint your own starry night sky!</p>
    <div class="palette" id="paintPalette"></div>
    <canvas id="paintCanvas"></canvas>
    <div class="colorTools">
      <button class="replay-btn" onclick="clearPaint()">↺ Clear</button>
      <button class="btn btn-grass" onclick="finishColoring()">✅ I'm Done Painting!</button>
    </div>
  `;
  document.getElementById('paintPalette').innerHTML = PAINT_COLORS.map((c,i)=>
    `<button class="swatch ${i===0?'sel':''}" onclick="pickPaintColor('${c}',this)">${paintBucketSVG(c)}</button>`).join('');
  const canvas = document.getElementById('paintCanvas');
  paintCtx = canvas.getContext('2d');
  requestAnimationFrame(()=>{
    const rect = canvas.getBoundingClientRect();
    canvas.width = Math.round(rect.width);
    canvas.height = Math.round(rect.height);
    paintFillSky();
  });
  canvas.addEventListener('pointerdown', paintStart);
  canvas.addEventListener('pointermove', paintMove);
  canvas.addEventListener('pointerup', paintEnd);
  canvas.addEventListener('pointercancel', paintEnd);
  say("Paint your own starry night sky!");
}
function paintFillSky(){
  const canvas = document.getElementById('paintCanvas');
  const grad = paintCtx.createLinearGradient(0,0,0,canvas.height);
  grad.addColorStop(0,'#161033'); grad.addColorStop(1,'#2b2158');
  paintCtx.fillStyle = grad;
  paintCtx.fillRect(0,0,canvas.width,canvas.height);
}
function pickPaintColor(c, el){
  paintColor = c;
  document.querySelectorAll('#paintPalette .swatch').forEach(s=>s.classList.remove('sel'));
  el.classList.add('sel');
}
function paintPos(e, canvas){
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width/rect.width, scaleY = canvas.height/rect.height;
  return { x: (e.clientX-rect.left)*scaleX, y: (e.clientY-rect.top)*scaleY };
}
function paintStart(e){
  const canvas = e.currentTarget;
  canvas.setPointerCapture(e.pointerId);
  paintDrawing = true;
  const p = paintPos(e, canvas);
  paintLastX = p.x; paintLastY = p.y;
  paintCtx.fillStyle = paintColor;
  paintCtx.beginPath();
  paintCtx.arc(p.x, p.y, 8, 0, Math.PI*2);
  paintCtx.fill();
}
function paintMove(e){
  if(!paintDrawing) return;
  const canvas = e.currentTarget;
  const p = paintPos(e, canvas);
  paintCtx.strokeStyle = paintColor;
  paintCtx.lineWidth = 16;
  paintCtx.lineCap = 'round';
  paintCtx.lineJoin = 'round';
  paintCtx.beginPath();
  paintCtx.moveTo(paintLastX, paintLastY);
  paintCtx.lineTo(p.x, p.y);
  paintCtx.stroke();
  paintLastX = p.x; paintLastY = p.y;
}
function paintEnd(){
  paintDrawing = false;
}
function clearPaint(){
  paintFillSky();
}

/* ===== Game 11: Bring on the Night (drag-to-transform reveal) =====
   Not a scored challenge — a satisfying transformation moment for the
   story's day-to-night pivot. Drag the sun down toward the horizon
   and watch the sky cross-fade into a starry night with the moon. */
let vtProgress=0, vtDone=false;
const VT_SUN_TOP=12, VT_SUN_BOTTOM=72;
function renderDuskDragGame(stage){
  vtProgress = 0;
  vtDone = false;
  stage.innerHTML = `
    <p class="ask" id="vtAsk">Drag the sun down to bring on the night!</p>
    <div class="duskStage" id="duskStage">
      <div class="duskNightLayer" id="duskNightLayer"></div>
      <div class="duskStars" id="duskStars"></div>
      <div class="duskMoon" id="duskMoon">🌙</div>
      <button class="duskSun" id="duskSun" style="top:${VT_SUN_TOP}%">☀️</button>
    </div>
    <div class="feedback" id="vtFeedback"></div>
  `;
  document.getElementById('duskStars').innerHTML = Array.from({length:18}).map(()=>
    `<span class="star2" style="left:${(5+Math.random()*90).toFixed(1)}%;top:${(5+Math.random()*55).toFixed(1)}%;animation-delay:${(Math.random()*2).toFixed(2)}s">✦</span>`).join('');
  setupSunDrag();
  say("Drag the sun down to bring on the night!");
}
function setupSunDrag(){
  const stageEl = document.getElementById('duskStage');
  const sun = document.getElementById('duskSun');
  const moveSun = (clientY)=>{
    const rect = stageEl.getBoundingClientRect();
    let yPct = ((clientY-rect.top)/rect.height)*100;
    yPct = Math.max(VT_SUN_TOP, Math.min(VT_SUN_BOTTOM, yPct));
    vtProgress = (yPct-VT_SUN_TOP)/(VT_SUN_BOTTOM-VT_SUN_TOP);
    sun.style.top = yPct+'%';
    updateDusk();
  };
  sun.addEventListener('pointerdown',(e)=>{
    if(vtDone) return;
    sun.setPointerCapture(e.pointerId);
    moveSun(e.clientY);
    const onMove=(ev)=>moveSun(ev.clientY);
    const onUp=()=>{
      sun.removeEventListener('pointermove',onMove);
      sun.removeEventListener('pointerup',onUp);
      sun.removeEventListener('pointercancel',onUp);
      if(vtProgress>=0.92 && !vtDone) vtCelebrate();
    };
    sun.addEventListener('pointermove',onMove);
    sun.addEventListener('pointerup',onUp);
    sun.addEventListener('pointercancel',onUp);
  });
}
function updateDusk(){
  document.getElementById('duskNightLayer').style.opacity = vtProgress;
  document.getElementById('duskStars').style.opacity = Math.max(0,(vtProgress-0.3)/0.7);
  document.getElementById('duskMoon').style.opacity = vtProgress;
  document.getElementById('duskSun').style.opacity = 1-vtProgress*0.9;
}
function vtCelebrate(){
  vtDone = true;
  const fb = document.getElementById('vtFeedback');
  fb.innerHTML = '<span class="star">⭐ You brought on the night! Great job! ⭐</span>';
  say("You brought on the night! Great job!");
  document.getElementById('vtAsk').textContent = "The night sky is shining!";
  const stageEl = document.getElementById('duskStage');
  for(let c=0;c<14;c++){
    const conf=document.createElement('div');
    conf.className='confetti';
    conf.textContent=['✨','🌟','⭐'][c%3];
    conf.style.left=(5+Math.random()*90)+'%';
    conf.style.top=(10+Math.random()*20)+'%';
    conf.style.animationDelay=(Math.random()*.3)+'s';
    stageEl.appendChild(conf);
    setTimeout(()=>conf.remove(),1500);
  }
}

/* ===== Game 12: Playground Race (chutes & ladders style board) =====
   Roll and move along a numbered playground board — land on a slide
   and whoosh down to an earlier square, land on a rainbow swing and
   bounce up to a later one. Reach the last square to win. */
const PG_BOARD_SIZE = 16;
const PG_SLIDES = {6:2, 12:8};
const PG_SWINGS = {4:9, 10:14};
let pgPos=1, pgMoving=false, pgWon=false;
function renderPlaygroundGame(stage){
  pgPos = 1;
  pgMoving = false;
  pgWon = false;
  stage.innerHTML = `
    <p class="ask" id="pgAsk">Roll to move around the playground — watch for slides and swings!</p>
    <div class="pgBoard" id="pgBoard"></div>
    <button class="btn btn-daisy" id="pgRollBtn" onclick="pgRoll()">🎲 Roll!</button>
    <button class="btn btn-violet" id="pgPlayAgainBtn" onclick="renderPlaygroundGame(document.getElementById('stageArea'))" style="visibility:hidden">🔁 Play Again</button>
    <div class="feedback" id="pgFeedback"></div>
  `;
  renderPgBoard();
  say("Roll to move around the playground!");
}
function renderPgBoard(){
  const board = document.getElementById('pgBoard');
  board.innerHTML = '';
  for(let n=1; n<=PG_BOARD_SIZE; n++){
    const cell = document.createElement('div');
    cell.className = 'pgCell';
    let icon = '';
    if(PG_SLIDES[n]) icon = '🛝';
    else if(PG_SWINGS[n]) icon = '🌈';
    cell.innerHTML = `<span class="pgNum">${n}</span><span class="pgIcon">${icon}</span>${n===pgPos?'<span class="pgToken">🦇</span>':''}`;
    board.appendChild(cell);
  }
}
function pgRoll(){
  if(pgMoving || pgWon) return;
  pgMoving = true;
  document.getElementById('pgRollBtn').disabled = true;
  const roll = 1+Math.floor(Math.random()*3);
  document.getElementById('pgFeedback').textContent = `Rolled a ${roll}!`;
  say(`Rolled a ${roll}!`);
  setTimeout(()=>pgStepMove(roll), 400);
}
function pgStepMove(stepsLeft){
  if(stepsLeft<=0 || pgPos>=PG_BOARD_SIZE){ pgAfterMove(); return; }
  pgPos = Math.min(PG_BOARD_SIZE, pgPos+1);
  renderPgBoard();
  if(pgPos>=PG_BOARD_SIZE){ pgAfterMove(); return; }
  setTimeout(()=>pgStepMove(stepsLeft-1), 260);
}
function pgAfterMove(){
  if(pgPos>=PG_BOARD_SIZE){ pgWin(); return; }
  if(PG_SLIDES[pgPos]){
    const dest = PG_SLIDES[pgPos];
    document.getElementById('pgFeedback').textContent = 'Whee — down the slide!';
    say("Whee, down the slide!");
    setTimeout(()=>{ pgPos = dest; renderPgBoard(); pgFinishTurn(); }, 600);
  } else if(PG_SWINGS[pgPos]){
    const dest = PG_SWINGS[pgPos];
    document.getElementById('pgFeedback').textContent = 'Up you go on the swing!';
    say("Up you go on the swing!");
    setTimeout(()=>{ pgPos = dest; renderPgBoard(); pgFinishTurn(); }, 600);
  } else {
    pgFinishTurn();
  }
}
function pgFinishTurn(){
  if(pgPos>=PG_BOARD_SIZE){ pgWin(); return; }
  pgMoving = false;
  document.getElementById('pgRollBtn').disabled = false;
  document.getElementById('pgFeedback').textContent = '';
}
function pgWin(){
  pgWon = true;
  pgMoving = false;
  pgCelebrate();
}
function pgCelebrate(){
  const fb = document.getElementById('pgFeedback');
  fb.innerHTML = '<span class="star">⭐ You made it across the playground! Great job! ⭐</span>';
  say("You made it across the playground! Great job!");
  document.getElementById('pgRollBtn').style.visibility='hidden';
  document.getElementById('pgPlayAgainBtn').style.visibility='visible';
  const stageEl = document.getElementById('pgBoard');
  for(let c=0;c<14;c++){
    const conf=document.createElement('div');
    conf.className='confetti';
    conf.textContent=['🎉','✨','🎊'][c%3];
    conf.style.left=(5+Math.random()*90)+'%';
    conf.style.top=(-6+Math.random()*20)+'%';
    conf.style.animationDelay=(Math.random()*.3)+'s';
    stageEl.appendChild(conf);
    setTimeout(()=>conf.remove(),1500);
  }
}

/* ===== Game: Tuck Them In (cozy nap game) =====
   A calm three-step bedtime routine for the "Time for a Nap" beat: drag a
   pillow to Violet & Lainey, drag a blanket over them, then tap the lamp

let tuckStep=0;
function tuckPillowSVG(){
  return `<svg viewBox="0 0 120 70" xmlns="http://www.w3.org/2000/svg"><rect x="6" y="12" width="108" height="46" rx="23" fill="#fff8ec" stroke="#e2d6bf" stroke-width="2.5"/><path d="M30 35 q30 -8 60 0" stroke="#ece0c8" stroke-width="2" fill="none" opacity=".7"/></svg>`;
}
function tuckBlanketSVG(){
  return `<svg viewBox="0 0 120 80" xmlns="http://www.w3.org/2000/svg"><rect x="8" y="16" width="104" height="56" rx="12" fill="#7cc6ff" stroke="#4a9fe0" stroke-width="2.5"/><path d="M8 16 q52 12 104 0" fill="#9ad3ff" opacity=".6"/><path d="M8 38 h104 M8 54 h104" stroke="#4a9fe0" stroke-width="2" opacity=".5"/></svg>`;
}
function renderTuckInGame(stage){

function tuckSpawnItem(type){
  const stage = document.getElementById('tuckStage');
  if(!stage) return;
  const btn = document.createElement('button');
  btn.className = 'tuckItem'; btn.id = 'tuckItem';
  if(type==='pillow'){ btn.style.cssText='left:6%;top:12%;width:34%'; btn.innerHTML = tuckPillowSVG(); }
  else { btn.style.cssText='left:60%;top:12%;width:32%'; btn.innerHTML = tuckBlanketSVG(); }
  btn.addEventListener('pointerdown', (e)=>tuckItemDown(e, type, btn));
  stage.appendChild(btn);
}
function tuckItemDown(e, type, btn){
  const stage = document.getElementById('tuckStage');
  btn.setPointerCapture(e.pointerId);
  btn.classList.add('dragging');
  const rect = stage.getBoundingClientRect();
  const onMove = (ev)=>{
    const x = ((ev.clientX-rect.left)/rect.width)*100;
    const y = ((ev.clientY-rect.top)/rect.height)*100;
    btn.style.left = Math.max(0,Math.min(88,x-16))+'%';
    btn.style.top  = Math.max(0,Math.min(84,y-12))+'%';
  };
  const onUp = (ev)=>{
    btn.removeEventListener('pointermove', onMove);
    btn.removeEventListener('pointerup', onUp);
    btn.removeEventListener('pointercancel', onUp);
    btn.classList.remove('dragging');
    // generous drop: anywhere over the lower half (near the bed) counts
    const y = ((ev.clientY-rect.top)/rect.height)*100;
    if(y > 42) tuckPlace(type, btn);
  };
  btn.addEventListener('pointermove', onMove);
  btn.addEventListener('pointerup', onUp);
  btn.addEventListener('pointercancel', onUp);

function tuckPlace(type, btn){

    lamp.style.display = 'block';

function tuckLampTap(){

  document.getElementById('tuckAsk').textContent = 'Goodnight, Violet and Lainey! 💤';
  say("Goodnight, Violet and Lainey!");
  setTimeout(()=>playTuckReward(tuckConfetti), 800);
}
function playTuckReward(fallbackFn){
  const stageEl = document.getElementById('tuckStage');
  const vid = document.createElement('video');
  vid.src = 'art/tuckinreward.mp4?v='+Date.now();
  vid.playsInline = true; vid.autoplay = false;
  vid.muted = true;
  vid.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:8;border-radius:22px;';
  let handled=false;
  const cleanup = ()=>{ if(vid.parentNode) vid.remove(); };
  vid.addEventListener('error', ()=>{ if(!handled){ handled=true; cleanup(); fallbackFn(); } });
  vid.addEventListener('ended', ()=>{ cleanup(); fallbackFn(); });
  vid.addEventListener('playing', ()=>{ vid.muted = false; }, {once:true});
  stageEl.appendChild(vid);
  const p = vid.play();
  if(p && p.catch){ p.catch(()=>{ if(!handled){ handled=true; cleanup(); fallbackFn(); } }); }
}
function tuckConfetti(){
  const fb = document.getElementById('tuckFeedback');
  fb.innerHTML = '<span class="star">⭐ Sweet dreams, Violet and Lainey! ⭐</span>';
  const stageEl = document.getElementById('tuckStage');

    conf.style.left=(5+Math.random()*90)+'%';
    conf.style.top=(6+Math.random()*20)+'%';
    conf.style.animationDelay=(Math.random()*.3)+'s';

function spawnSheep(){
  if(!sheepActive) return;
