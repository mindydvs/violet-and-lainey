  40: "Because that's what friends do when their worlds are apart, They meet in the middle with love in their heart. Where the daylight meets darkness, their friendship will glow, The brightest of lights that the whole world will know. THE END — See you next Wednesday!"
};

/* ============================================================
   AUDIO: tries a real ElevenLabs export first (audio/<id>.mp3),
   falls back to the browser's built-in voice if the file isn't
   there yet. See audio/README.txt for exact filenames to export.
   ============================================================ */
let currentAudio=null;
/* set by renderScene when the current page has a video (art/pageNvideo.mp4)
   instead of a static image; kept muted and driven in lockstep with the
   narration audio so it plays/pauses/resets together with "Play to Hear
   the Story" rather than as an independent looping background clip */
let sceneVideoEl=null;
/* Chrome has a well-known bug: if a SpeechSynthesisUtterance isn't kept
   referenced somewhere, the garbage collector can silently drop it mid-
   flight — speak() gets called but nothing ever plays and no error fires.
   Keeping a module-level reference to the last utterance prevents that.
   iOS Safari also only allows speak() to fire when called synchronously
   inside a user tap, so we still call it immediately (no setTimeout), and
   only cancel() first if something is actually already speaking. */
let lastUtterance=null;
/* With 199 voices loaded, Chrome's own default pick is likely a remote/
   cloud voice — if that service is unreachable, speak() fails completely
   silently (no sound, no error, no events). Forcing a voice explicitly
   marked localService===true avoids relying on the network at all. */
let violetVoice=null;
function pickVioletVoice(){
  try{
    const voices = speechSynthesis.getVoices();
    if(!voices.length) return;
    const local = voices.filter(v=>v.localService);
    const pool = local.length ? local : voices;
    violetVoice = pool.find(v=>/samantha|victoria|karen|moira|tessa|fiona|female/i.test(v.name))
               || pool.find(v=>v.lang && v.lang.startsWith('en'))
               || pool[0];
  }catch(e){}
}
/* The robotic device voice is disabled everywhere — this app uses ONLY the
   recorded clips. If an audio file is missing or fails to load, we stay silent
   (and note it in the console) instead of speaking in a synthetic voice. */
const USE_DEVICE_VOICE = false;
function say(text){
  if(!USE_DEVICE_VOICE){
    if(text) console.warn('[audio missing — stayed silent]:', text);
    return;
  }
  try{
    if(!('speechSynthesis' in window)) return;
    const clean = text.replace(/[^\w\s'!?.,]/g,'').trim();
    if(!clean) return;
    if(!violetVoice) pickVioletVoice();
    const doSpeak = ()=>{
      const u = new SpeechSynthesisUtterance(clean);
      lastUtterance = u;
      if(violetVoice) u.voice = violetVoice;
      u.rate=.95; u.pitch=1.2; u.volume=1;
      speechSynthesis.speak(u);
    };
    if(speechSynthesis.speaking || speechSynthesis.pending){
      // cancelling and immediately speaking again in the same tick is a
      // known race that can make the new line stutter over the old one —
      // only worth the short delay when there's actually something to
      // cancel; the common case (nothing speaking yet) stays instant.
      speechSynthesis.cancel();
      setTimeout(doSpeak, 60);
    } else {
      doSpeak();
    }
  }catch(e){}
}
function sayAsViolet(text){
  if(!USE_DEVICE_VOICE){
    if(text) console.warn('[word audio missing — stayed silent]:', text);
    return;
  }
  try{
    if(!('speechSynthesis' in window)) return;
    const clean = text.replace(/[^\w\s'!?.,-]/g,'').trim();
    if(!clean) return;
    if(!violetVoice) pickVioletVoice();
    const doSpeak = ()=>{
      const u = new SpeechSynthesisUtterance(clean);
      lastUtterance = u;
      if(violetVoice) u.voice = violetVoice;
      u.rate=.9; u.pitch=1.3; u.volume=1;
      speechSynthesis.speak(u);
    };
    if(speechSynthesis.speaking || speechSynthesis.pending){
      speechSynthesis.cancel();
      setTimeout(doSpeak, 60);
    } else {
      doSpeak();
    }
  }catch(e){}
}
/* Real ElevenLabs word clips: audio/words/<word>.mp3, filename = the word
   lowercased with punctuation stripped (so "it's" -> its.mp3). Falls back
   to the device voice above if that specific word hasn't been recorded. */
function wordToFilename(word){
  return word.toLowerCase().replace(/[^a-z0-9]/g,'');
}
/* ============================================================
   Every audio-starting call bumps audioGeneration. Any async callback
   (a late error event, a late-resolving play() promise, a late
   loadedmetadata) captures the generation number that was current when
   IT started, and checks it's still current before doing anything. If a
   newer stopAudio()/playAudio() has happened since, the stale callback
   is a no-op — this is what actually guarantees only one audio source
   (real clip, fallback voice, or another page's clip) can ever be heard
   at a time, regardless of exact timing.
   ============================================================ */
let audioGeneration = 0;
/* TEMPORARY DIAGNOSTIC: shows a running log of audio start/stop events
   the source of leftover sound. */
function stopAudio(){
  audioGeneration++;
  pageSeqGen++; // invalidates any running word-by-word page narration too
  pageWordSeqRunning = false;
  if(currentAudio){
    const el = currentAudio;
    currentAudio = null;
    try{ el.pause(); el.currentTime = 0; }catch(e){}
  }
  pageReadEl = null;
  try{
    if(sceneVideoEl && !sceneVideoEl.paused){
      sceneVideoEl.pause();
      sceneVideoEl.currentTime = 0;
    }
  }catch(e){}
  try{
    if(splashVideo && !splashVideo.paused){
      splashVideo.pause();
      if(splashVideo._playPromise && splashVideo._playPromise.then){ splashVideo._playPromise.then(()=>{ try{splashVideo.pause();}catch(e){} }).catch(()=>{}); }
    }
  }catch(e){}
  try{speechSynthesis.cancel();}catch(e){}
}
/* plays audio/<id>.mp3 if present; otherwise falls back — by default to
   speaking fallbackText, or to a custom onFail() if one is passed (used
   for whole-page narration to chain real word clips instead of the
   robotic voice). onDuration(ms) is called once we know roughly how long
   the line will take, so callers can pace word-highlighting to match. */
/* Remembers the spoken instruction for the current game so a child who missed
   it (or talked over it) can hear it again via the 🔊 button. Feedback noises
   like "try again" are excluded so they never replace the instruction. */
let stepIntroAudio = null;
const NON_INSTRUCTION_SOUNDS = ['tryagain','greatjob','greatjobherecomesanotherone','yesamatch','itsyourturn'];
let replayAllowed = false;   // story pages have their own "Play to Hear the Story"
function noteInstruction(id){
  if(!replayAllowed || NON_INSTRUCTION_SOUNDS.includes(id)) return;
  stepIntroAudio = id;
  const b = document.getElementById('replayBtn');
  if(b) b.style.visibility = 'visible';
}
function replayInstruction(){ if(stepIntroAudio) playAudio(stepIntroAudio, '', null, ()=>{}); }
function playAudio(id, fallbackText, onDuration, onFail){
  noteInstruction(id);
  stopAudio();
  const myGen = audioGeneration;
  const el = new Audio(`audio/${id}.mp3?v=${Date.now()}`);
  el.volume = 0; // muted until 'canplay' confirms this is a real, decodable
                  // file — a 404 response can otherwise get fed to the
                  // decoder and produce a brief burst of noise before it
                  // errors out, right before the fallback voice kicks in
  let settled=false;   // guards onDuration — fires once
  let fellBack=false;  // guards the fallback voice — a missing file can
                        // trigger BOTH the 'error' event AND a rejected
                        // play() promise; without this it would speak
                        // the fallback text twice, overlapping itself
  const useFallback = ()=>{
    if(myGen !== audioGeneration) return;
    if(fellBack) return;
    fellBack = true;
    if(!settled){ settled=true; if(onDuration) onDuration(Math.max(fallbackText.split(' ').length*340,1400)); }
    if(onFail) onFail(); else say(fallbackText);
  };
  el.addEventListener('canplay', ()=>{
    if(myGen !== audioGeneration) return;
    el.volume = 1;
  });
  el.addEventListener('loadedmetadata', ()=>{
    if(myGen !== audioGeneration) return;
    if(settled) return; settled=true;
    if(onDuration) onDuration(el.duration*1000);
  });
  el.addEventListener('error', useFallback);
  currentAudio = el;
  el._playPromise = el.play();
  el._playPromise.catch(useFallback);
  return el;
}
/* Reads a page word-by-word using the real per-word clips (the same ones
   word-tap uses), highlighting each word as it plays. Any word without a
   real clip yet gets a single-word device-voice fallback with a short
   safety timeout, so one missing/misbehaving word can never stall the
   whole page — much lower-risk than falling back to reading the entire
   page with the robotic voice. */
let pageSeqGen = 0;
function playPageWordByWord(page, onAllDone){
  const mySeq = ++pageSeqGen;
  const words = PAGES[page].split(' ');
  const spans = document.querySelectorAll('#sceneText .word');
  let i = 0;
  const finish = ()=>{
    if(mySeq !== pageSeqGen) return;
    spans.forEach(s=>s.classList.remove('hi'));
    if(onAllDone) onAllDone();
  };
  const playOneWord = (word, onDone)=>{
    const file = wordToFilename(word);
    if(!file){ onDone(); return; }
    const el = new Audio(`audio/words/${file}.mp3?v=${Date.now()}`);
    el.volume = 0;
    let handled = false;
    const advance = ()=>{ if(handled) return; handled = true; if(mySeq===pageSeqGen) onDone(); };
    const wordFallback = ()=>{
      if(handled) return;
      if(mySeq !== pageSeqGen) return;
      sayAsViolet(word);
      setTimeout(advance, 900); // don't get stuck if the device voice also stays silent
    };
    el.addEventListener('canplay', ()=>{ if(mySeq===pageSeqGen) el.volume = 1; });
    el.addEventListener('ended', advance);
    el.addEventListener('error', wordFallback);
    currentAudio = el;
    el._playPromise = el.play();
    el._playPromise.catch(wordFallback);
    setTimeout(()=>{ if(!handled) wordFallback(); }, 2500); // absolute last resort
  };
  const step = ()=>{
    if(mySeq !== pageSeqGen) return;
    if(i >= words.length){ finish(); return; }
    spans.forEach(s=>s.classList.remove('hi'));
    if(spans[i]) spans[i].classList.add('hi');
    const clean = words[i].replace(/[^\w'?.!,-]/g,'');
    i++;
    playOneWord(clean, step);
  };
  step();
}
function playWordAudio(word, cleanForSpeech){
  const file = wordToFilename(word);
  if(!file){ return; }
  stopAudio(); // stop anything else playing (page narration, a previous word) first
  const myGen = audioGeneration;
  const audio = new Audio(`audio/words/${file}.mp3?v=${Date.now()}`);
  audio.volume = 0; // muted until confirmed real, same reasoning as playAudio()
  let handled=false;
  const fallback = ()=>{
    if(myGen !== audioGeneration) return;
    if(!handled){ handled=true; sayAsViolet(cleanForSpeech); }
  };
  audio.addEventListener('canplay', ()=>{ if(myGen===audioGeneration) audio.volume = 1; });
  audio.addEventListener('error', fallback);
  currentAudio = audio;
  audio._playPromise = audio.play();
  audio._playPromise.catch(fallback);
}

/* ---------- child's name ---------- */
let childName='';
try{ childName = localStorage.getItem('vl_childName') || ''; }catch(e){}
function confirmNameAndStart(){
  const input = document.getElementById('nameInput');
  childName = input.value.trim();
  try{ localStorage.setItem('vl_childName', childName); }catch(e){}
  document.getElementById('nameOverlay').style.display='none';
  afterName();
}
/* offer to continue if there's saved progress, otherwise pick a reading mode */
function afterName(){
  const p = loadProgress();
  if(p) showResumeChooser(p); else showModeChooser();
}
/* ---------- save & resume ----------
   iOS kills backgrounded apps constantly, and this is a 38-step story, so the
   current page is saved on every step. On launch we offer to pick up where the
   child left off instead of restarting from page 1. */
function saveProgress(){
  try{ localStorage.setItem('vl_progress', JSON.stringify({i:seqIndex, storyOnly:STORY_ONLY})); }catch(e){}
}
function loadProgress(){
  try{ const p = JSON.parse(localStorage.getItem('vl_progress')||'null');
       return (p && typeof p.i==='number' && p.i>0) ? p : null; }catch(e){ return null; }
}
function clearProgress(){ try{ localStorage.removeItem('vl_progress'); }catch(e){} }
/* shown after the name screen when there's something to come back to */
function showResumeChooser(p){
  STORY_ONLY = !!p.storyOnly;                       // so the page count matches their mode
  const steps = activeSteps();
  const idx = Math.min(p.i, steps.length-1);
  const ov = document.getElementById('resumeOverlay');
  document.getElementById('resumeTitle').textContent =
    childName ? 'Welcome back, '+childName+'!' : 'Welcome back!';
  document.getElementById('resumeWhere').textContent =
    (steps[idx] ? steps[idx].title : '') + ' — ' + (idx+1) + ' of ' + steps.length;
  ov.style.display = 'flex';
}
function resumeAdventure(){
  const p = loadProgress(); document.getElementById('resumeOverlay').style.display='none';
  if(!p){ showModeChooser(); return; }
  STORY_ONLY = !!p.storyOnly;
  seqIndex = Math.min(p.i, activeSteps().length-1);
  go('adventure'); enterStep();                      // straight back in — skip the welcome video
}
function restartAdventure(){
  clearProgress();
  document.getElementById('resumeOverlay').style.display='none';
  showModeChooser();
}
/* a toddler can't type — let them straight into the story with no name */
function skipName(){
  childName = '';
  try{ localStorage.setItem('vl_childName', ''); }catch(e){}
  document.getElementById('nameOverlay').style.display='none';
  afterName();
}
/* the name is shown on screen only — never spoken, since every voice line is a
   pre-recorded clip and there's no recording of an arbitrary child's name */
function possessiveName(){
  if(!childName) return '';
  return childName + (/[sS]$/.test(childName) ? "'" : "'s");
}

/* ---------- reading mode: story only, or story + games ----------
   STORY_ONLY filters the adventure down to just the story pages, so a parent
   can do a short bedtime read instead of the full 37-step adventure. The last
   choice is remembered and highlighted, but we still ask each time since the
   need changes (bedtime vs playtime). */
let STORY_ONLY = false;
try{ STORY_ONLY = localStorage.getItem('vl_storyOnly') === '1'; }catch(e){}
function activeSteps(){ return STORY_ONLY ? SEQUENCE.filter(s=>s.type==='scene') : SEQUENCE; }
function showModeChooser(){
  const ov = document.getElementById('modeOverlay');
  const t = document.getElementById('modeTitle');
  if(t) t.textContent = childName ? 'How do you want to read, '+childName+'?' : 'How do you want to read?';
  // highlight whichever mode was used last
  document.getElementById('modeStory').classList.toggle('last', STORY_ONLY);
  document.getElementById('modeGames').classList.toggle('last', !STORY_ONLY);
  ov.style.display = 'flex';
}
function chooseMode(storyOnly){
  STORY_ONLY = !!storyOnly;
  try{ localStorage.setItem('vl_storyOnly', STORY_ONLY ? '1':'0'); }catch(e){}
  document.getElementById('modeOverlay').style.display='none';
  startWelcomeVideo();
}
/* switch mode mid-story, staying on the page they're reading */
function toggleMode(){
  const current = activeSteps()[seqIndex];
  STORY_ONLY = !STORY_ONLY;
  try{ localStorage.setItem('vl_storyOnly', STORY_ONLY ? '1':'0'); }catch(e){}
  const steps = activeSteps();
  let i = steps.indexOf(current);
  if(i < 0){
    // they were on a game that story-only mode hides -> jump to the next story page
    const from = SEQUENCE.indexOf(current);
    for(let k=from;k<SEQUENCE.length;k++){ const j=steps.indexOf(SEQUENCE[k]); if(j>=0){ i=j; break; } }
    if(i < 0) i = steps.length-1;
  }
  seqIndex = Math.max(0, i);
  enterStep();
}

/* ---------- welcome video: plays once, right after the name is entered,
   before dropping into the adventure. Same play/skip/end pattern as the
   opening splash video below. ---------- */
const welcomeVideo = document.getElementById('welcomeVideo');
welcomeVideo.addEventListener('ended', endWelcome);
function startWelcomeVideo(){
  const vid = welcomeVideo, btn = document.getElementById('welcomeSkipBtn');
  vid.style.display = 'block';
  btn.style.display = 'block';
  vid.currentTime = 0;
  vid.volume = 0.5;   // the welcome clip is loud — play it at half volume
  vid._playPromise = vid.play();
  if(vid._playPromise && vid._playPromise.catch){ vid._playPromise.catch(()=>endWelcome()); }
}
function endWelcome(){
  const vid = welcomeVideo;
  const stopVideo = ()=>{ try{ vid.pause(); }catch(e){} };
  stopVideo();
  if(vid._playPromise && vid._playPromise.then){ vid._playPromise.then(stopVideo).catch(()=>{}); }
  vid.style.display = 'none';
  document.getElementById('welcomeSkipBtn').style.display = 'none';
  startAdventure();
}

/* ---------- opening video splash ---------- */
const splashVideo = document.getElementById('splashVideo');
splashVideo.addEventListener('ended', endSplash);
function startSplash(){
  document.getElementById('startOverlay').style.display='none';
  document.getElementById('skipBtn').style.display='block';
  splashVideo.currentTime = 0;
  splashVideo._playPromise = splashVideo.play();
  if(splashVideo._playPromise && splashVideo._playPromise.catch){ splashVideo._playPromise.catch(()=>endSplash()); }
}
/* video ends (or is skipped): freeze on the last frame and show name entry.
   Same race as the audio system — pausing right after play() is called can
   be silently ignored on some browsers until that play() promise settles,
   letting the video's own audio track keep playing underneath whatever
   comes next. Stop immediately AND again once play() actually resolves. */
function endSplash(){
  const stopVideo = ()=>{
    try{
      if(splashVideo.duration && !isNaN(splashVideo.duration)){ splashVideo.currentTime = splashVideo.duration; }
      splashVideo.pause();
    }catch(e){}
  };
  stopVideo();
  if(splashVideo._playPromise && splashVideo._playPromise.then){ splashVideo._playPromise.then(stopVideo).catch(()=>{}); }
  document.getElementById('skipBtn').style.display='none';
  const overlay = document.getElementById('nameOverlay');
  overlay.style.display='flex';
  const input = document.getElementById('nameInput');
  input.value = childName;
  setTimeout(()=>input.focus(), 50);
}
function replayIntro(){
  document.getElementById('startOverlay').style.display='flex';
  document.getElementById('nameOverlay').style.display='none';
  document.getElementById('skipBtn').style.display='none';
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('splash').classList.add('active');
}

/* ---------- top-level navigation ---------- */
function go(id){
  stopAudio();
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
/* the 🏠 button and the end of the story both go all the way back to
   the very beginning — replaying the opening video, same as a fresh
   app launch. There's no separate menu screen. */
function goToStart(){
  seqIndex = 0;
  clearProgress();   // finished (or went home) — next launch starts fresh
  replayIntro();
}

/* paint-by-number palette matching the numbered coloring page mockup */
const NUMBERED_PALETTE=[
  {num:1, hex:'#c9a9dc'}, {num:2, hex:'#6a3f96'}, {num:3, hex:'#f06fa0'},
  {num:4, hex:'#f5c344'}, {num:5, hex:'#8b5a2b'}, {num:6, hex:'#e8483a'}
];

/* ============================================================
   ADVENTURE SEQUENCE ENGINE
   Walks: scene -> color -> game -> scene -> color -> game -> home
   ============================================================ */
const SEQUENCE = [
  {type:'scene', page:1, art:'art/page1video2.png', video:'art/page1video3.mp4', title:'Meet Violet & Lainey'},

let seqIndex = 0;

function startAdventure(){ seqIndex = 0; go('adventure'); enterStep(); }

function nextArrowLabel(){
  const steps = activeSteps();
  if(seqIndex>=steps.length-1) return '🏠 Finish';
  const next = steps[seqIndex+1];
  if(next.type==='color') return '🎨 Color This Scene';
  if(next.type==='create') return '🎨 Create Your Own!';
  if(next.type==='game') return '🎮 Play the Game';
  if(next.type==='scene') return '➡️ Next Scene';
  return 'Next ➡️';
}
function stepForward(){
  if(seqIndex>=activeSteps().length-1){ goToStart(); return; }
  seqIndex++; enterStep();
}
function stepBack(){
  if(seqIndex<=0) return;
  seqIndex--; enterStep();
}
function enterStep(){
  const step = activeSteps()[seqIndex];
  saveProgress();          // remember this page so the app can resume here
  // reset the 🔊 replay button for this step (games only — story pages have their own play button)
  stepIntroAudio = null;
  replayAllowed = (step.type !== 'scene');
  const rb = document.getElementById('replayBtn');
  if(rb) rb.style.visibility = 'hidden';
  const mb = document.getElementById('modeBtn');
  if(mb){ mb.textContent = STORY_ONLY ? '📖' : '🎮'; mb.title = STORY_ONLY ? 'Story only — tap to add the games' : 'Story + games — tap for story only'; }
  // the very first page is titled "<Name>'s Adventure" so the child sees their
  // own name on the story they just started (shown, never spoken)
  document.getElementById('advTitle').textContent =
    (seqIndex===0 && childName) ? possessiveName()+' Adventure' : step.title;
  document.getElementById('backBtn').style.visibility = seqIndex===0 ? 'hidden':'visible';
  document.getElementById('nextBtn').textContent = nextArrowLabel();
  const stage = document.getElementById('stageArea');
  stopAudio();
  if(step.type==='scene') renderScene(step, stage);
  else if(step.type==='color') renderColor(step, stage);
  else if(step.type==='create') renderCreateCanvas(stage);
  else if(step.type==='game') renderGame(step, stage);
}

/* ---------- SCENE: real book page — read it, or tap any word to hear it ---------- */
function renderScene(step, stage){
  const text = PAGES[step.page];
  const words = text.split(' ');
  const art = step.video
    ? `<video id="sceneVideo" src="${step.video}?v=${Date.now()}" poster="${step.art}" playsinline preload="auto" muted></video>`
    : `<img src="${step.art}" alt="scene">`;
  stage.innerHTML = `
    <div class="bookPage">
      <div class="bookPageArt${step.video ? ' videoArt' : ''}">${art}</div>
      <button class="btn btn-violet playPageBtn" id="listenBtn" onclick="togglePageRead(${step.page})">▶️ Play to Hear the Story</button>
      <p class="wordHint">👆 Or tap a word to hear Violet say just that word!</p>
      <p class="bookPageText" id="sceneText"></p>
    </div>
  `;
  sceneVideoEl = step.video ? document.getElementById('sceneVideo') : null;
  if(sceneVideoEl){
    /* size the box to the video's real dimensions once known, so it
       always fills with no black bars whether the clip is portrait or
       landscape — the CSS aspect-ratio is just a placeholder till then */
    const applyRealRatio = ()=>{
      if(sceneVideoEl.videoWidth && sceneVideoEl.videoHeight){
        sceneVideoEl.parentElement.style.aspectRatio = sceneVideoEl.videoWidth+'/'+sceneVideoEl.videoHeight;
      }
    };
    if(sceneVideoEl.readyState >= 1) applyRealRatio();
    sceneVideoEl.addEventListener('loadedmetadata', applyRealRatio);
    /* the video is usually shorter than the narration, so replay it from
       the start each time it ends while the story is still being read —
       that way an 8s clip fills a 15s story instead of freezing early.
       It's muted, so restarting it never touches the narration audio. */
    sceneVideoEl.addEventListener('ended', ()=>{
      if(pageReadEl && pageReadEl===currentAudio && !pageReadEl.paused && !pageReadEl.ended){
        sceneVideoEl.currentTime = 0;
        sceneVideoEl.play().catch(()=>{});
      }
    });
    /* Chrome sometimes auto-pauses muted, audio-track-less video it thinks
       is decorative background media (a power-saving heuristic) — if that
       happens while the narration is still actively playing, resume it so
       the two stay in sync without the kid having to notice or tap again */
    sceneVideoEl.addEventListener('pause', ()=>{
      if(!document.hidden && !sceneVideoEl.ended && pageReadEl && pageReadEl===currentAudio && !pageReadEl.paused){
        sceneVideoEl.play().catch(()=>{});
      }
    });
  }
  const p = document.getElementById('sceneText');
  words.forEach(w=>{
    const span = document.createElement('span');
    span.className='word';
    span.textContent = w;
    span.addEventListener('click', ()=>tapWord(span, w));
    p.appendChild(span);
    p.appendChild(document.createTextNode(' '));
  });
  /* briefly wiggle the first couple words so kids notice they're tappable */
  const firstWords = p.querySelectorAll('.word');
  for(let i=0;i<Math.min(3,firstWords.length);i++){
    const w = firstWords[i];
    setTimeout(()=>{
      w.classList.add('invite');
      setTimeout(()=>w.classList.remove('invite'),1000);
    }, 500 + i*150);
  }
}
function tapWord(el, word){
  document.querySelectorAll('#sceneText .word.tapped').forEach(w=>w.classList.remove('tapped'));
  el.classList.add('tapped');
  const clean = word.replace(/[^\w'?.!,-]/g,'');
  playWordAudio(clean, clean);
  setTimeout(()=>el.classList.remove('tapped'),500);
}
/* optional: read the whole page aloud, for kids who'd rather just listen.
   No word-highlighting here on purpose — highlighting only happens when a
   kid taps a specific word themselves. Acts as a play/pause/resume toggle. */
let pageReadEl = null;
let pageWordSeqRunning = false;
function togglePageRead(page){
  const btn = document.getElementById('listenBtn');
  // playing a real whole-page clip -> pause it, keeping position
  if(pageReadEl && pageReadEl===currentAudio && !pageReadEl.paused){
    pageReadEl.pause();
    if(sceneVideoEl) sceneVideoEl.pause();
    if(btn) btn.textContent = '▶️ Resume the Story';
    return;
  }
  // paused mid-way -> resume from where it left off
  if(pageReadEl && pageReadEl===currentAudio && pageReadEl.paused && !pageReadEl.ended){
    const p = pageReadEl.play();
    pageReadEl._playPromise = p;
    if(sceneVideoEl) sceneVideoEl.play().catch(()=>{});
    if(btn) btn.textContent = '⏸ Pause';
    return;
  }
  // a word-by-word sequence is running -> tap again just stops it
  if(pageWordSeqRunning){
    pageSeqGen++; // invalidates the running sequence, its own cleanup handles the rest
    pageWordSeqRunning = false;
    stopAudio();
    if(btn) btn.textContent = '▶️ Play to Hear the Story';
    return;
  }
  // fresh start: try the real whole-page recording first, otherwise fall
  // back to a single continuous device-voice reading (word-by-word
  // chaining sounded too choppy — one flowing line beats a stitched-
  // together one, even in a more robotic voice)
  const text = PAGES[page];
  pageReadEl = playAudio('page'+page, text);
  if(sceneVideoEl){ sceneVideoEl.currentTime = 0; sceneVideoEl.play().catch(()=>{}); }
  if(btn) btn.textContent = '⏸ Pause';
  if(pageReadEl){
    pageReadEl.addEventListener('ended', ()=>{
      const b=document.getElementById('listenBtn'); if(b) b.textContent='▶️ Play to Hear the Story';
      if(sceneVideoEl){ sceneVideoEl.pause(); sceneVideoEl.currentTime = 0; }
    });
  }
}

function pickColor(c,el){ curColor=c; document.querySelectorAll('.swatch').forEach(s=>s.classList.remove('sel')); el.classList.add('sel'); }
function pickBucket(hex, btn){ curColor=hex; document.querySelectorAll('.bucketZone').forEach(b=>b.classList.remove('sel')); btn.classList.add('sel'); }
function resetColor(){ if(colorCtx && colorOriginal) colorCtx.putImageData(colorOriginal,0,0); }
/* when they're done, the reward video (16:9) plays right where the picture
   was. In the paint studio it stays on the same page — the attic + buckets
   remain and the video takes the picture's spot; on the plain layout it swaps
   the whole coloring area. Advances when the video finishes. It's a tap, so
   it plays with sound; muted fallback if blocked; advances even if it can't
   load. */
function finishColoring(){
  const frame = document.querySelector('.paintCanvasFrame');
  if(frame){
    // studio: keep the background + buckets, drop the video into the picture spot
    const tools = document.querySelector('.studioTools'); if(tools) tools.remove();
    document.querySelectorAll('.bucketZone').forEach(b=>b.style.pointerEvents='none');
    const wrap = document.createElement('div');
    wrap.className = 'paintStudioReward';
    wrap.innerHTML = '<video id="paintRewardVid" playsinline preload="auto"></video>';
    frame.replaceWith(wrap);
    playPaintRewardVideo(document.getElementById('paintRewardVid'));
    return;
  }
  const stage = document.getElementById('stageArea');
  if(!stage){ stepForward(); return; }
  stage.innerHTML = `<div class="paintRewardWrap"><video id="paintRewardVid" playsinline preload="auto"></video></div>`;
  playPaintRewardVideo(document.getElementById('paintRewardVid'));
}
function playPaintRewardVideo(vid, src, onEnd){
  vid.src = (src || 'art/paintreward.mp4')+'?v='+Date.now();
  let done=false;
  const finish = ()=>{ if(done) return; done=true; (onEnd || stepForward)(); };
  vid.addEventListener('ended', finish);
  vid.addEventListener('error', finish);
  vid.muted = false;
  const p = vid.play();
  if(p && p.catch){
    p.catch(()=>{
      vid.muted = true;
      vid.addEventListener('playing', ()=>{ vid.muted = false; }, {once:true});
      const p2 = vid.play();
      if(p2 && p2.catch){ p2.catch(finish); }
    });
  }
}

function ccStart(which){

    canvas.width = Math.round(r.width); canvas.height = Math.round(r.height);

function ccPos(canvas, e){
  const r = canvas.getBoundingClientRect();
  return { x:(e.clientX-r.left)*(canvas.width/r.width), y:(e.clientY-r.top)*(canvas.height/r.height) };
}
function ccBindDraw(canvas){
  // finger painting — no brush cursor, the finger IS the brush
  const start=(e)=>{ if(!ccCtx) return; ccDrawing=true; const p=ccPos(canvas,e); ccCtx.strokeStyle=ccColor; ccCtx.lineWidth=ccBrush; ccCtx.beginPath(); ccCtx.moveTo(p.x,p.y); ccCtx.lineTo(p.x+0.1,p.y+0.1); ccCtx.stroke(); e.preventDefault(); };
  const move=(e)=>{ if(!ccDrawing||!ccCtx) return; const p=ccPos(canvas,e); ccCtx.lineTo(p.x,p.y); ccCtx.stroke(); e.preventDefault(); };
  const end=()=>{ ccDrawing=false; };
  canvas.addEventListener('pointerdown', start);
  canvas.addEventListener('pointermove', move);
  window.addEventListener('pointerup', end);
}
function ccClear(){ if(ccCtx) ccCtx.clearRect(0,0,ccCtx.canvas.width,ccCtx.canvas.height); }

function onCanvasClick(e){
  const canvas = e.currentTarget;

  const scaleX = canvas.width/rect.width, scaleY = canvas.height/rect.height;
  const x = Math.floor((e.clientX-rect.left)*scaleX);

function hexToRgb(hex){
  const n = parseInt(hex.slice(1),16);
  return [(n>>16)&255,(n>>8)&255,n&255];
}
function floodFill(ctx, w, h, x, y, fillRgb){
  if(x<0||y<0||x>=w||y>=h) return;
  const imgData = ctx.getImageData(0,0,w,h);
  const data = imgData.data;
  const startIdx = (y*w+x)*4;
  const sr=data[startIdx], sg=data[startIdx+1], sb=data[startIdx+2];
  if(sr<60 && sg<60 && sb<60) return; // tapped a black outline — do nothing
  if(Math.abs(sr-fillRgb[0])<12 && Math.abs(sg-fillRgb[1])<12 && Math.abs(sb-fillRgb[2])<12) return;
  const tol=2600; // squared color-distance tolerance
  const visited = new Uint8Array(w*h);
  const stack=[y*w+x];
  while(stack.length){
    const idx0 = stack.pop();
    if(visited[idx0]) continue;
    const idx = idx0*4;
    const dr=data[idx]-sr, dg=data[idx+1]-sg, db=data[idx+2]-sb;
    if((dr*dr+dg*dg+db*db) > tol) continue;
    visited[idx0]=1;
    data[idx]=fillRgb[0]; data[idx+1]=fillRgb[1]; data[idx+2]=fillRgb[2]; data[idx+3]=255;
    const cx = idx0 % w, cy = (idx0 / w) | 0;
    if(cx>0) stack.push(idx0-1);
    if(cx<w-1) stack.push(idx0+1);
    if(cy>0) stack.push(idx0-w);
    if(cy<h-1) stack.push(idx0+w);
  }
  ctx.putImageData(imgData,0,0);
}

  else if(step.id==='fish') renderFishGame(stage);
  else if(step.id==='hideSeek') renderHideSeekGame(stage);
  else if(step.id==='firefly') renderFireflyGame(stage);
  else if(step.id==='cricket') renderRockNapGame(stage);
  else if(step.id==='fountain') renderFountainGame(stage);
  else if(step.id==='apple') renderAppleGame(stage);
  else if(step.id==='stayAwake') renderAwakeGame(stage);
  else if(step.id==='paint') renderPaintGame(stage);
  else if(step.id==='tuckin') renderTuckInGame(stage);
  else if(step.id==='sheep') renderSheepGame(stage);
  else if(step.id==='napTuck') renderNapTuckGame(stage);
  else if(step.id==='treasure') renderTreasureGame(stage);

/* a reserved slot for a game that hasn't been built yet — just shows a
   friendly "coming soon" message so the story can still be played
